{{- $scaleSetName := required "runnerScaleSetName is required" .Values.runnerScaleSetName }}
{{- $claimed := dict }}
{{- range $i, $scaleSet := .Values.scaleSets }}
{{- $name := required (printf "scaleSets[%d].name is required" $i) $scaleSet.name }}
{{- $helmReleaseName := default $name $scaleSet.helmReleaseName }}
{{- $namespace := default (include "arc-runner-scale-set.namespace" $name) $scaleSet.namespace }}
{{- $_ := required (printf "scaleSets[%d].githubConfigUrl is required" $i) $scaleSet.githubConfigUrl }}
{{- /*
  Two names can land on one namespace: `a.b` and `a_b` both normalize to
  arc-a-b, and names diverging only past 59 characters both survive trunc 63.
  Sharing a namespace means sharing an AutoscalingRunnerSet, since every scale
  set names it runnerScaleSetName, so one silently overwrites the other. Refuse
  instead, and say which entry to give an explicit namespace.
*/}}
{{- if hasKey $claimed $namespace }}
{{- fail (printf "scaleSets[%d].name %q resolves to namespace %q, already claimed by %q. Set an explicit namespace on one of them." $i $name $namespace (get $claimed $namespace)) }}
{{- end }}
{{- $_ := set $claimed $namespace $name }}
{{- $values := mergeOverwrite (deepCopy $.Values.defaults) (omit $scaleSet "name" "helmReleaseName" "namespace" "nixStorageSize") }}
{{- $_ := set $values "namespaceOverride" $namespace }}
{{- $_ := set $values "runnerScaleSetName" $scaleSetName }}
{{- /*
  nixStorageSize resizes the nix volume without restating the whole volumes
  list. mergeOverwrite replaces lists wholesale, so an entry that wanted a
  bigger store otherwise had to repeat every volume the defaults declare, and
  dropping one leaves its volumeMount dangling and the pod unschedulable.

  Transitional. The store is moving off this per-pod PVC onto a node-local
  directory, and this option goes with it.
*/}}
{{- if $scaleSet.nixStorageSize }}
{{- $nixVolume := "" }}
{{- range $volume := (dig "template" "spec" "volumes" list $values) }}
{{- if eq (dig "name" "" $volume) "nix" }}
{{- $nixVolume = $volume }}
{{- end }}
{{- end }}
{{- if not $nixVolume }}
{{- fail (printf "scaleSets[%d] (%s) sets nixStorageSize, but no volume named \"nix\" survived the merge into template.spec.volumes. An entry supplying its own volumes list replaces the defaults wholesale; either include a nix volume there or drop nixStorageSize." $i $name) }}
{{- end }}
{{- $requests := dig "ephemeral" "volumeClaimTemplate" "spec" "resources" "requests" "" $nixVolume }}
{{- if not $requests }}
{{- fail (printf "scaleSets[%d] (%s) sets nixStorageSize, but the \"nix\" volume is not an ephemeral claim with spec.resources.requests. nixStorageSize only sizes an ephemeral volumeClaimTemplate." $i $name) }}
{{- end }}
{{- $_ := set $requests "storage" $scaleSet.nixStorageSize }}
{{- end }}
---
# The githubConfigSecret named in defaults must already exist here. It is sealed
# cluster-wide once and fanned out across these namespaces by
# `make apps/arc-runners/thecluster-bot-sealed.yml`, which reads the namespaces
# back out of this template so the two cannot drift.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $helmReleaseName }}
  namespace: {{ $.Release.Namespace }}
spec:
  chartRef:
    kind: OCIRepository
    name: {{ required "chartRef.name is required" $.Values.chartRef.name }}
    namespace: {{ required "chartRef.namespace is required" $.Values.chartRef.namespace }}
  interval: {{ required "interval is required" $.Values.interval }}
  values:
    {{- toYaml $values | nindent 4 }}
{{- end }}
