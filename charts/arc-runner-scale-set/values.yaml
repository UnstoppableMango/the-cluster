# OCIRepository reference for gha-runner-scale-set (created by arc-system)
chartRef:
  name: gha-runner-scale-set
  namespace: arc-system

# Interval applied to all generated HelmReleases
interval: 10m

# GitHub name every scale set registers under, i.e. the `runs-on` label. The
# upstream chart derives the AutoscalingRunnerSet object name from this value,
# so sharing it across scale sets is only safe because each one gets its own
# namespace — see templates/_helpers.tpl.
runnerScaleSetName: thecluster

# Defaults merged into every HelmRelease's values block.
# These are gha-runner-scale-set values — anything valid there works here.
# namespaceOverride and runnerScaleSetName are set by the chart and cannot be
# overridden per entry.
#
# githubConfigSecret names a Secret this chart does not create. It has to exist
# in every namespace the chart renders, which is what
# `make apps/arc-runners/thecluster-bot-sealed.yml` produces.
defaults:
  githubConfigSecret: thecluster-bot
  template:
    spec:
      # Makes gid 1001 the group owner of the work volume below and adds it to
      # the runner process's supplementary groups. It does not reach /nix: that
      # is a hostPath, and kubelet applies ownership only to volumes whose
      # mounter reports itself managed, which hostPath does not, so init-nix is
      # the only thing that makes the store writable. An entry that brings CSI
      # volumes of its own, as apps/arc-runners does with work, relies on the
      # same setting.
      securityContext:
        fsGroup: 1001
      # The nix store is per node, so runners spread over five nodes mean five
      # copies of it and a cold one wherever traffic is thin. Prefer the two
      # large nodes to keep it warm; preferred rather than required so a burst
      # spills instead of queueing. The runner's cpu limit of 8 already rules
      # out castor and pollux.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [gaea, zeus]
      initContainers:
        # The image ships /nix as an empty directory owned by the runner, but a
        # volume mounted over it brings its own ownership. Kubelet creates the
        # hostPath below root:root 0755 and applies no fsGroup to it, so the
        # runner cannot write there until this container hands it over. Every
        # later pod finds it runner:runner 0755 and both commands are no-ops.
        # The upstream chart appends these after the dind ones.
        #
        # Not recursive, and it has to stay that way: the store persists on the
        # node and holds millions of files, so a recursive chown is the mistake
        # apps/hercules-ci documents under fsGroupChangePolicy, and this
        # container starts while jobs in other pods build in the same directory.
        # One chown of the mount root is enough because every pod writing there
        # runs as uid 1000 from the same image; an image that changes the runner
        # uid needs the node directory reset rather than a recursive chown. See
        # docs/arc-nix-store.md.
        #
        # The mode is five digits because a numeric chmod of four digits or
        # fewer preserves a directory's setuid and setgid bits; 00755 is what
        # actually clears a setgid the node directory may carry.
        - name: init-nix
          image: ghcr.io/unmango/actions-runner:2.337.0@sha256:7871210f6be2fd471a21b199922b9067c0f5da15e31987dd84f29d97690a2a90
          command: [sh, -c, 'chown runner:runner /nix && chmod 00755 /nix']
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: nix
              mountPath: /nix
      containers:
        # The image ships /nix empty and its nix.conf sets `store = local`, so
        # the store and nix's build directory land on whatever is mounted there
        # rather than on the container's overlayfs. Its nix, gnumake and xz are
        # static copies in /usr/local/bin with their store references nuked, so
        # they keep working with the volume over /nix.
        - name: runner
          image: ghcr.io/unmango/actions-runner:2.337.0@sha256:7871210f6be2fd471a21b199922b9067c0f5da15e31987dd84f29d97690a2a90
          command: [/home/runner/run.sh]
          env:
            # ncps binary cache, reachable in-cluster only. The image's nix is
            # daemonless, so there is no daemon to gate these against a
            # trusted-users list and every setting here applies as written.
            - name: NIX_CONFIG
              value: |
                extra-substituters = http://ncps.nix-system.svc.cluster.local:8501
                extra-trusted-public-keys = ncps.thecluster.lan:pAJGNVSRmG7gCDSOAaiHDxLFUSdys5Pk0XvcJ5803Dw=
                # The store is the node's, on the node root filesystem, and
                # nothing else bounds it: a hostPath is invisible to the
                # scheduler's ephemeral-storage accounting. Nix statvfs's that
                # filesystem and collects when free space falls below min-free,
                # stopping at max-free. Both live in libstore rather than the
                # daemon protocol, so they apply in this daemonless client.
                #
                # 64 GiB, because kubelet evicts at nodefs.available < 10% and
                # gaea's 500GB root puts that at 46.6 GiB: anything smaller
                # lets kubelet evict pods before nix ever collects. max-free
                # bounds the damage. Left unset it is effectively unbounded,
                # and by nix's reckoning the warm store is all garbage the
                # moment a job's nix develop exits, so one trigger would delete
                # the cache this volume exists to keep.
                min-free = 68719476736
                max-free = 103079215104
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            # Left unmounted, nix's build directory is the container's overlayfs
            # layer, where nix fails to tear down a build directory it just
            # emptied:
            #
            #   error: cannot unlink ".../project/.git": Directory not empty
            #
            # It bites the derivations that write many small files, treefmt's
            # `git init && git add .` check being the reliable one.
            - name: nix
              mountPath: /nix
      volumes:
        # Left unmounted, /home/runner/_work is the container's writable overlay
        # layer, so a checkout, its build outputs and any docker context land on
        # the node's root disk unbounded.
        #
        # Both halves have to be spelled out because nothing here sets
        # containerMode. Upstream only falls back to an emptyDir work volume
        # under containerMode dind or kubernetes, and only its dind runner
        # container appends the /home/runner/_work mount to a runner that omits
        # one; the default-mode container passes volumeMounts through as given.
        - name: work
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: fast-rwo
                resources:
                  requests:
                    storage: 5Gi
        # A node-local store, shared by every runner pod on the node and warm
        # after the first one. An ephemeral PVC here handed every job an empty
        # store: 1516 MB of closure realised from ncps in 112.3s against 8.2s
        # for the second nix develop in the same job, and fast-rwo lands on the
        # SSD pool in zeus, so a runner on gaea wrote its whole store over the
        # network, replicated twice.
        #
        # Still not an emptyDir: kubelet creates one mode 0777 and nix refuses a
        # build directory with a world-writable ancestor. Kubelet creates this
        # path 0755 and init-nix takes ownership of it.
        #
        # docs/arc-nix-store.md covers what concurrent pods sharing one store
        # can and cannot do to each other, what auto-GC takes with it, and how
        # to reset the node directory.
        - name: nix
          hostPath:
            path: /var/lib/arc/nix
            type: DirectoryOrCreate

# One entry per scale set. Each is merged with defaults (entry wins on conflict).
# Required per entry: name, githubConfigUrl
# Optional per entry: helmReleaseName (defaults to name), namespace (defaults to
# arc-<name>, dots and underscores replaced with dashes)
# All other gha-runner-scale-set values are valid (minRunners, containerMode, template, etc.)
#
# Careful: mergeOverwrite replaces lists wholesale, so an entry that supplies its
# own template.spec.containers drops the defaults above, including command, the
# NIX_CONFIG substituter and auto-GC settings, and the /nix volumeMount; one
# that supplies its own template.spec.volumes drops the work volume and the
# node-local nix store, leaving _work on the container's overlay layer and /nix
# with nothing mounted over it; one that supplies its own
# template.spec.initContainers drops init-nix. Repeat whichever list you
# override, resources included, or the entry runs unsized.
#
# affinity is a map and deep-merges, but an entry supplying its own
# preferredDuringSchedulingIgnoredDuringExecution replaces that list and loses
# the node preference the store's warmth depends on.
#
# containerMode: dind renders its own init-dind-externals and dind containers
# and discards any the values supply, which leaves those two with no resources.
# Spell the dind wiring out under template.spec instead, as
# apps/arc-runners/helm-release.yml does.
scaleSets: []
