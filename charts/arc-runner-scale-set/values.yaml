# OCIRepository reference for gha-runner-scale-set (created by arc-system)
chartRef:
  name: gha-runner-scale-set
  namespace: arc-system

# Interval applied to all generated HelmReleases
interval: 10m

# The `runs-on` label every scale set registers under. Sharing it is safe only
# because each scale set gets its own namespace; see templates/_helpers.tpl.
runnerScaleSetName: thecluster

# Defaults merged into every HelmRelease's values block. Any gha-runner-scale-set
# value works here, except namespaceOverride and runnerScaleSetName, which the
# chart sets.
#
# githubConfigSecret must exist in every rendered namespace; see
# `make apps/arc-runners/thecluster-bot-sealed.yml`.
defaults:
  githubConfigSecret: thecluster-bot
  template:
    spec:
      securityContext:
        fsGroup: 1001
      initContainers:
        # A CSI volume comes up root:fsGroup 2775, and the setgid bit leaks into every
        # store path. Five digits, because a four-digit chmod keeps setgid.
        - name: init-nix
          image: ghcr.io/unmango/actions-runner:2.338.2@sha256:405ea8d424026dc4f4ead3c0e1f3fc425ec7789e99dcf9dd23e4fbcdca827eaa
          command: [sh, -c, 'chown runner:runner /nix && chmod 00755 /nix']
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: nix
              mountPath: /nix
      containers:
        - name: runner
          image: ghcr.io/unmango/actions-runner:2.338.2@sha256:405ea8d424026dc4f4ead3c0e1f3fc425ec7789e99dcf9dd23e4fbcdca827eaa
          command: [/home/runner/run.sh]
          env:
            - name: NIX_CONFIG
              value: |
                extra-substituters = http://ncps.nix-system.svc.cluster.local:8501
                extra-trusted-public-keys = ncps.thecluster.lan:pAJGNVSRmG7gCDSOAaiHDxLFUSdys5Pk0XvcJ5803Dw=
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            # On the overlayfs layer nix fails to remove build directories:
            #   error: cannot unlink ".../project/.git": Directory not empty
            - name: nix
              mountPath: /nix
      volumes:
        # Without a volume, _work lands on the node's root disk unbounded. Upstream adds
        # one only under containerMode dind or kubernetes.
        - name: work
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: standard-rwo
                resources:
                  requests:
                    storage: 5Gi
        # Not an emptyDir: kubelet makes those 0777, and nix refuses a world-writable
        # ancestor of a build directory.
        - name: nix
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: standard-rwo
                resources:
                  requests:
                    storage: 20Gi

# One entry per scale set, merged over defaults (entry wins).
# Required: name, githubConfigUrl.
# Optional: helmReleaseName (defaults to name), namespace (defaults to arc-<name>,
# dots and underscores replaced with dashes), nixStorageSize, and any
# gha-runner-scale-set value.
#
# nixStorageSize sizes the nix volume without restating the volumes list.
#
# mergeOverwrite replaces lists wholesale. An entry that supplies
# template.spec.containers, volumes or initContainers drops the defaults in that
# list, resources included, so repeat whichever list you override.
#
# containerMode: dind discards the values' init-dind-externals and dind
# containers, leaving them unsized. Spell dind out under template.spec instead,
# as apps/arc-runners/helm-release.yml does.
scaleSets: []
