apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  releaseName: kube-prometheus-stack
  targetNamespace: monitoring
  # The CRDs come from the prometheus-operator-crds release in prometheus-operator-crds/, so that
  # ServiceMonitors elsewhere can depend on them without waiting on this
  # release and its Ceph-backed volumes.
  install:
    crds: Skip
  upgrade:
    crds: Skip
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 91.5.3
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    crds:
      enabled: false
    # Only prometheus carries the chart's sizing; every other component in the
    # stack defaults to none. No CPU limits: a scrape or an evaluation cycle
    # that gets throttled shows up as gaps in the series rather than as load.
    grafana:
      enabled: true
      grafana.ini:
        server:
          # The OAuth callback needs one canonical host, and it has to be the
          # public one: Dex only redirects back to prom.thecluster.io.
          root_url: https://prom.thecluster.io
        auth.generic_oauth:
          enabled: true
          name: Dex
          client_id: grafana
          scopes: openid profile email groups
          auth_url: https://dex.thecluster.io/auth
          token_url: https://dex.thecluster.io/token
          api_url: https://dex.thecluster.io/userinfo
          use_pkce: true
          # Dex refuses anyone outside the unmango org, so every
          # account that reaches Grafana is an org member.
          role_attribute_path: "'Admin'"
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oidc
            key: client-secret
      persistence:
        enabled: true
        storageClassName: ssd-rbd
        size: 10Gi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 1Gi
      initChownData:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
      # Covers both dashboard and datasource sidecars.
      sidecar:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    prometheusOperator:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      # The operator injects this sidecar into the Prometheus and Alertmanager
      # pods; it has no key under prometheus or alertmanager.
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
      admissionWebhooks:
        patch:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
    # etcd, the scheduler, the controller-manager, and kube-proxy run as NixOS
    # services rather than pods, so these targets would only ever be down.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus:
      prometheusSpec:
        # Select monitors and rules from every namespace, not only those
        # labelled with this release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        retention: 15d
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 4Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: unsafe-rbd
              resources:
                requests:
                  storage: 50Gi
    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: unsafe-rbd
              resources:
                requests:
                  storage: 10Gi
