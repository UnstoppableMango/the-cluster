apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  maxHistory: 2
  releaseName: kube-prometheus-stack
  targetNamespace: monitoring
  # CRDs come from prometheus-operator-crds/, so ServiceMonitors elsewhere need
  # not wait on this release and its Ceph volumes.
  install:
    crds: Skip
  upgrade:
    crds: Skip
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.22.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    crds:
      enabled: false
    # Only prometheus carries the chart's sizing; the rest default to none.
    # No CPU limits beyond prometheus: a throttled scrape or evaluation shows up as
    # gaps in the series.
    grafana:
      enabled: true
      grafana.ini:
        server:
          # Keycloak only redirects back to the public host.
          root_url: https://prom.thecluster.io
        auth:
          # Matches users created through Dex to their Keycloak login. Keycloak only
          # issues tokens for users declared in UnstoppableMango/iam, so the email is
          # not attacker-chosen.
          oauth_allow_insecure_email_lookup: true
        auth.generic_oauth:
          enabled: true
          name: THECLUSTER
          client_id: grafana
          scopes: openid profile email groups
          # Grafana calls these two directly: the public host sits behind Cloudflare
          # and Anubis.
          auth_url: https://auth.thecluster.io/realms/thecluster/protocol/openid-connect/auth
          token_url: http://keycloak-http.keycloak.svc/realms/thecluster/protocol/openid-connect/token
          api_url: http://keycloak-http.keycloak.svc/realms/thecluster/protocol/openid-connect/userinfo
          signout_redirect_url: https://auth.thecluster.io/realms/thecluster/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fprom.thecluster.io%2Flogin
          use_pkce: true
          # Anyone in neither group is refused.
          role_attribute_path: "contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'grafana-viewers') && 'Viewer'"
          role_attribute_strict: true
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oidc
            key: client-secret
      persistence:
        enabled: true
        storageClassName: ssd-rbd
        size: 10Gi
      # The RWO volume cannot attach to a surge pod on another node.
      deploymentStrategy:
        type: Recreate
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 1Gi
      initChownData:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
      sidecar:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    prometheusOperator:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      # The operator injects this sidecar; it has no key under prometheus or alertmanager.
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
      admissionWebhooks:
        patch:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
    # These run as NixOS services, not pods.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        retention: 15d
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 4Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: unsafe-rbd
              resources:
                requests:
                  storage: 50Gi
    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: unsafe-rbd
              resources:
                requests:
                  storage: 10Gi
