apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: nvidia-device-plugin
spec:
  interval: 10m
  maxHistory: 2
  releaseName: nvidia-device-plugin
  targetNamespace: nvidia-device-plugin
  chart:
    spec:
      chart: nvidia-device-plugin
      version: 0.20.2
      sourceRef:
        kind: HelmRepository
        name: nvidia-device-plugin
  values:
    # The image lacks NVML; the class's handler mounts it from the host.
    runtimeClassName: nvidia
    # No CPU limit: kubelet drops `nvidia.com/gpu` if the plugin stops answering.
    # Top-level, since this chart version ignores devicePlugin.resources.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
