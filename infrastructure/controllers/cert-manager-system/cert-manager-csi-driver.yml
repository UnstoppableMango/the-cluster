apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-csi-driver
  namespace: cert-manager
spec:
  interval: 30m
  # A DaemonSet rolls out one node at a time (maxUnavailable: 1, maxSurge: 0)
  # and each node pulls three images, so the 5m default is not enough on a
  # cluster whose node set changes.
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  releaseName: cert-manager-csi-driver
  targetNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager-csi-driver
      version: v0.15.0
      sourceRef:
        kind: HelmRepository
        name: jetstack
  # https://github.com/cert-manager/csi-driver/blob/main/deploy/charts/csi-driver/values.yaml
  values:
    image:
      repository: quay.io/jetstack/cert-manager-csi-driver
      tag: v0.15.0
    nodeDriverRegistrarImage:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.17.0
    livenessProbeImage:
      repository: registry.k8s.io/sig-storage/livenessprobe
      tag: v2.19.0
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    # pik8s4-6 carry the legacy master taint plus a custom unschedulable taint,
    # so both must be tolerated to land there. This mirrors kube-system/coredns,
    # the only workload that currently runs on them. The control-plane key is
    # kept for when the legacy taint is replaced.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: unschedulable
        operator: Exists
        effect: NoSchedule
