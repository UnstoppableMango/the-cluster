apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-csi-driver
  namespace: cert-manager
spec:
  interval: 30m
  maxHistory: 2
  # The DaemonSet rolls out one node at a time, three images each.
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  releaseName: cert-manager-csi-driver
  targetNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager-csi-driver
      version: v0.16.1
      sourceRef:
        kind: HelmRepository
        name: jetstack
  # https://github.com/cert-manager/csi-driver/blob/main/deploy/charts/csi-driver/values.yaml
  values:
    image:
      repository: quay.io/jetstack/cert-manager-csi-driver
      tag: v0.16.1
    nodeDriverRegistrarImage:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.18.0
    livenessProbeImage:
      repository: registry.k8s.io/sig-storage/livenessprobe
      tag: v2.20.0
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    # No tolerations: pik8s4-6 mount no csi-driver volumes and have no memory to spare.
  # The two sidecars have no values key. Strategic merge keys off container names.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: cert-manager-csi-driver
            patch: |-
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: cert-manager-csi-driver
              spec:
                template:
                  spec:
                    containers:
                      - name: node-driver-registrar
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            memory: 64Mi
                      - name: liveness-probe
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            memory: 64Mi
