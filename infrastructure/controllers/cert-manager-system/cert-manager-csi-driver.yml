apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-csi-driver
  namespace: cert-manager
spec:
  interval: 30m
  maxHistory: 2
  # A DaemonSet rolls out one node at a time (maxUnavailable: 1, maxSurge: 0)
  # and each node pulls three images, so the 5m default is not enough on a
  # cluster whose node set changes.
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  releaseName: cert-manager-csi-driver
  targetNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager-csi-driver
      version: v0.16.0
      sourceRef:
        kind: HelmRepository
        name: jetstack
  # https://github.com/cert-manager/csi-driver/blob/main/deploy/charts/csi-driver/values.yaml
  values:
    image:
      repository: quay.io/jetstack/cert-manager-csi-driver
      tag: v0.16.0
    nodeDriverRegistrarImage:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.18.0
    livenessProbeImage:
      repository: registry.k8s.io/sig-storage/livenessprobe
      tag: v2.20.0
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    # No tolerations, so the DaemonSet skips pik8s4-6: they carry the legacy
    # master taint plus a custom unschedulable one, and tolerating both is the
    # only way onto them. Nothing scheduled there mounts a csi-driver volume,
    # and the three containers reserve 120m of CPU and 256Mi per node on
    # machines whose whole budget is 4 GiB against a kube-apiserver that wants
    # over 2 of it.
  # The chart's `resources` above covers only the driver container; the two
  # sidecars it renders have no values key at all and would run unsized. The
  # patch is a strategic merge rather than JSON6902 so it keys off the container
  # name, which a chart bump cannot reorder out from under it.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: cert-manager-csi-driver
            patch: |-
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: cert-manager-csi-driver
              spec:
                template:
                  spec:
                    containers:
                      - name: node-driver-registrar
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            memory: 64Mi
                      - name: liveness-probe
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            memory: 64Mi
