apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  interval: 30m
  maxHistory: 2
  releaseName: trust-manager
  targetNamespace: cert-manager
  chart:
    spec:
      chart: trust-manager
      version: v0.26.0
      sourceRef:
        kind: HelmRepository
        name: jetstack
  values:
    image:
      repository: quay.io/jetstack/trust-manager
      tag: v0.26.0
    # Debian's CA certificates for useDefaultCAs, which the unifi truststore needs.
    defaultPackage:
      enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
