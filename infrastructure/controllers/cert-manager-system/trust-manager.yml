apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  interval: 30m
  releaseName: trust-manager
  targetNamespace: cert-manager
  chart:
    spec:
      chart: trust-manager
      version: v0.25.0
      sourceRef:
        kind: HelmRepository
        name: jetstack
  # https://github.com/cert-manager/trust-manager/tree/main/deploy/charts/trust-manager
  values:
    image:
      repository: quay.io/jetstack/trust-manager
      tag: v0.25.0
    # An init container carrying Debian's CA certificates, which is what
    # useDefaultCAs on a Bundle source reads. The unifi truststore needs the
    # public CAs beside thecluster.lan, since it replaces the JVM's own. The
    # image version rides along with the chart.
    defaultPackage:
      enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
