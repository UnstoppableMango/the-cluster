apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  releaseName: cert-manager
  targetNamespace: cert-manager
  install:
    crds: Skip
  upgrade:
    crds: Skip
  chart:
    spec:
      chart: cert-manager
      version: v1.21.1
      sourceRef:
        kind: HelmRepository
        name: jetstack
  # https://artifacthub.io/packages/helm/cert-manager/cert-manager
  values:
    crds:
      enabled: false
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    enableCertificateOwnerRef: true
    # Each of the four components defaults to no resources, which leaves the
    # whole of cert-manager BestEffort and first in line for eviction. All four
    # idle at 1m CPU and 12-44Mi. No CPU limits: the controller and cainjector
    # renew a leader lease, and throttling one costs the lease.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    startupapicheck:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
