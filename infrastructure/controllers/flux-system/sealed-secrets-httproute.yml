# The sealed-secrets install itself lives in controllers/sealed-secrets-system,
# which is the copy the running cluster reconciles. Only the route belongs here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  parentRefs:
    - name: nginx
      namespace: nginx-gateway
  hostnames:
    - sealed-secrets.thecluster.lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sealed-secrets-controller
          port: 8080
