apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pulumi-kubernetes-operator
  namespace: pulumi-system
spec:
  chartRef:
    kind: OCIRepository
    name: pulumi-kubernetes-operator
  interval: 10m
  maxHistory: 2
  # The CRDs ship in crds/, which helm never upgrades.
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  # https://github.com/pulumi/pulumi-kubernetes-operator/blob/main/deploy/helm/pulumi-operator/values.yaml
  values:
    # No CPU limit: the controller holds a leader lease.
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
