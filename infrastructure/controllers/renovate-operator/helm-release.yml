apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
  namespace: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 10m
  maxHistory: 2
  # https://github.com/mogenius/renovate-operator/blob/main/charts/renovate-operator/values.yaml
  values:
    crd:
      # "template" renders the CRDs as manifests, so upgrades apply them.
      mode: template
    image:
      registry: ghcr.io
      repository: mogenius/renovate-operator
      tag: 7.0.0@sha256:27e71ee7f6891d00893859df8898e1e97dec7b804f55a4c1800a153b453cee9d
    # The UI has no auth, so every visitor is an admin. Use kubectl port-forward.
    policy:
      enabled: true
    # No CPU limit: the controller holds a leader lease.
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
