apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
  namespace: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 10m
  # https://github.com/mogenius/renovate-operator/blob/main/charts/renovate-operator/values.yaml
  values:
    crd:
      # The default "hook" mode applies the CRDs from a kubectl Job; "template"
      # renders them as ordinary manifests so upgrades apply CRD changes.
      mode: template
    image:
      registry: ghcr.io # default
      repository: mogenius/renovate-operator # default
      tag: 6.4.0@sha256:e8f023764de47e0c55eb47dadc4a07928f9c286565fcd549ba42df25d7efefc8
    # Names the Service renovate-operator for the tunnel rule in
    # infrastructure/configs/cloudflare-system/cloudflare-operator/tunnel.yml.
    fullnameOverride: renovate-operator
    auth:
      oidc:
        enabled: true
        issuerUrl: https://auth.thecluster.io/realms/thecluster
        clientId: renovate-operator
        # Connection secret of the Client in keycloak-client.yml.
        existingSecret: renovate-operator-oidc
        secretKey: attribute.client_secret
        # The UI is published through the Cloudflare tunnel rather than the
        # chart's ingress or route, so the redirect cannot be auto-detected.
        redirectUrl: https://renovate.thecluster.io/auth/callback
    # Every account in the thecluster realm is created by hand, so anyone who
    # can log in is trusted with every RenovateJob.
    authorization:
      enabled: false
    policy:
      enabled: true
    # No CPU limit: the controller holds a leader-election lease.
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
