apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: enclave
  namespace: flux-system
spec:
  url: https://github.com/unmango/enclave
  interval: 1h
  # Upstream has no tags yet. Pin ref.tag at the first release.
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: enclave
  namespace: flux-system
spec:
  # No image is published to ghcr.io/unmango/enclave yet.
  suspend: true
  sourceRef:
    kind: GitRepository
    name: enclave
  path: ./config/default
  interval: 10m
  prune: true
  wait: true
  images:
    - name: enclave
      newName: ghcr.io/unmango/enclave
  # The manager holds a leader lease, so the upstream CPU limit comes off.
  patches:
    - target:
        kind: Deployment
        name: enclave-controller-manager
      patch: |-
        - op: remove
          path: /spec/template/spec/containers/0/resources/limits/cpu
