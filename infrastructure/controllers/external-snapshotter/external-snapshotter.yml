apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: external-snapshotter
  namespace: flux-system
spec:
  url: https://github.com/kubernetes-csi/external-snapshotter
  interval: 1h
  ref:
    tag: v8.6.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-snapshotter-crds
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: external-snapshotter
  path: ./client/config/crd
  interval: 10m
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-snapshotter
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: external-snapshotter
  path: ./deploy/kubernetes/snapshot-controller
  interval: 10m
  prune: true
  wait: true
  dependsOn:
    - name: external-snapshotter-crds
  # Upstream ships the Deployment with no resources, and the path is theirs, so
  # a patch here is the only place to add them. It idles at 1m and 17Mi.
  patches:
    - target:
        kind: Deployment
        name: snapshot-controller
      patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: snapshot-controller
        spec:
          template:
            spec:
              containers:
                - name: snapshot-controller
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
                    limits:
                      memory: 128Mi
