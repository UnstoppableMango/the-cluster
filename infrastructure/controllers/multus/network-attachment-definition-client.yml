# Only the CRD: the multus binary runs from NixOS on the OSD hosts.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: network-attachment-definition-client
  namespace: flux-system
spec:
  url: https://github.com/k8snetworkplumbingwg/network-attachment-definition-client
  interval: 1h
  ref:
    tag: v1.7.7
  ignore: |
    /*
    !/artifacts/
    /artifacts/*
    !/artifacts/networks-crd.yaml
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-attachment-definition-crds
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: network-attachment-definition-client
  path: ./artifacts
  interval: 10m
  # Deleting the CRD deletes the rook-ceph NAD, and attached OSDs fail to restart.
  prune: false
  wait: true
