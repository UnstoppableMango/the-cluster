apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 10m
  releaseName: rook
  targetNamespace: rook-ceph
  chart:
    spec:
      chart: rook-ceph
      version: 1.16.8
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    csi:
      nfs:
        enabled: false
    # Disabling for memory reasons on the smaller nodes
    enableDiscoveryDaemon: false
    env: {}
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 128Mi
