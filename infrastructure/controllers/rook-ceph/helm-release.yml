apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 10m
  releaseName: rook
  targetNamespace: rook-ceph
  chart:
    spec:
      chart: rook-ceph
      version: 1.16.8
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    csi:
      nfs:
        enabled: false
      # NixOS keeps kernel modules under the booted system's store path, so the
      # plugins' default /lib/modules hostPath lands on nothing and modprobe
      # fails. Repointing the lib-modules volume replaces the default by name,
      # leaving the mount at /lib/modules. host-nix covers module trees that are
      # symlink farms into the store, which is what extraModulePackages builds.
      csiRBDPluginVolume:
        - name: lib-modules
          hostPath:
            path: /run/booted-system/kernel-modules/lib/modules/
        - name: host-nix
          hostPath:
            path: /nix
      csiRBDPluginVolumeMount:
        - name: host-nix
          mountPath: /nix
          readOnly: true
      csiCephFSPluginVolume:
        - name: lib-modules
          hostPath:
            path: /run/booted-system/kernel-modules/lib/modules/
        - name: host-nix
          hostPath:
            path: /nix
      csiCephFSPluginVolumeMount:
        - name: host-nix
          mountPath: /nix
          readOnly: true
      # The operator matches these entries to CSI containers by name, and a
      # container the list does not name runs unsized. The chart's defaults omit
      # log-collector entirely, which is a logrotate loop measuring 0, and give
      # the provisioner's csi-rbdplugin memory but no CPU. These four lists are
      # the chart defaults with those gaps filled; re-diff them against
      # `helm show values rook-ceph` when bumping the chart, since a list
      # replaces the default wholesale rather than merging into it.
      csiRBDProvisionerResource: |
        - name: csi-provisioner
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-resizer
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-attacher
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-snapshotter
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-rbdplugin
          resource:
            requests: {memory: 512Mi, cpu: 100m}
            limits: {memory: 1Gi}
        - name: csi-omap-generator
          resource:
            requests: {memory: 512Mi, cpu: 250m}
            limits: {memory: 1Gi}
        - name: liveness-prometheus
          resource:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 256Mi}
        - name: log-collector
          resource:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 128Mi}
      csiRBDPluginResource: |
        - name: driver-registrar
          resource:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 256Mi}
        - name: csi-rbdplugin
          resource:
            requests: {memory: 512Mi, cpu: 250m}
            limits: {memory: 1Gi}
        - name: liveness-prometheus
          resource:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 256Mi}
        - name: log-collector
          resource:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 128Mi}
      csiCephFSProvisionerResource: |
        - name: csi-provisioner
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-resizer
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-attacher
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-snapshotter
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-cephfsplugin
          resource:
            requests: {memory: 512Mi, cpu: 250m}
            limits: {memory: 1Gi}
        - name: liveness-prometheus
          resource:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 256Mi}
        - name: log-collector
          resource:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 128Mi}
      csiCephFSPluginResource: |
        - name: driver-registrar
          resource:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 256Mi}
        - name: csi-cephfsplugin
          resource:
            requests: {memory: 512Mi, cpu: 250m}
            limits: {memory: 1Gi}
        - name: liveness-prometheus
          resource:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 256Mi}
        - name: log-collector
          resource:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 128Mi}
    # Disabling for memory reasons on the smaller nodes
    enableDiscoveryDaemon: false
    env: {}
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 128Mi
