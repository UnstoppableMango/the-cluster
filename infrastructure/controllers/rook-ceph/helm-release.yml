apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 10m
  maxHistory: 2
  releaseName: rook
  targetNamespace: rook-ceph
  chart:
    spec:
      chart: rook-ceph
      # 1.18 is the last Rook with Ceph Reef. Move it with the Ceph version, one
      # Rook minor at a time.
      version: v1.18.11
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    csi:
      nfs:
        enabled: false
      # The ~1Gi controller plugins leave no room for the node daemonsets on a small
      # node, so they stay on the OSD hosts.
      provisionerNodeAffinity: kubernetes.io/hostname=gaea,zeus,apollo
      # NixOS keeps kernel modules in the store, so the default /lib/modules hostPath
      # is empty. host-nix covers symlink farms from extraModulePackages.
      csiRBDPluginVolume:
        - name: lib-modules
          hostPath:
            path: /run/booted-system/kernel-modules/lib/modules/
        - name: host-nix
          hostPath:
            path: /nix
      csiRBDPluginVolumeMount:
        - name: host-nix
          mountPath: /nix
          readOnly: true
      csiCephFSPluginVolume:
        - name: lib-modules
          hostPath:
            path: /run/booted-system/kernel-modules/lib/modules/
        - name: host-nix
          hostPath:
            path: /nix
      csiCephFSPluginVolumeMount:
        - name: host-nix
          mountPath: /nix
          readOnly: true
      # The chart copies these into the Driver CRs, mapping container names to keys:
      # csi-rbdplugin and csi-cephfsplugin to plugin, driver-registrar to registrar,
      # csi-omap-generator to omapGenerator. Any other name sizes nothing, and a list
      # replaces the chart default wholesale.
      #
      # On a chart bump, check the live containers, not `helm show values`:
      #
      #   kubectl -n rook-ceph get pods \
      #     -o custom-columns='NAME:.metadata.name,C:.spec.containers[*].name' \
      #     | grep csi
      #   kubectl -n rook-ceph get drivers.csi.ceph.io -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{.spec.controllerPlugin.resources}{"\n"}{.spec.nodePlugin.resources}{"\n"}{end}'
      csiRBDProvisionerResource: |
        - name: csi-provisioner
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-resizer
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-attacher
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-snapshotter
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-rbdplugin
          resource:
            requests: {memory: 512Mi, cpu: 100m}
            limits: {memory: 1Gi}
        - name: csi-omap-generator
          resource:
            requests: {memory: 512Mi, cpu: 250m}
            limits: {memory: 1Gi}
      csiRBDPluginResource: |
        - name: driver-registrar
          resource:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 256Mi}
        - name: csi-rbdplugin
          resource:
            requests: {memory: 512Mi, cpu: 250m}
            limits: {memory: 1Gi}
      csiCephFSProvisionerResource: |
        - name: csi-provisioner
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-resizer
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-attacher
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-snapshotter
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-cephfsplugin
          resource:
            requests: {memory: 512Mi, cpu: 250m}
            limits: {memory: 1Gi}
      csiCephFSPluginResource: |
        - name: driver-registrar
          resource:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 256Mi}
        - name: csi-cephfsplugin
          resource:
            requests: {memory: 512Mi, cpu: 250m}
            limits: {memory: 1Gi}
    monitoring:
      enabled: true
    # Off for memory on the smaller nodes.
    enableDiscoveryDaemon: false
    env: {}
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 128Mi
