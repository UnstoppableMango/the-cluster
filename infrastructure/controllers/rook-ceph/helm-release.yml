apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 10m
  releaseName: rook
  targetNamespace: rook-ceph
  chart:
    spec:
      chart: rook-ceph
      # Rook 1.19 dropped Ceph Reef; 1.18 is the last release that supports the
      # Reef daemons this cluster runs, and it caps Squid at v19.2.5. Raise this
      # only in lockstep with the Ceph version, one Rook minor at a time.
      version: v1.18.11
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    csi:
      nfs:
        enabled: false
      # The controller plugins request roughly a gigabyte each and land wherever
      # the scheduler puts them, which on a 3.6Gi node that already holds a mon
      # leaves no room for the per-node daemonsets. Pin them to the three hosts
      # that carry OSDs, the only ones with headroom to spare. The node plugins
      # are deliberately left unconstrained: every node that mounts a volume
      # needs one.
      provisionerNodeAffinity: kubernetes.io/hostname=gaea,zeus,apollo
      # NixOS keeps kernel modules under the booted system's store path, so the
      # plugins' default /lib/modules hostPath lands on nothing and modprobe
      # fails. Repointing the lib-modules volume replaces the default by name,
      # leaving the mount at /lib/modules. host-nix covers module trees that are
      # symlink farms into the store, which is what extraModulePackages builds.
      csiRBDPluginVolume:
        - name: lib-modules
          hostPath:
            path: /run/booted-system/kernel-modules/lib/modules/
        - name: host-nix
          hostPath:
            path: /nix
      csiRBDPluginVolumeMount:
        - name: host-nix
          mountPath: /nix
          readOnly: true
      csiCephFSPluginVolume:
        - name: lib-modules
          hostPath:
            path: /run/booted-system/kernel-modules/lib/modules/
        - name: host-nix
          hostPath:
            path: /nix
      csiCephFSPluginVolumeMount:
        - name: host-nix
          mountPath: /nix
          readOnly: true
      # Rook 1.18 hands CSI to the ceph-csi-operator, so the chart no longer
      # renders a deployment from these lists. It copies them into the Driver
      # CRs' controllerPlugin.resources and nodePlugin.resources, translating
      # container names to CR keys: csi-rbdplugin and csi-cephfsplugin to
      # plugin, driver-registrar to registrar, csi-omap-generator to
      # omapGenerator. A name with no corresponding key sizes nothing, so each
      # list holds exactly the containers the operator deploys. A list also
      # replaces the chart default wholesale rather than merging into it.
      #
      # On a chart bump, check the live container set rather than
      # `helm show values rook-ceph`, and re-check at 1.19:
      #
      #   kubectl -n rook-ceph get pods \
      #     -o custom-columns='NAME:.metadata.name,C:.spec.containers[*].name' \
      #     | grep csi
      #   kubectl -n rook-ceph get drivers.csi.ceph.io -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{.spec.controllerPlugin.resources}{"\n"}{.spec.nodePlugin.resources}{"\n"}{end}'
      csiRBDProvisionerResource: |
        - name: csi-provisioner
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-resizer
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-attacher
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-snapshotter
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-rbdplugin
          resource:
            requests: {memory: 512Mi, cpu: 100m}
            limits: {memory: 1Gi}
        - name: csi-omap-generator
          resource:
            requests: {memory: 512Mi, cpu: 250m}
            limits: {memory: 1Gi}
      csiRBDPluginResource: |
        - name: driver-registrar
          resource:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 256Mi}
        - name: csi-rbdplugin
          resource:
            requests: {memory: 512Mi, cpu: 250m}
            limits: {memory: 1Gi}
      csiCephFSProvisionerResource: |
        - name: csi-provisioner
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-resizer
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-attacher
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-snapshotter
          resource:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
        - name: csi-cephfsplugin
          resource:
            requests: {memory: 512Mi, cpu: 250m}
            limits: {memory: 1Gi}
      csiCephFSPluginResource: |
        - name: driver-registrar
          resource:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 256Mi}
        - name: csi-cephfsplugin
          resource:
            requests: {memory: 512Mi, cpu: 250m}
            limits: {memory: 1Gi}
    # Lets the operator create the mgr and exporter ServiceMonitors that
    # monitoring.enabled on the pinkdiamond release asks for.
    monitoring:
      enabled: true
    # Disabling for memory reasons on the smaller nodes
    enableDiscoveryDaemon: false
    env: {}
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 128Mi
