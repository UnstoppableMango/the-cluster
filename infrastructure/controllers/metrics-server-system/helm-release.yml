apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: metrics-server
spec:
  interval: 10m
  maxHistory: 2
  releaseName: metrics-server
  targetNamespace: metrics-server
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
  values:
    image:
      repository: registry.k8s.io/metrics-server/metrics-server
      tag: v0.9.1
    args:
      - --kubelet-certificate-authority=/etc/ssl/kube-root-ca/ca.crt
    # kubectl discovery fails while metrics.k8s.io is unavailable, so one replica
    # per node survives a node failure.
    replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: metrics-server
            app.kubernetes.io/instance: metrics-server
    # No CPU limit: throttling the scrape stalls every HPA and `kubectl top`.
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        memory: 256Mi
    extraVolumes:
      - name: kube-root-ca
        configMap:
          name: kube-root-ca.crt
    extraVolumeMounts:
      - name: kube-root-ca
        mountPath: /etc/ssl/kube-root-ca
        readOnly: true
