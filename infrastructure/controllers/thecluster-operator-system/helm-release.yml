apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thecluster-operator
  namespace: thecluster-operator-system
spec:
  interval: 10m
  maxHistory: 2
  releaseName: thecluster-operator
  targetNamespace: thecluster-operator-system
  # The chart is unpublished, so it builds from dist/chart.
  chart:
    spec:
      chart: ./dist/chart
      sourceRef:
        kind: GitRepository
        name: thecluster-operator
  # https://github.com/unmango/thecluster-operator/blob/main/dist/chart/values.yaml
  values:
    controllerManager:
      container:
        image:
          repository: ghcr.io/unmango/thecluster-operator
          # The chart renders repository:tag verbatim, so the digest rides on the tag.
          tag: 0.1.3@sha256:08d8a3c1543a2ab27b98df4605d622c5fb7268180bb4cade47703d88dd8d2601
        # It holds the leader lease, so no CPU limit.
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: null
            memory: 128Mi
