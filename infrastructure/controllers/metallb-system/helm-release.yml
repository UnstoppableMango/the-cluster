apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 10m
  maxHistory: 2
  releaseName: metallb
  targetNamespace: metallb-system
  chart:
    spec:
      chart: metallb
      version: 0.16.2
      sourceRef:
        kind: HelmRepository
        name: metallb
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  # https://metallb.io/configuration/
  values:
    crds:
      enabled: true
    # Every address is announced over L2. Re-enable this to speak BGP.
    frrk8s:
      enabled: false
    controller:
      priorityClassName: system-cluster-critical
      # The controller reconciles every service in the cluster and is OOM killed
      # on bursts above its 225Mi idle.
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
        limits:
          memory: 512Mi
    speaker:
      priorityClassName: system-cluster-critical
      # No CPU limit: a throttled speaker drops ARP replies and addresses go dark.
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
