apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
  namespace: nats-system
spec:
  interval: 10m
  maxHistory: 2
  releaseName: nats
  targetNamespace: nats-system
  chart:
    spec:
      chart: nats
      version: 2.15.3
      sourceRef:
        kind: HelmRepository
        name: nats
  # https://github.com/nats-io/k8s/blob/main/helm/charts/nats/values.yaml
  values:
    config:
      nats:
        port: 4222
      websocket:
        enabled: true
        port: 8080
        ingress:
          enabled: true
          hosts: [nats.thecluster.lan]
          className: nginx
    # The chart applies resources only through `merge`.
    container:
      image:
        repository: nats
        tag: 2.15.3-linux
      merge:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
    reloader:
      image:
        repository: natsio/nats-server-config-reloader
        tag: 0.25.0
      merge:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
    service:
      ports:
        nats:
          enabled: true
        leafnodes:
          enabled: true
        websocket:
          enabled: true
        mqtt:
          enabled: false
        cluster:
          enabled: false
        gateway:
          enabled: false
        monitor:
          enabled: false
        profiling:
          enabled: false
    natsBox:
      container:
        image:
          repository: natsio/nats-box
          tag: 0.20.2
        merge:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
    podTemplate:
      merge:
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 1
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - gaea
