apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  interval: 10m
  maxHistory: 2
  releaseName: plugin-barman-cloud
  targetNamespace: cnpg-system
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  # https://github.com/cloudnative-pg/charts/blob/main/charts/plugin-barman-cloud/values.yaml
  values:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
