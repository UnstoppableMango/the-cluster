apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
  namespace: crossplane-system
spec:
  interval: 10m
  timeout: 15m
  releaseName: crossplane
  targetNamespace: crossplane-system
  chart:
    spec:
      chart: crossplane
      version: 2.4.2
      sourceRef:
        kind: HelmRepository
        name: crossplane-stable
  # https://github.com/crossplane/crossplane/blob/main/cluster/charts/crossplane/values.yaml
  values:
    replicas: 2
    image:
      repository: xpkg.crossplane.io/crossplane/crossplane # default
      tag: v2.4.2
    # Providers are declared as Provider objects in
    # infrastructure/configs/crossplane-system/providers, which can reference a
    # DeploymentRuntimeConfig for resources. provider.packages cannot.
    # No CPU limits: both pods hold leader-election leases.
    resourcesCrossplane:
      limits:
        cpu: null
        memory: 1024Mi
      requests:
        cpu: 100m
        memory: 256Mi
    resourcesRBACManager:
      limits:
        cpu: null
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
