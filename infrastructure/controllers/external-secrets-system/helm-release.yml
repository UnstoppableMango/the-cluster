apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets-system
spec:
  interval: 10m
  maxHistory: 2
  releaseName: external-secrets
  targetNamespace: external-secrets-system
  chart:
    spec:
      chart: external-secrets
      version: 2.15.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  # The chart's CRDs are templates, so they upgrade with the release.
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  # TODO: size from measured usage.
  # No CPU limits: the controller and webhook sit in every reconcile and admission.
  values:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    certController:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
