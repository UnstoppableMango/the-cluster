apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The Namespace comes from configs/coredns-system. Applying it here too would
# let a prune on either delete it from under the other.
resources:
  - external-dns-crds.yml
  - coredns-helm-release.yml
  - coredns-helm-repository.yml
  - etcd-service.yml
  - etcd-statefulset.yml
  - external-dns-helm-release.yml
  - external-dns-helm-repository.yml
  - pvs.yml
