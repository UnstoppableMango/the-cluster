apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # The pinkdiamond gateway address is outside rosequartz's metallb pool.
  - target:
      kind: HelmRelease
      name: nginx-gateway-fabric
    patch: |-
      - op: replace
        path: /spec/values/gateways/0/spec/infrastructure/annotations/metallb.io~1loadBalancerIPs
        value: 10.0.69.200
