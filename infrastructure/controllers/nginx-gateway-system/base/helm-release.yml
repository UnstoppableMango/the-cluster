apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-gateway-fabric
  namespace: nginx-gateway
spec:
  interval: 10m
  maxHistory: 2
  releaseName: nginx-gateway-fabric
  targetNamespace: nginx-gateway
  chartRef:
    kind: OCIRepository
    name: nginx-gateway-fabric
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  # https://github.com/nginxinc/nginx-gateway-fabric/blob/main/charts/nginx-gateway-fabric/values.yaml
  values:
    fullnameOverride: nginx-gateway-fabric
    nginxGateway:
      replicas: 2
      image:
        repository: ghcr.io/nginx/nginx-gateway-fabric
        tag: 2.9.0
      gwAPIExperimentalFeatures:
        enable: true
      productTelemetry:
        enable: false
      # No CPU limit: the replicas hold a leader election.
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    certGenerator:
      enable: false
    nginx:
      kind: daemonSet
      image:
        repository: ghcr.io/nginx/nginx-gateway-fabric/nginx
        tag: 2.9.0
      service:
        externalTrafficPolicy: Cluster # MetalLB shares an address only under Cluster
      # No CPU limit: this is the dataplane.
      container:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
    gateways:
      - name: nginx
        namespace: nginx-gateway
        spec:
          gatewayClassName: nginx
          infrastructure:
            annotations:
              metallb.io/loadBalancerIPs: 192.168.1.43
              metallb.io/allow-shared-ip: lan-gateway
          listeners:
            - name: https
              port: 443
              protocol: HTTPS
              tls:
                mode: Terminate
                certificateRefs:
                  - name: thecluster-lan-wildcard-tls
              allowedRoutes:
                namespaces:
                  from: All
            # Split horizon: pihole answers this name with the Gateway's address on the LAN.
            # The cert lives beside the route in seedvault.
            - name: g10agosdav
              hostname: g10agosdav.thecluster.io
              port: 443
              protocol: HTTPS
              tls:
                mode: Terminate
                certificateRefs:
                  - name: g10agosdav-tls
                    namespace: seedvault
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchLabels:
                      kubernetes.io/metadata.name: seedvault
            # Split horizon, as for Seedvault.
            - name: cloud
              hostname: cloud.thecluster.io
              port: 443
              protocol: HTTPS
              tls:
                mode: Terminate
                certificateRefs:
                  - name: cloud-tls
                    namespace: nextcloud
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchLabels:
                      kubernetes.io/metadata.name: nextcloud
            - name: office
              hostname: office.thecluster.io
              port: 443
              protocol: HTTPS
              tls:
                mode: Terminate
                certificateRefs:
                  - name: office-tls
                    namespace: collabora
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchLabels:
                      kubernetes.io/metadata.name: collabora
