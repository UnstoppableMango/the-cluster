apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-gateway-fabric
  namespace: nginx-gateway
spec:
  interval: 10m
  releaseName: nginx-gateway-fabric
  targetNamespace: nginx-gateway
  chartRef:
    kind: OCIRepository
    name: nginx-gateway-fabric
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  # https://github.com/nginxinc/nginx-gateway-fabric/blob/main/charts/nginx-gateway-fabric/values.yaml
  values:
    fullnameOverride: nginx-gateway-fabric
    nginxGateway:
      replicas: 2
      image:
        repository: ghcr.io/nginx/nginx-gateway-fabric
        tag: 2.7.0
      gwAPIExperimentalFeatures:
        enable: true
      productTelemetry:
        enable: false
      # Idles at 7m and 68Mi. No CPU limit: the two replicas hold a leader
      # election for Gateway API status writes.
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    certGenerator:
      enable: false
    nginx:
      kind: daemonSet
      image:
        repository: ghcr.io/nginx/nginx-gateway-fabric/nginx
        tag: 2.7.0
      service:
        externalTrafficPolicy: Cluster # https://metallb.io/usage/#ip-address-sharing
      # Measured at 27m and 150Mi serving the cluster's ingress. No CPU limit:
      # this is the dataplane and throttling it shows up as request latency.
      container:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
    gateways:
      - name: nginx
        namespace: nginx-gateway
        spec:
          gatewayClassName: nginx
          infrastructure:
            annotations:
              metallb.io/loadBalancerIPs: 192.168.1.43
              metallb.io/allow-shared-ip: lan-gateway
          listeners:
            - name: https
              port: 443
              protocol: HTTPS
              tls:
                mode: Terminate
                certificateRefs:
                  - name: thecluster-lan-wildcard-tls
              allowedRoutes:
                namespaces:
                  from: All
