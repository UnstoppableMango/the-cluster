apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # The nginx-gateway Namespace comes from configs/nginx-gateway-system, which
  # every consumer of this base already orders itself behind. Applying it from
  # both puts the same object in two Flux inventories, where a prune on either
  # deletes it out from under the other.
  - oci-repository.yml
  - helm-release.yml
