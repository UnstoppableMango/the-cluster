apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-operator
  namespace: cloudflare-system
spec:
  interval: 10m
  releaseName: cloudflare-operator
  targetNamespace: cloudflare-system
  # The chart is not published anywhere, so it is built from dist/chart in the
  # checkout the GitRepository pins.
  chart:
    spec:
      chart: ./dist/chart
      sourceRef:
        kind: GitRepository
        name: cloudflare-operator
  # https://github.com/unmango/cloudflare-operator/blob/main/dist/chart/values.yaml
  values:
    cloudflare:
      auth:
        apiTokenRef:
          name: cloudflare-operator-credentials
          key: CLOUDFLARE_API_TOKEN
    manager:
      image:
        repository: ghcr.io/unmango/cloudflare-operator
        # The chart renders repository:tag verbatim, so the digest rides along
        # on the tag to make the reference immutable.
        tag: v0.1.0@sha256:027de387bf90c727598e4d9b0f455456c4228b4061c28491833a76767541ada7
    ingressClass:
      enabled: true
      name: cloudflare
      default: false
