apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-operator
  namespace: cloudflare-system
spec:
  interval: 10m
  maxHistory: 2
  releaseName: cloudflare-operator
  targetNamespace: cloudflare-system
  # The chart is unpublished, so it builds from dist/chart.
  chart:
    spec:
      chart: ./dist/chart
      sourceRef:
        kind: GitRepository
        name: cloudflare-operator
  # https://github.com/unmango/cloudflare-operator/blob/main/dist/chart/values.yaml
  values:
    cloudflare:
      auth:
        apiTokenRef:
          name: cloudflare-operator-credentials
          key: CLOUDFLARE_API_TOKEN
    manager:
      image:
        repository: ghcr.io/unmango/cloudflare-operator
        # The chart renders repository:tag verbatim, so the digest rides on the tag.
        tag: 0.9.0@sha256:ebc0afe882bd52fe1b0de540368392049d06f0266bc5f03b481626ca1c6485d6
    ingressClass:
      enabled: true
      name: cloudflare
      default: false
    # The class reports itself unaccepted until the CloudflareGatewayConfig exists.
    gatewayClass:
      enabled: true
      name: cloudflare
      parametersRef:
        group: cloudflare.unmango.dev
        kind: CloudflareGatewayConfig
        name: cloudflare
        namespace: cloudflare-system
