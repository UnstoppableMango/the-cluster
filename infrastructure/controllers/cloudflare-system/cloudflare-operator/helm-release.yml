apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-operator
  namespace: cloudflare-system
spec:
  interval: 10m
  maxHistory: 2
  releaseName: cloudflare-operator
  targetNamespace: cloudflare-system
  # The chart is not published anywhere, so it is built from dist/chart in the
  # checkout the GitRepository pins.
  chart:
    spec:
      chart: ./dist/chart
      sourceRef:
        kind: GitRepository
        name: cloudflare-operator
  # https://github.com/unmango/cloudflare-operator/blob/main/dist/chart/values.yaml
  values:
    cloudflare:
      auth:
        apiTokenRef:
          name: cloudflare-operator-credentials
          key: CLOUDFLARE_API_TOKEN
    manager:
      image:
        repository: ghcr.io/unmango/cloudflare-operator
        # The chart renders repository:tag verbatim, so the digest rides along
        # on the tag to make the reference immutable.
        tag: 0.7.0@sha256:2a1b22db75b554d4a98a161a20b96dcc113e07ad3abff64fc2f3b6e52649fd95
    ingressClass:
      enabled: true
      name: cloudflare
      default: false
    # Gateways of this class get an Envoy proxy and a tunnel of their own, from
    # the CloudflareGatewayConfig in infrastructure/configs. The class can exist
    # before the config does; it reports itself unaccepted until then.
    gatewayClass:
      enabled: true
      name: cloudflare
      parametersRef:
        group: cloudflare.unmango.dev
        kind: CloudflareGatewayConfig
        name: cloudflare
        namespace: cloudflare-system
