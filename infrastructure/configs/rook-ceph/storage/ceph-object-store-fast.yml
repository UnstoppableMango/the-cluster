# For buckets on a request's critical path (UnstoppableMango/tdl#1365).
# Every SSD is in zeus, so a zeus outage takes this store down. Only data that
# refills from elsewhere belongs here.
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: s3-fast
  namespace: rook-ceph
spec:
  metadataPool:
    failureDomain: osd
    deviceClass: ssd
    replicated:
      size: 2
  dataPool:
    failureDomain: osd
    deviceClass: ssd
    replicated:
      size: 2
  preservePoolsOnDelete: false
  gateway:
    securePort: 443
    sslCertificateRef: rgw-s3-fast-tls
    instances: 2
    resources:
      limits:
        memory: 1024Mi
      requests:
        cpu: 100m
        memory: 512Mi
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-bucket
provisioner: rook-ceph.ceph.rook.io/bucket
reclaimPolicy: Delete
parameters:
  objectStoreName: s3-fast
  objectStoreNamespace: rook-ceph
