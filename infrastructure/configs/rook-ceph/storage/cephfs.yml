apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: replicated
  namespace: rook-ceph
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  metadataPool:
    deviceClass: hdd
    failureDomain: osd
    replicated:
      size: 2
  dataPools:
    - name: data
      deviceClass: hdd
      failureDomain: osd
      replicated:
        size: 2
      parameters:
        bulk: "true"
  preserveFilesystemOnDelete: true
  metadataServer:
    activeCount: 1
    activeStandby: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: default-cephfs
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
provisioner: rook-ceph.cephfs.csi.ceph.com
parameters:
  clusterID: rook-ceph
  fsName: replicated
  pool: replicated-data
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
reclaimPolicy: Retain
allowVolumeExpansion: true
---
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: erasure-coded
  namespace: rook-ceph
spec:
  metadataPool:
    deviceClass: hdd
    replicated:
      size: 2
  dataPools:
    - name: default
      deviceClass: hdd
      failureDomain: osd
      replicated:
        size: 2
    - name: data
      deviceClass: hdd
      failureDomain: osd
      erasureCoded:
        dataChunks: 2
        codingChunks: 1
      parameters:
        bulk: "true"
  preserveFilesystemOnDelete: true
  metadataServer:
    activeCount: 1
    activeStandby: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ec-cephfs
provisioner: rook-ceph.cephfs.csi.ceph.com
parameters:
  clusterID: rook-ceph
  fsName: erasure-coded
  pool: erasure-coded-data
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
reclaimPolicy: Delete
allowVolumeExpansion: true
