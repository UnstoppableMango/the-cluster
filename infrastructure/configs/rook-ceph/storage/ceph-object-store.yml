apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: s3
  namespace: rook-ceph
spec:
  metadataPool:
    failureDomain: osd
    replicated:
      size: 3
    deviceClass: ssd
  dataPool:
    failureDomain: osd
    erasureCoded:
      dataChunks: 2
      codingChunks: 1
    deviceClass: hdd
  preservePoolsOnDelete: true
  allowUsersInNamespaces:
    - velero-system
  gateway:
    # Both listeners. 80 is what an ObjectBucketClaim reports in its ConfigMap
    # and what Velero's backup location uses; 443 carries the certificate
    # from certificate.yml and is what ncps sends its bucket credentials to.
    port: 80
    securePort: 443
    sslCertificateRef: rgw-s3-tls
    instances: 1
    resources:
      limits:
        memory: 1024Mi
      requests:
        cpu: 500m
        memory: 1024Mi
