apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rgw-s3
  namespace: rook-ceph
spec:
  secretName: rgw-s3-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: thecluster.lan
  # Path-style S3 only, so no per-bucket names.
  dnsNames:
    - rook-ceph-rgw-s3
    - rook-ceph-rgw-s3.rook-ceph
    - rook-ceph-rgw-s3.rook-ceph.svc
    - rook-ceph-rgw-s3.rook-ceph.svc.cluster.local
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rgw-s3-fast
  namespace: rook-ceph
spec:
  secretName: rgw-s3-fast-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: thecluster.lan
  dnsNames:
    - rook-ceph-rgw-s3-fast
    - rook-ceph-rgw-s3-fast.rook-ceph
    - rook-ceph-rgw-s3-fast.rook-ceph.svc
    - rook-ceph-rgw-s3-fast.rook-ceph.svc.cluster.local
