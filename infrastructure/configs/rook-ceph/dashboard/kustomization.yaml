apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - alerts-proxy.yml
  - dashboard-http-route.yml
# Generated so the name carries a content hash: editing the config rolls the
# pod, where a plain ConfigMap would leave the old one running.
configMapGenerator:
  - name: ceph-dashboard-alerts
    namespace: rook-ceph
    files:
      - default.conf=alerts-proxy.conf
