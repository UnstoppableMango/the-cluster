# The Ceph dashboard lists every alert Alertmanager holds and every rule
# Prometheus loads, with no filter of its own. Its backend forwards query
# parameters, so this proxy adds a matcher on the label all of rook's Ceph
# rules carry, type="ceph_default", to the three endpoints that list them.
#
# The dashboard reads Prometheus under /api/v1 and Alertmanager under
# /api/v2, so one server routes both by path.

upstream prometheus {
    server kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090;
}

upstream alertmanager {
    server kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093;
}

server {
    listen 8080;

    location = /healthz {
        return 200;
    }

    # rewrite puts the request's own arguments after the ones it adds.
    location = /api/v2/alerts {
        rewrite ^ /api/v2/alerts?filter=type%3D%22ceph_default%22 break;
        proxy_pass http://alertmanager;
    }

    location = /api/v2/alerts/groups {
        rewrite ^ /api/v2/alerts/groups?filter=type%3D%22ceph_default%22 break;
        proxy_pass http://alertmanager;
    }

    # Silences pass through, so silencing from the dashboard still works.
    location /api/v2/ {
        proxy_pass http://alertmanager;
    }

    location = /api/v1/rules {
        rewrite ^ /api/v1/rules?match%5B%5D=%7Btype%3D%22ceph_default%22%7D break;
        proxy_pass http://prometheus;
    }

    # Metric queries for the dashboard's graphs pass through.
    location / {
        proxy_pass http://prometheus;
    }
}
