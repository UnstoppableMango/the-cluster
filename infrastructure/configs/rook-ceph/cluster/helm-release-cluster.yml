apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinkdiamond
  namespace: rook-ceph
spec:
  interval: 10m
  maxHistory: 2
  releaseName: pinkdiamond
  targetNamespace: rook-ceph
  chart:
    spec:
      chart: rook-ceph-cluster
      # Kept in lockstep with the rook-ceph operator chart.
      version: v1.18.11
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: rook-ceph
  dependsOn:
    - name: rook-ceph
      namespace: rook-ceph
  # A CephCluster reports Progressing through every rebalance and backfill.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    clusterName: pinkdiamond
    operatorNamespace: rook-ceph
    monitoring:
      enabled: true
      createPrometheusRules: true
    cephBlockPools: []
    cephFileSystems: []
    cephObjectStores: []
    cephClusterSpec:
      # Move to the top-level cephImage key on the bump to Rook 1.19.
      # Squid stops at v19.2.5: Rook 1.18 and older reject newer releases.
      # https://github.com/rook/rook/issues/18203
      cephVersion:
        image: quay.io/ceph/ceph:v19.2.5
      dataDirHostPath: /var/lib/rook
      # https://rook.io/docs/rook/v1.18/CRDs/Cluster/network-providers/#multus
      # Only gaea, zeus and apollo are cabled to the SFP+ aggregator, and only they
      # run OSDs, so only the OSD pods get the cluster network.
      # addressRanges skips rook's CIDR detection canary pod on every reconcile.
      network:
        provider: multus
        selectors:
          cluster: rook-ceph/ceph-cluster
        addressRanges:
          cluster:
            - 10.0.70.0/24
      dashboard:
        enabled: true
        ssl: false
        # https://docs.ceph.com/en/squid/mgr/dashboard/#enabling-prometheus-alerting
        prometheusEndpoint: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        prometheusEndpointSSLVerify: false
      cephConfig:
        mgr:
          # Rook has no dashboard field for this; it is
          # `ceph dashboard set-alertmanager-api-host`.
          mgr/dashboard/ALERTMANAGER_API_HOST: http://kube-prometheus-stack-alertmanager.monitoring.svc:9093
        # Without discard the consumer SATA SSDs never learn about freed space, and
        # their garbage collection degrades as if they were full. HDDs ignore it.
        osd:
          bdev_enable_discard: "true"
          bdev_async_discard_threads: "1"
      mon:
        # https://github.com/rook/rook/blob/0a1dd5e9e619481432cc66347a45072178ca0b48/deploy/examples/cluster.yaml#L51-L52
        count: 3
        allowMultiplePerNode: false
      mgr:
        # https://github.com/rook/rook/blob/0a1dd5e9e619481432cc66347a45072178ca0b48/deploy/examples/cluster.yaml#L58-L60
        count: 1
        allowMultiplePerNode: true
        modules:
          - name: rook
            enabled: true
      removeOSDsIfOutAndSafeToRemove: true
      # The log collector is an idle logrotate loop, and the chart default reserves
      # about four cores and 3Gi across every ceph pod.
      resources:
        logcollector:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      storage:
        useAllDevices: false
        useAllNodes: false
        nodes:
          # The sdX names on these hosts change across reboots.
          # gaea excludes WDC WD120EDBZ 5QG6HVLF, a zfs_member.
          - name: gaea
            devices:
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9MJ3HJZU-part1
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9MH07NGK-part1
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9MJ404TU-part1
              - name: /dev/disk/by-id/ata-WDC_WD120EDBZ-11B1HA0_5QG6P5NF-part1
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9MJ3HKZU-part1
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9LK7MVXG-part1
              - name: /dev/disk/by-id/ata-WDC_WD120EDBZ-11B1HA0_5QG81AEF-part1
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9MJ32XAT-part1
              - name: /dev/disk/by-id/ata-WDC_WD120EDBZ-11B1HA0_5QG649DB-part1
              - name: /dev/disk/by-id/ata-WDC_WD120EDBZ-11B1HA0_5QG6MW2F-part1
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9LK4R8PG-part1
              - name: /dev/disk/by-id/ata-ST1000NM0033-9ZM173_Z1W42MHB-part1
              - name: /dev/disk/by-id/ata-ST1000NM0033-9ZM173_Z1W42K98-part1
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9LK4P5UG-part1
              - name: /dev/disk/by-id/ata-WDC_WD6002FFWX-68TZ4N0_K1JXV0SD-part1
              - name: /dev/disk/by-id/ata-WDC_WD8001FFWX-68J1UN0_R6GYNKEY-part1
              - name: /dev/disk/by-id/ata-WDC_WD10EZEX-08WN4A0_WD-WCC6Y5RH37JH-part1
              - name: /dev/disk/by-id/ata-WDC_WD10EZEX-08WN4A0_WD-WCC6Y7ZAP2TP-part1
          # zeus excludes its boot disk, a Samsung SSD 850 EVO.
          - name: zeus
            devices:
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_200403802695-part1
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_200403802069-part1
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_20039C803027-part1
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_20037A804298-part1
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_200403802586-part1
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_20039C803025-part1
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_20036F805874-part1
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_20037A804297-part1
              - name: /dev/disk/by-id/ata-CT500MX500SSD1_1908E1EC87CF
                config:
                  crushDeviceClass: scratch
              - name: /dev/disk/by-id/ata-WDC_WD100EMAZ-00WJTA0_JEGW1P6N-part1
              - name: /dev/disk/by-id/ata-WDC_WD100EMAZ-00WJTA0_JEGUJN4N-part1
              - name: /dev/disk/by-id/ata-WDC_WD100EMAZ-00WJTA0_JEGW15JN-part1
              - name: /dev/disk/by-id/ata-WDC_WD100EMAZ-00WJTA0_JEGVXK2N-part1
              - name: /dev/disk/by-id/ata-WDC_WD100EMAZ-00WJTA0_1EGG3UXZ-part1
              - name: /dev/disk/by-id/ata-WDC_WD100EMAZ-00WJTA0_2YK17ZXD-part1
          # apollo excludes its boot disk, a Samsung SSD 970 EVO.
          #
          # ceph-volume classes these as nvme, which no pool selects. Through rbd the
          # nvme/sata gap is well under the protocol overhead, so they join the ssd pool.
          # Rook never reclasses an existing OSD; use `ceph osd crush set-device-class`.
          #
          # The 4Gi default osd request leaves the third of apollo's eight OSDs
          # unschedulable on its 31.2 GiB. osd_memory_target must stay under the limit:
          #   ceph config set osd/host:apollo osd_memory_target 2147483648
          # Needs UnstoppableMango/nixos#377, which drops apollo's CI role.
          - name: apollo
            resources:
              requests:
                cpu: "1"
                memory: 3Gi
              limits:
                memory: 3Gi
            devices:
              - name: /dev/disk/by-id/nvme-Samsung_SSD_960_EVO_500GB_S3X4NB0K324732Y
                config:
                  crushDeviceClass: ssd
              - name: /dev/disk/by-id/nvme-Samsung_SSD_960_EVO_500GB_S3X4NB0K329644B
                config:
                  crushDeviceClass: ssd
    ingress:
      dashboard:
        enabled: false
    toolbox:
      enabled: true
