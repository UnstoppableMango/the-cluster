apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinkdiamond
  namespace: rook-ceph
spec:
  interval: 10m
  releaseName: pinkdiamond
  targetNamespace: rook-ceph
  chart:
    spec:
      chart: rook-ceph-cluster
      # Kept in lockstep with the rook-ceph operator chart.
      version: v1.18.11
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: rook-ceph
  dependsOn:
    - name: rook-ceph
      namespace: rook-ceph
  # A CephCluster reports Progressing for as long as any OSD is not ok-to-stop,
  # which covers every rebalance and backfill. Waiting on it fails the release
  # for reasons that have nothing to do with whether the release applied.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    clusterName: pinkdiamond
    operatorNamespace: rook-ceph
    monitoring:
      enabled: true
      createPrometheusRules: true
    cephBlockPools: []
    cephFileSystems: []
    cephObjectStores: []
    cephClusterSpec:
      # The 1.17 chart has no top-level cephImage key, so the image belongs
      # here. It moves to cephImage on the bump to 1.19 or later.
      cephVersion:
        image: quay.io/ceph/ceph:v19.2.6
      dataDirHostPath: /var/lib/rook # default value
      dashboard:
        enabled: true
        # The gateway terminates TLS, so the mgr serves plain HTTP on 7000.
        ssl: false
      mon:
        # Three mons so the quorum survives the loss of any single host.
        # allowMultiplePerNode is false to stop rook colocating the quorum on
        # one node, which would leave the mon store on a single disk.
        # https://github.com/rook/rook/blob/0a1dd5e9e619481432cc66347a45072178ca0b48/deploy/examples/cluster.yaml#L51-L52
        count: 3
        allowMultiplePerNode: false
      mgr:
        # https://github.com/rook/rook/blob/0a1dd5e9e619481432cc66347a45072178ca0b48/deploy/examples/cluster.yaml#L58-L60
        count: 1
        allowMultiplePerNode: true
      # Rook removes an OSD once it is marked out and the data has drained.
      removeOSDsIfOutAndSafeToRemove: true
      # Only the log collector is overridden; helm merges maps, so mon, mgr,
      # osd, exporter, and crashcollector keep the chart's defaults. Those look
      # oversized against an idle cluster, but an OSD wants its core during
      # recovery and backfill, which is exactly when the reservation matters.
      #
      # The log collector is a logrotate loop measuring 0 on every ceph pod, so
      # the chart's 100m and 100Mi reserved roughly four cores and 3Gi across
      # the 33 OSDs and the mons, mgr, mds, and rgw.
      resources:
        logcollector:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      storage:
        useAllDevices: false
        useAllNodes: false
        nodes:
          # Devices are listed by udev path because the sdX names on these
          # hosts are reassigned across reboots.
          #
          # gaea excludes three drives:
          # - SEAGATE DKS2C-H2R0SS 9WM6BY870000C146002X
          #   (wwn-0x5000c50034622c9b) reports uncorrected read errors that
          #   leave PGs inconsistent and hold the cluster in HEALTH_ERR, which
          #   stops rook reconciling the filesystems and pools. It is the drive
          #   to pull from gaea.
          # - SEAGATE DKS2C-H2R0SS 9WM7JRGL0000913705M8 reports 0B.
          # - WDC WD120EDBZ 5QG6HVLF is a zfs_member.
          - name: gaea
            devices:
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9MJ3HJZU-part1
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9MH07NGK-part1
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9MJ404TU-part1
              - name: /dev/disk/by-id/ata-WDC_WD120EDBZ-11B1HA0_5QG6P5NF-part1
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9MJ3HKZU-part1
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9LK7MVXG-part1
              - name: /dev/disk/by-id/ata-WDC_WD120EDBZ-11B1HA0_5QG81AEF-part1
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9MJ32XAT-part1
              - name: /dev/disk/by-id/ata-WDC_WD120EDBZ-11B1HA0_5QG649DB-part1
              - name: /dev/disk/by-id/ata-WDC_WD120EDBZ-11B1HA0_5QG6MW2F-part1
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9LK4R8PG-part1
              - name: /dev/disk/by-id/ata-ST1000NM0033-9ZM173_Z1W42MHB-part1
              - name: /dev/disk/by-id/ata-ST1000NM0033-9ZM173_Z1W42K98-part1
              - name: /dev/disk/by-id/ata-WDC_WD140EDGZ-11B1PA0_9LK4P5UG-part1
              - name: /dev/disk/by-id/ata-WDC_WD6002FFWX-68TZ4N0_K1JXV0SD-part1
              - name: /dev/disk/by-id/ata-WDC_WD8001FFWX-68J1UN0_R6GYNKEY-part1
              - name: /dev/disk/by-id/ata-WDC_WD10EZEX-08WN4A0_WD-WCC6Y5RH37JH-part1
              - name: /dev/disk/by-id/ata-WDC_WD10EZEX-08WN4A0_WD-WCC6Y7ZAP2TP-part1
          # zeus excludes its boot disk, a Samsung SSD 850 EVO.
          - name: zeus
            devices:
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_200403802695-part1
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_200403802069-part1
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_20039C803027-part1
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_20037A804298-part1
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_200403802586-part1
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_20039C803025-part1
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_20036F805874-part1
              - name: /dev/disk/by-id/ata-WDC_WDS500G2B0A-00SM50_20037A804297-part1
              - name: /dev/disk/by-id/ata-WDC_WD100EMAZ-00WJTA0_JEGW1P6N-part1
              - name: /dev/disk/by-id/ata-WDC_WD100EMAZ-00WJTA0_JEGUJN4N-part1
              - name: /dev/disk/by-id/ata-WDC_WD100EMAZ-00WJTA0_JEGW15JN-part1
              - name: /dev/disk/by-id/ata-WDC_WD100EMAZ-00WJTA0_JEGVXK2N-part1
              - name: /dev/disk/by-id/ata-WDC_WD100EMAZ-00WJTA0_1EGG3UXZ-part1
              - name: /dev/disk/by-id/ata-WDC_WD100EMAZ-00WJTA0_2YK17ZXD-part1
          # apollo excludes its boot disk, a Samsung SSD 970 EVO.
          - name: apollo
            devices:
              - name: /dev/disk/by-id/nvme-Samsung_SSD_960_EVO_500GB_S3X4NB0K324732Y
              - name: /dev/disk/by-id/nvme-Samsung_SSD_960_EVO_500GB_S3X4NB0K329644B
    ingress:
      dashboard:
        enabled: false
    toolbox:
      enabled: true
