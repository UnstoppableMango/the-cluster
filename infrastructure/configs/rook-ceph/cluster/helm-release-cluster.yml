apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinkdiamond
  namespace: rook-ceph
spec:
  interval: 10m
  releaseName: pinkdiamond
  targetNamespace: rook-ceph
  chart:
    spec:
      chart: rook-ceph-cluster
      # Kept in lockstep with the rook-ceph operator chart.
      version: 1.17.6
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: rook-ceph
  dependsOn:
    - name: rook-ceph
      namespace: rook-ceph
  # A CephCluster reports Progressing for as long as any OSD is not ok-to-stop,
  # which covers every rebalance and backfill. Waiting on it fails the release
  # for reasons that have nothing to do with whether the release applied.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    clusterName: pinkdiamond
    operatorNamespace: rook-ceph
    cephBlockPools: []
    cephFileSystems: []
    cephObjectStores: []
    cephClusterSpec:
      # The 1.17 chart has no top-level cephImage key, so the image belongs
      # here. It moves to cephImage on the bump to 1.19 or later.
      cephVersion:
        image: quay.io/ceph/ceph:v19.2.6
      dataDirHostPath: /var/lib/rook # default value
      dashboard:
        enabled: true
        # The gateway terminates TLS, so the mgr serves plain HTTP on 7000.
        ssl: false
      mon:
        # Three mons so the quorum survives the loss of any single host.
        # allowMultiplePerNode is false to stop rook colocating the quorum on
        # one node, which would leave the mon store on a single disk.
        # https://github.com/rook/rook/blob/0a1dd5e9e619481432cc66347a45072178ca0b48/deploy/examples/cluster.yaml#L51-L52
        count: 3
        allowMultiplePerNode: false
      mgr:
        # https://github.com/rook/rook/blob/0a1dd5e9e619481432cc66347a45072178ca0b48/deploy/examples/cluster.yaml#L58-L60
        count: 1
        allowMultiplePerNode: true
      # Rook removes an OSD once it is marked out and the data has drained.
      removeOSDsIfOutAndSafeToRemove: true
      # Only the log collector is overridden; helm merges maps, so mon, mgr,
      # osd, exporter, and crashcollector keep the chart's defaults. Those look
      # oversized against an idle cluster, but an OSD wants its core during
      # recovery and backfill, which is exactly when the reservation matters.
      #
      # The log collector is a logrotate loop measuring 0 on every ceph pod, so
      # the chart's 100m and 100Mi reserved roughly four cores and 3Gi across
      # the 33 OSDs and the mons, mgr, mds, and rgw.
      resources:
        logcollector:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      storage:
        useAllDevices: false
        useAllNodes: false
        nodes:
          # gaea: sds1 is a zfs_member and sdu is 0B, both excluded.
          # sdt1 is excluded as well: the drive behind it reports uncorrected
          # read errors that leave PGs inconsistent and hold the cluster in
          # HEALTH_ERR, which stops rook reconciling the filesystems and pools.
          # The drive to pull from gaea is /dev/sdt, a SEAGATE DKS2C-H2R0SS
          # with serial 9WM6BY870000C146002X.
          - name: gaea
            devices:
              - name: sda1
              - name: sdb1
              - name: sdc1
              - name: sdd1
              - name: sde1
              - name: sdf1
              - name: sdg1
              - name: sdh1
              - name: sdi1
              - name: sdj1
              - name: sdk1
              - name: sdl1
              - name: sdm1
              - name: sdn1
              - name: sdo1
              - name: sdp1
              - name: sdq1
              - name: sdr1
          # zeus: sda is the boot disk
          - name: zeus
            devices:
              - name: sdb1
              - name: sdc1
              - name: sdd1
              - name: sde1
              - name: sdf1
              - name: sdg1
              - name: sdh1
              - name: sdi1
              - name: sdj1
              - name: sdk1
              - name: sdl1
              - name: sdm1
              - name: sdn1
              - name: sdo1
    ingress:
      dashboard:
        enabled: false
    toolbox:
      enabled: true
