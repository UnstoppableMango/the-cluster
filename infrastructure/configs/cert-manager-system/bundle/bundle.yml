# Fanned out as the thecluster-lan-ca ConfigMap in every namespace. It holds
# both CAs a workload might meet: the UnMango Root CA G2, which *.thecluster.lan
# chains to through the private CA, and the cluster-internal CA, which signs
# in-cluster service certs. The root is public and pinned here from
# UnstoppableMango/pki's certs/ca.pem.
