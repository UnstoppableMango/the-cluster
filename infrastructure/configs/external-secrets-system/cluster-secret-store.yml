# Authenticates as control-plane-rosequartz-external-secrets, managed in
# UnstoppableMango/control-plane, which can read only the secrets vcs needs.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-unstoppablemango-pulumi
spec:
  conditions:
    - namespaces:
        - vcs
  provider:
    azurekv:
      authType: ServicePrincipal
      vaultUrl: https://unstoppablemango-pulumi.vault.azure.net
      tenantId: cc1862e8-3663-4b04-afb6-da85f96a6111
      authSecretRef:
        clientId:
          name: azure-keyvault-credentials
          namespace: external-secrets-system
          key: client-id
        clientSecret:
          name: azure-keyvault-credentials
          namespace: external-secrets-system
          key: client-secret
