# Reads the unstoppablemango-pulumi Key Vault, which already holds the vcs
# program's passphrase and state bucket key for its GitHub Actions workflow.
#
# Authenticates as a service principal granted "Key Vault Secrets User" on that
# vault. Its client ID and secret are the one credential sealed in this repo;
# everything else is fetched through this store.
#
# Not listed in this directory's kustomization yet: it needs the tenant ID in
# place of TENANT_ID and the sealed azure-keyvault-credentials beside it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-unstoppablemango-pulumi
spec:
  # The vault holds Pulumi secrets for more than vcs; only vcs reads them here.
  conditions:
    - namespaces:
        - vcs
  provider:
    azurekv:
      authType: ServicePrincipal
      vaultUrl: https://unstoppablemango-pulumi.vault.azure.net
      tenantId: TENANT_ID
      authSecretRef:
        clientId:
          name: azure-keyvault-credentials
          namespace: external-secrets-system
          key: client-id
        clientSecret:
          name: azure-keyvault-credentials
          namespace: external-secrets-system
          key: client-secret
