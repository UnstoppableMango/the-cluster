# Velero wants the velero bucket claim's keys as one AWS credentials file, so
# this reshapes Rook's Secret in place; the keys never leave the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
  namespace: velero-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: velero-system
rules:
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [velero]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-reader
  namespace: velero-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
  - kind: ServiceAccount
    name: secret-reader
    namespace: velero-system
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: in-namespace
  namespace: velero-system
spec:
  provider:
    kubernetes:
      remoteNamespace: velero-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ceph-credentials
  namespace: velero-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: in-namespace
  target:
    name: ceph-credentials
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .accessKeyId }}
          aws_secret_access_key={{ .secretAccessKey }}
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: velero
        property: AWS_ACCESS_KEY_ID
    - secretKey: secretAccessKey
      remoteRef:
        key: velero
        property: AWS_SECRET_ACCESS_KEY
