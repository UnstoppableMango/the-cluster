apiVersion: cloudflare.unmango.dev/v1alpha1
kind: CloudflareGatewayConfig
metadata:
  name: cloudflare
  namespace: cloudflare-system
spec:
  template:
    spec:
      accountId: 265a046434c952eeecb9710cfd76617c
      configSource: cloudflare
      dns:
        # thecluster.io
        zoneId: 22f1d42ba0fbe4f924905e1c6597055c
      cloudflared:
        selector:
          matchLabels:
            app.kubernetes.io/name: gateway-cloudflared
        template:
          metadata:
            labels:
              app.kubernetes.io/name: gateway-cloudflared
          spec:
            kind: Deployment
            replicas: 1
            # renovate: datasource=docker depName=cloudflare/cloudflared
            version: 2026.11.2
  envoy:
    replicas: 1
    serviceType: ClusterIP
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
