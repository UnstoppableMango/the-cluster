apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cloudflare
  namespace: cloudflare-system
spec:
  gatewayClassName: cloudflare
  # Each listener's hostname gets a rule on this Gateway's own tunnel and a
  # CNAME to it, both written by the operator.
  listeners:
    - name: knot
      hostname: knot.thecluster.io
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: knot
    - name: spindle
      hostname: spindle.thecluster.io
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: spindle
    - name: g10agosdav
      hostname: g10agosdav.thecluster.io
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: seedvault
    - name: wishlists
      hostname: wishlists.thecluster.io
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: wishlists
    - name: gitea
      hostname: gitea.thecluster.io
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: gitea
    - name: bitwarden
      hostname: bitwarden.thecluster.io
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: bitwarden
    - name: cloud
      hostname: cloud.thecluster.io
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: nextcloud
    - name: office
      hostname: office.thecluster.io
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: collabora
