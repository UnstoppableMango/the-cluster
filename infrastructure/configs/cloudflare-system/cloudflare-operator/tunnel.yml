apiVersion: cloudflare.unmango.dev/v1alpha1
kind: CloudflareTunnel
metadata:
  name: thecluster-io
  namespace: cloudflare-system
spec:
  accountId: 265a046434c952eeecb9710cfd76617c
  # Remotely managed, so the ingress rules below are pushed to the Zero Trust
  # dashboard rather than written to a config file on the origin.
  configSource: cloudflare
  config:
    ingress:
      - hostname: k8s.thecluster.io
        service: https://kubernetes.default.svc
        originRequest:
          # Verifying instead would mean originServerName: kubernetes.default.svc
          # (which the api-server certificate does carry as a SAN) plus caPool
          # pointing at the cluster CA in kube-root-ca.crt. cloudflare-operator
          # cannot mount that file: the only volumeMount it gives the cloudflared
          # container is /etc/cloudflared for a local config.yml, and this is a
          # remotely configured tunnel. Revisit once the operator passes
          # spec.template volumes through.
          noTlsVerify: true
      - hostname: prom.thecluster.io
        service: http://kube-prometheus-stack-grafana.monitoring.svc:80
      - hostname: dex.thecluster.io
        service: http://dex.dex.svc:5556
      # Plain HTTP to the origin: the keycloakx release runs with
      # proxy.mode xforwarded, so Keycloak takes the scheme from the
      # X-Forwarded-Proto the tunnel sets rather than from the connection.
      - hostname: auth.thecluster.io
        service: http://keycloak-http.keycloak.svc:80
      - hostname: knot.thecluster.io
        service: http://knot.knot.svc:5555
      - hostname: spindle.thecluster.io
        service: http://spindle.spindle.svc:6555
      # Cloudflare rejects a remote config whose last rule is not a catch-all,
      # and the CRD requires that rule to omit hostname and path.
      - service: http_status:404
