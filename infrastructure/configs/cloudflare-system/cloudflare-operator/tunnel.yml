apiVersion: cloudflare.unmango.dev/v1alpha1
kind: CloudflareTunnel
metadata:
  name: thecluster-io
  namespace: cloudflare-system
spec:
  accountId: 265a046434c952eeecb9710cfd76617c
  configSource: cloudflare
  config:
    ingress:
      - hostname: k8s.thecluster.io
        service: https://kubernetes.default.svc
        originRequest:
          # Verifying needs caPool from kube-root-ca.crt, and the operator mounts nothing
          # into cloudflared. TODO: revisit once it passes spec.template volumes through.
          noTlsVerify: true
      # Browser-facing hosts go through apps/anubis.
      - hostname: prom.thecluster.io
        service: http://grafana.anubis.svc:80
      # Keycloak takes the scheme from X-Forwarded-Proto (proxy.mode xforwarded),
      # which Anubis passes through.
      - hostname: auth.thecluster.io
        service: http://keycloak.anubis.svc:80
      - hostname: flux-webhook.thecluster.io
        service: http://webhook-receiver.flux-system.svc:80
      - hostname: pds.thecluster.io
        service: http://pds.pds.svc:3000
      # Cloudflare requires a final catch-all rule, and the CRD requires it to omit
      # hostname and path.
      - service: http_status:404
