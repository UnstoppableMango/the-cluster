name: Containers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/containers.yml
      - containers/**
      - flake.lock
      - flake.nix
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/containers.yml
      - containers/**
      - flake.lock
      - flake.nix

permissions:
  contents: read
  packages: write

jobs:
  nix-runner:
    # Both architectures build natively on hosted runners. The base image pin in
    # containers/runner/default.nix carries a separate digest and hash per
    # system, and a wrong value surfaces only as a hash mismatch on the affected
    # architecture, so each one needs its own build to be checked at all.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # ghcr rejects mixed-case repository names and github.repository carries
      # the owner's capitalization. docker/metadata-action lowercases what it is
      # given; skopeo and imagetools take the name verbatim.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/nix-runner" >>"$GITHUB_ENV"

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-experimental-features = nix-command flakes pipe-operators

      - name: Build ${{ matrix.arch }} runner image
        run: |
          nix build '.#runner' --out-link image

      # The flake output is a docker-archive tarball, so skopeo copies it straight
      # into the registry without a container runtime in the middle.
      - name: Push ${{ matrix.arch }} image
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_USERNAME: ${{ github.repository_owner }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix run --inputs-from . nixpkgs#skopeo -- copy \
            --dest-creds "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" \
            "docker-archive:image" \
            "docker://${IMAGE}:${GITHUB_SHA}-${{ matrix.arch }}"

  nix-runner-manifest:
    needs: [nix-runner]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/nix-runner" >>"$GITHUB_ENV"

      # The version of this image is the actions-runner base image pinned in the flake.
      - name: Resolve runner version
        run: |
          version="$(grep -oP 'finalImageTag\s*=\s*"\K[^"]+' containers/runner/default.nix)"
          if [ -z "$version" ]; then
            echo "::error::could not read finalImageTag from containers/runner/default.nix"
            exit 1
          fi
          echo "NIX_RUNNER_VERSION=$version" >>"$GITHUB_ENV"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: |
            ${{ env.IMAGE }}
          flavor: |
            latest=false
          # defensive tagging because I'm an idiot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,suffix=-${{ env.NIX_RUNNER_VERSION }}
            type=ref,event=branch,suffix=-v${{ env.NIX_RUNNER_VERSION }}
            type=ref,event=branch,suffix=-${{ env.NIX_RUNNER_VERSION }}-${{ github.run_number }}
            type=ref,event=branch,suffix=-v${{ env.NIX_RUNNER_VERSION }}-${{ github.run_number }}
            type=raw,value=${{ env.NIX_RUNNER_VERSION }}
            type=raw,value=v${{ env.NIX_RUNNER_VERSION }}
            type=sha

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine per-arch images into a manifest list
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<<"$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "${IMAGE}:${GITHUB_SHA}-amd64" \
            "${IMAGE}:${GITHUB_SHA}-arm64"

  actions-runner:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=docker depName=ghcr.io/actions/actions-runner
      ACTIONS_RUNNER_VERSION: 2.337.0
    steps:
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: |
            ghcr.io/${{ github.repository }}/actions-runner
          flavor: |
            latest=false
          # defensive tagging because I'm an idiot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,suffix=-${{ env.ACTIONS_RUNNER_VERSION }}
            type=ref,event=branch,suffix=-v${{ env.ACTIONS_RUNNER_VERSION }}
            type=ref,event=branch,suffix=-${{ env.ACTIONS_RUNNER_VERSION }}-${{ github.run_number }}
            type=ref,event=branch,suffix=-v${{ env.ACTIONS_RUNNER_VERSION }}-${{ github.run_number }}
            type=raw,value=${{ env.ACTIONS_RUNNER_VERSION }}
            type=raw,value=v${{ env.ACTIONS_RUNNER_VERSION }}
            type=sha

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          file: containers/runner/Dockerfile
          build-args: |
            ACTIONS_RUNNER_VERSION=${{ env.ACTIONS_RUNNER_VERSION }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/arm64,linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
