kind: PersistentVolumeClaim
metadata:
  name: legacy-2bc6b513
  namespace: media
spec:
  storageClassName: ec-cephfs
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  volumeName: pvc-3b213930-e834-4fdc-9d6e-9e02f051c49d
