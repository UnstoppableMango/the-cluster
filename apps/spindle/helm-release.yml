apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spindle
  namespace: spindle
spec:
  interval: 10m
  maxHistory: 2
  releaseName: spindle
  targetNamespace: spindle
  chart:
    spec:
      chart: spindle
      version: 0.1.2
      sourceRef:
        kind: HelmRepository
        name: rubxkube
  values:
    common:
      variables:
        nonSecret:
          # Knots sign requests for this audience, fixed once registered on the appview.
          SPINDLE_SERVER_HOSTNAME: spindle.thecluster.io
          SPINDLE_SERVER_OWNER: did:plc:npefy3bubltqewdfhah5i5ef
          SPINDLE_NIXERY_PIPELINES_MAX_CONCURRENT_WORKFLOWS: 4
      deployment:
        # The 18Gi dind ceiling only fits gaea, and the spindle image is amd64.
        nodeSelector:
          kubernetes.io/hostname: gaea
        # The nested-containers recipe instead of the chart's privileged sidecar; see
        # docs/nested-containers.md.
        additionalContainers: []
        initContainers:
          - name: dind
            image: docker:29.10.1-dind@sha256:fbbc96e0af32cdc190aff92ba97a1281a115351a723afe21af78879cc55126b0
            # "dockerd" first, or the entrypoint adds a tcp://0.0.0.0:2375 bind that
            # workflow code could reach.
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --host=tcp://127.0.0.1:2375
              - --tls=false
            env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
            restartPolicy: Always
            startupProbe:
              exec:
                command: [docker, -H, tcp://127.0.0.1:2375, info]
              failureThreshold: 24
              periodSeconds: 5
              timeoutSeconds: 5
            # A restart kills every running workflow, so allow about 90s.
            livenessProbe:
              exec:
                command: [docker, -H, tcp://127.0.0.1:2375, info]
              failureThreshold: 3
              periodSeconds: 30
              timeoutSeconds: 10
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: true
              capabilities:
                add: ["ALL"]
              seccompProfile:
                type: Unconfined
              appArmorProfile:
                type: Unconfined
              procMount: Unmasked
            # Covers MAX_CONCURRENT_WORKFLOWS x MAX_JOB_MEMORY_MB (4 x 4096).
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 18Gi
            volumeMounts:
              - name: docker-data
                mountPath: /var/lib/docker
      persistence:
        volumes:
          - name: data
            storageClassName: standard-rwo
            size: 5Gi
            pvcClaim: ""
            containerMount: /var/lib/spindle
          - name: logs
            storageClassName: standard-rwo
            size: 2Gi
            pvcClaim: ""
            containerMount: /var/log/spindle
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: spindle
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: spindle
              spec:
                template:
                  spec:
                    hostUsers: false
                    runtimeClassName: nested-containers
