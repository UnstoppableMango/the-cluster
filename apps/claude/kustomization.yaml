apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yml
  - github-app-sealed.yml
  - namespace.yml
  - pvc.yml
  - rbac.yml
# Generated so the name carries a content hash: editing the script rolls the
# pod, where a plain ConfigMap would leave the old one running.
configMapGenerator:
  - name: github-app-token
    namespace: claude
    files:
      - github-app-token.mjs
