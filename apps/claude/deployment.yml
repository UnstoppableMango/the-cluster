apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude
  namespace: claude
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: claude
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claude
    spec:
      nodeSelector:
        kubernetes.io/hostname: gaea
      hostUsers: false
      # dind needs a writable /sys/fs/cgroup; see docs/nested-containers.md.
      runtimeClassName: nested-containers
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # Projected into the claude container alone, so sidecars get no API access.
      serviceAccountName: claude
      initContainers:
        - name: dind
          image: docker:29.10.1-dind@sha256:fbbc96e0af32cdc190aff92ba97a1281a115351a723afe21af78879cc55126b0
          args:
            - dockerd
            - --host=unix:///run/docker/docker.sock
            - --group=1000
          restartPolicy: Always
          startupProbe:
            exec:
              command: [docker, --host=unix:///run/docker/docker.sock, info]
            failureThreshold: 24
            periodSeconds: 5
            timeoutSeconds: 5
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add: ["ALL"]
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
            procMount: Unmasked
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 16Gi
          volumeMounts:
            - name: docker
              mountPath: /var/lib/docker
            - name: docker-sock
              mountPath: /run/docker
      containers:
        - name: claude
          image: ghcr.io/unstoppablemango/dotfiles:53d4868
          # remote-control rejects CLAUDE_CODE_OAUTH_TOKEN (inference-only scope), so it
          # reads the `claude auth login` login on the home volume.
          # args, not command, to keep the entrypoint that links the Home Manager files.
          # tini reaps the orphans sessions leave behind.
          args: ["tini", "--", "claude", "remote-control", "--capacity", "16"]
          # Trust is never saved for the home directory itself.
          workingDir: /home/generic/src
          env:
            - name: DOCKER_HOST
              value: unix:///run/docker/docker.sock
          # remote-control exits when stdin closes.
          stdin: true
          tty: true
          # The container is one OOM group, so the limit is generous until peaks under
          # load are measured.
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 48Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Hides the home-manager dotfiles the image ships here.
            - name: home
              mountPath: /home/generic
            - name: docker-sock
              mountPath: /run/docker
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        # Only this container mounts the GitHub App's private key.
        - name: github-app-token
          image: ghcr.io/unstoppablemango/dotfiles:53d4868
          # command skips the entrypoint: two putter runs would race on its state file.
          command: ["node", "/opt/github-app-token/github-app-token.mjs"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home/generic
            - name: github-app-token
              mountPath: /opt/github-app-token
              readOnly: true
            - name: github-app
              mountPath: /var/run/secrets/github-app
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: home
        - name: docker
          persistentVolumeClaim:
            claimName: docker
        - name: docker-sock
          emptyDir: {}
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: github-app-token
          configMap:
            name: github-app-token
        - name: github-app
          secret:
            secretName: github-app
            defaultMode: 0440
