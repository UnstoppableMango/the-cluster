apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude
  namespace: claude
spec:
  replicas: 1
  # One RWO home volume, and one registered remote-control environment.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: claude
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claude
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: claude
          image: ghcr.io/unstoppablemango/dotfiles:4b49f76
          # remote-control rejects CLAUDE_CODE_OAUTH_TOKEN (inference-only scope).
          # It reads the full-scope login that `claude auth login` writes to the home volume.
          command: ["claude", "remote-control"]
          # Trust is never saved for the home directory itself, so rc needs a subdirectory.
          workingDir: /home/generic/src
          # remote-control exits when stdin closes.
          stdin: true
          tty: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The image user is generic (uid 1000, HOME=/home/generic).
            # This hides the home-manager dotfiles the image ships there.
            - name: home
              mountPath: /home/generic
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: home
