apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude
  namespace: claude
spec:
  replicas: 1
  # One RWO home volume, and one registered remote-control environment.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: claude
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claude
    spec:
      # Builds and nix evaluations need the memory headroom only gaea has.
      nodeSelector:
        kubernetes.io/hostname: gaea
      # Pod uids map to an unprivileged host range, so root in any container
      # here, including the build daemons, is not root on gaea.
      hostUsers: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Only the volume root is regrouped, not every file in dockerd's store.
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # dockerd for the docker CLI, compose, buildx, kind and testcontainers.
        # It runs as root with every capability and no seccomp or AppArmor
        # filter, which is what dind needs, but hostUsers: false makes all of
        # it namespaced: root here is an unprivileged uid on gaea, and the
        # capabilities reach only this pod's namespaces. privileged would
        # expose the host's devices, so it stays off.
        - name: dind
          image: docker:29.8.1-dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
          args:
            - dockerd
            - --host=unix:///run/docker/docker.sock
            - --group=1000
          restartPolicy: Always
          startupProbe:
            exec:
              command: [docker, --host=unix:///run/docker/docker.sock, info]
            failureThreshold: 24
            periodSeconds: 5
            timeoutSeconds: 5
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add: ["ALL"]
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
            # Nested containers mount a /proc of their own, which the masked
            # default /proc forbids.
            procMount: Unmasked
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 16Gi
          volumeMounts:
            - name: docker
              mountPath: /var/lib/docker
            - name: docker-sock
              mountPath: /run/docker
      containers:
        - name: claude
          image: ghcr.io/unstoppablemango/dotfiles:5663908
          # remote-control rejects CLAUDE_CODE_OAUTH_TOKEN (inference-only scope).
          # It reads the full-scope login that `claude auth login` writes to the home volume.
          # args, not command: command would replace the image's entrypoint,
          # which links the Home Manager files into the home volume first.
          args: ["claude", "remote-control"]
          # Trust is never saved for the home directory itself, so rc needs a subdirectory.
          workingDir: /home/generic/src
          env:
            - name: DOCKER_HOST
              value: unix:///run/docker/docker.sock
          # remote-control exits when stdin closes.
          stdin: true
          tty: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The image user is generic (uid 1000, HOME=/home/generic).
            # This hides the home-manager dotfiles the image ships there.
            - name: home
              mountPath: /home/generic
            - name: docker-sock
              mountPath: /run/docker
        # Keeps gh, and git through it, logged in as the GitHub App. Only this
        # container mounts the App's private key; claude sees hour-long tokens.
        - name: github-app-token
          image: ghcr.io/unstoppablemango/dotfiles:5663908
          # command skips the entrypoint on purpose: the claude container already
          # links the home files, and two putter runs would race on its state file.
          command: ["node", "/opt/github-app-token/github-app-token.mjs"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home/generic
            - name: github-app-token
              mountPath: /opt/github-app-token
              readOnly: true
            - name: github-app
              mountPath: /var/run/secrets/github-app
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: home
        - name: docker
          persistentVolumeClaim:
            claimName: docker
        - name: docker-sock
          emptyDir: {}
        - name: github-app-token
          configMap:
            name: github-app-token
        - name: github-app
          secret:
            secretName: github-app
            # Group-readable: the files are root-owned, and fsGroup is what lets
            # uid 1000 read them.
            defaultMode: 0440
