apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude
  namespace: claude
spec:
  replicas: 1
  # One RWO home volume, and one registered remote-control environment.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: claude
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claude
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Its token is projected into the claude container alone, since
      # automounting would hand every sidecar API access too.
      serviceAccountName: claude
      containers:
        - name: claude
          image: ghcr.io/unstoppablemango/dotfiles:5663908
          # remote-control rejects CLAUDE_CODE_OAUTH_TOKEN (inference-only scope).
          # It reads the full-scope login that `claude auth login` writes to the home volume.
          # args, not command: command would replace the image's entrypoint,
          # which links the Home Manager files into the home volume first.
          args: ["claude", "remote-control"]
          # Trust is never saved for the home directory itself, so rc needs a subdirectory.
          workingDir: /home/generic/src
          # remote-control exits when stdin closes.
          stdin: true
          tty: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The image user is generic (uid 1000, HOME=/home/generic).
            # This hides the home-manager dotfiles the image ships there.
            - name: home
              mountPath: /home/generic
            # Where kubectl and client-go look for in-cluster credentials.
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        # Keeps gh, and git through it, logged in as the GitHub App. Only this
        # container mounts the App's private key; claude sees hour-long tokens.
        - name: github-app-token
          image: ghcr.io/unstoppablemango/dotfiles:5663908
          # command skips the entrypoint on purpose: the claude container already
          # links the home files, and two putter runs would race on its state file.
          command: ["node", "/opt/github-app-token/github-app-token.mjs"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home/generic
            - name: github-app-token
              mountPath: /opt/github-app-token
              readOnly: true
            - name: github-app
              mountPath: /var/run/secrets/github-app
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: home
        # The same three files automounting would provide; kubelet refreshes
        # the token before it expires.
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: github-app-token
          configMap:
            name: github-app-token
        - name: github-app
          secret:
            secretName: github-app
            # Group-readable: the files are root-owned, and fsGroup is what lets
            # uid 1000 read them.
            defaultMode: 0440
