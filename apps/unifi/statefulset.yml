apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unifi
  namespace: unifi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unifi
  serviceName: unifi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unifi
    spec:
      containers:
        - name: unifi
          image: lscr.io/linuxserver/unifi-network-application:10.6.106-ls146
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: inform
              containerPort: 8080
              protocol: TCP
            - name: stun
              containerPort: 3478
              protocol: UDP
            - name: discovery
              containerPort: 10001
              protocol: UDP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: UTC
            - name: MONGO_HOST
              value: mongo-0.mongo.unifi.svc.cluster.local
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_DBNAME
              value: unifi
            - name: MONGO_AUTHSOURCE
              value: admin
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: username
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: password
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: config
              mountPath: /config
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        storageClassName: standard-rwo
        accessModes:
          - ReadWriteOncePod
        resources:
          requests:
            storage: 5Gi
