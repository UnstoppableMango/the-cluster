apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init
  namespace: unifi
data:
  # Runs once, on the first start against an empty data directory. The
  # _stat and _audit databases are derived by the controller from its
  # database name, so its user needs ownership of all three.
  init-mongo.sh: |
    #!/bin/bash
    mongosh <<EOS
    use admin
    db.auth("${MONGO_INITDB_ROOT_USERNAME}", "${MONGO_INITDB_ROOT_PASSWORD}")
    db.createUser({
      user: "${MONGO_USER}",
      pwd: "${MONGO_PASS}",
      roles: [
        { db: "unifi", role: "dbOwner" },
        { db: "unifi_stat", role: "dbOwner" },
        { db: "unifi_audit", role: "dbOwner" }
      ]
    })
    EOS
