apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: unifi-truststore
spec:
  # The truststore flags replace the JVM's, so the public CAs must come along.
  sources:
    - useDefaultCAs: true
    - secret:
        name: "thecluster.lan"
        key: tls.crt
  target:
    configMap:
      key: ca-bundle.pem
    additionalFormats:
      pkcs12:
        key: truststore.p12
        # A formality, set because password-less PKCS12 is the less travelled JSSE path.
        password: changeit
        # LegacyRC2, the default, is an algorithm current JDKs reject
        profile: Modern2023
    # Separate from thecluster-lan-ca for the truststore format.
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: unifi
