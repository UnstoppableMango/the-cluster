apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: architecture
  namespace: architecture
spec:
  interval: 10m
  maxHistory: 2
  releaseName: architecture
  targetNamespace: architecture
  chartRef:
    kind: OCIRepository
    name: architecture
  # https://github.com/unmango/architecture/blob/main/chart/values.yaml
  values:
    # ghcr.io/unmango/architecture is private; ghcr-sealed.yml holds the token.
    imagePullSecrets:
      - name: ghcr
    ingress:
      enabled: false
    # Internal only: the model holds hardware and network details, so this
    # attaches to the LAN nginx Gateway and no CloudflareTunnel rule points here.
    httpRoute:
      enabled: true
      parentRefs:
        - name: nginx
          namespace: nginx-gateway
      hostnames:
        - architecture.thecluster.lan
    # Not measured yet: a static site. The chart's 16Mi request is under the
    # 32Mi floor.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi
