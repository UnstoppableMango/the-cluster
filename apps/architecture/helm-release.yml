apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: architecture
  namespace: architecture
spec:
  interval: 10m
  maxHistory: 2
  releaseName: architecture
  targetNamespace: architecture
  chartRef:
    kind: OCIRepository
    name: architecture
  # https://github.com/unmango/architecture/blob/main/chart/values.yaml
  values:
    imagePullSecrets:
      - name: ghcr
    ingress:
      enabled: false
    # LAN only: the model holds hardware and network details.
    httpRoute:
      enabled: true
      parentRefs:
        - name: nginx
          namespace: nginx-gateway
      hostnames:
        - architecture.thecluster.lan
    # The chart's 16Mi request is under the 32Mi floor.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi
