apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unmango-runners
  namespace: unmango-runners
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
    namespace: arc-system
  interval: 10m
  # https://github.com/actions/actions-runner-controller/blob/master/charts/gha-runner-scale-set/values.yaml
  values:
    githubConfigUrl: https://github.com/unmango
    githubConfigSecret: thecluster-bot
    # Same `runs-on` label the UnstoppableMango repo-level scale sets use. unmango
    # is an organization, so one org-level scale set covers every repo under it.
    runnerScaleSetName: thecluster
    minRunners: 3
    maxRunners: 30
    # 99% the dind template
    # https://github.com/actions/actions-runner-controller/blob/8c84ab2f4267ce61df1f6b2e26a3ca12b2d1e4ca/charts/gha-runner-scale-set/values.yaml#L310
    template:
      spec:
        # Makes gid 1001 the group owner of the nix volume below and adds it to
        # the runner process's supplementary groups.
        securityContext:
          fsGroup: 1001
        initContainers:
        - name: init-dind-externals
          image: ghcr.io/unstoppablemango/the-cluster/actions-runner:v2.337.0@sha256:312849bf4b980e64596cdd23216d7cc6f7f220192d1de7e69bbac826a852e4dc
          command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
          volumeMounts:
            - name: dind-externals
              mountPath: /home/runner/tmpDir
        - name: dind
          image: docker:dind
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --group=$(DOCKER_GROUP_GID)
          env:
            - name: DOCKER_GROUP_GID
              value: "123"
          securityContext:
            privileged: true
          restartPolicy: Always
          startupProbe:
            exec:
              command:
                - docker
                - info
            initialDelaySeconds: 0
            failureThreshold: 24
            periodSeconds: 5
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
            - name: dind-externals
              mountPath: /home/runner/externals
        containers:
        - name: runner
          image: ghcr.io/unstoppablemango/the-cluster/actions-runner:v2.337.0@sha256:312849bf4b980e64596cdd23216d7cc6f7f220192d1de7e69bbac826a852e4dc
          command: [/home/runner/run.sh]
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
              value: "120"
            # ncps binary cache, reachable in-cluster only. Honored because
            # cachix/install-nix-action writes `trusted-users = root $USER` and
            # the runner image sets USER=runner.
            - name: NIX_CONFIG
              value: |
                extra-substituters = http://ncps.nix-system.svc.cluster.local:8501
                extra-trusted-public-keys = ncps.thecluster.lan:pAJGNVSRmG7gCDSOAaiHDxLFUSdys5Pk0XvcJ5803Dw=
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
            # cachix/install-nix-action does a single-user install, so the store
            # and nix's build directory both land in /nix. Left unmounted that is
            # the container's overlayfs layer, where nix fails to tear down a
            # build directory it just emptied:
            #
            #   error: cannot unlink ".../project/.git": Directory not empty
            #
            # It bites the derivations that write many small files, treefmt's
            # `git init && git add .` check being the reliable one.
            - name: nix
              mountPath: /nix
        volumes:
        - name: work
          emptyDir: {}
        - name: dind-sock
          emptyDir: {}
        - name: dind-externals
          emptyDir: {}
        # An emptyDir does not work here. Kubelet creates one mode 0777, and nix
        # refuses a build directory with a world-writable ancestor. A CSI volume
        # comes up 0775 root:fsGroup, which the runner can write through the
        # fsGroup above.
        - name: nix
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: ssd-rbd
                resources:
                  requests:
                    storage: 30Gi
