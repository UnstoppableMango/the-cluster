apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unmango-runners
  namespace: unmango-runners
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
    namespace: arc-system
  interval: 10m
  # https://github.com/actions/actions-runner-controller/blob/master/charts/gha-runner-scale-set/values.yaml
  values:
    githubConfigUrl: https://github.com/unmango
    githubConfigSecret: thecluster-bot
    # Same `runs-on` label the UnstoppableMango repo-level scale sets use. unmango
    # is an organization, so one org-level scale set covers every repo under it.
    runnerScaleSetName: thecluster
    minRunners: 3
    maxRunners: 30
    # 99% the dind template
    # https://github.com/actions/actions-runner-controller/blob/8c84ab2f4267ce61df1f6b2e26a3ca12b2d1e4ca/charts/gha-runner-scale-set/values.yaml#L310
    template:
      spec:
        initContainers:
        - name: init-dind-externals
          image: ghcr.io/unmango/actions-runner:2.337.0@sha256:6e1bf722f44dea1e3485a68d0ec7c96de6a068e1b6a5b20407adfad7d26370ab
          command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
          volumeMounts:
            - name: dind-externals
              mountPath: /home/runner/tmpDir
        - name: dind
          image: docker:dind
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --group=$(DOCKER_GROUP_GID)
          env:
            - name: DOCKER_GROUP_GID
              value: "123"
          securityContext:
            privileged: true
          restartPolicy: Always
          startupProbe:
            exec:
              command:
                - docker
                - info
            initialDelaySeconds: 0
            failureThreshold: 24
            periodSeconds: 5
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
            - name: dind-externals
              mountPath: /home/runner/externals
        containers:
        - name: runner
          image: ghcr.io/unmango/actions-runner:2.337.0@sha256:6e1bf722f44dea1e3485a68d0ec7c96de6a068e1b6a5b20407adfad7d26370ab
          command: [/home/runner/run.sh]
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
              value: "120"
            # ncps binary cache, reachable in-cluster only. The image's nix is
            # daemonless, so there is no daemon to gate these against a
            # trusted-users list and every setting here applies as written.
            - name: NIX_CONFIG
              value: |
                extra-substituters = http://ncps.nix-system.svc.cluster.local:8501
                extra-trusted-public-keys = ncps.thecluster.lan:pAJGNVSRmG7gCDSOAaiHDxLFUSdys5Pk0XvcJ5803Dw=
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
        volumes:
        - name: work
          emptyDir: {}
        - name: dind-sock
          emptyDir: {}
        - name: dind-externals
          emptyDir: {}
