apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unmango-runners
  namespace: unmango-runners
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
    namespace: arc-system
  interval: 10m
  maxHistory: 2
  # https://github.com/actions/actions-runner-controller/blob/master/charts/gha-runner-scale-set/values.yaml
  values:
    githubConfigUrl: https://github.com/unmango
    githubConfigSecret: thecluster-bot
    runnerScaleSetName: thecluster
    minRunners: 6
    # The mount count that broke dind (#4436) is cluster-wide, shared with
    # apps/arc-runners. 30 here alone reproduces it.
    maxRunners: 24
    # 99% the dind template
    # https://github.com/actions/actions-runner-controller/blob/8c84ab2f4267ce61df1f6b2e26a3ca12b2d1e4ca/charts/gha-runner-scale-set/values.yaml#L310
    template:
      spec:
        securityContext:
          fsGroup: 1001
        initContainers:
        # The dirty page cache of the ~600 MB copy is charged to the container, so a
        # limit below the copy size OOM-kills cp.
        - name: init-dind-externals
          image: ghcr.io/unmango/actions-runner:2.338.2@sha256:405ea8d424026dc4f4ead3c0e1f3fc425ec7789e99dcf9dd23e4fbcdca827eaa
          command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: dind-externals
              mountPath: /home/runner/tmpDir
        # A CSI volume comes up root:fsGroup 2775, and the setgid bit leaks into every
        # store path. Five digits, because a four-digit chmod keeps setgid.
        # Ordered ahead of dind, a native sidecar that later init containers wait on.
        - name: init-nix
          image: ghcr.io/unmango/actions-runner:2.338.2@sha256:405ea8d424026dc4f4ead3c0e1f3fc425ec7789e99dcf9dd23e4fbcdca827eaa
          command: [sh, -c, 'chown runner:runner /nix && chmod 00755 /nix']
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: nix
              mountPath: /nix
        - name: dind
          image: docker:29.10.0-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --group=$(DOCKER_GROUP_GID)
          env:
            - name: DOCKER_GROUP_GID
              value: "123"
          securityContext:
            privileged: true
          restartPolicy: Always
          startupProbe:
            exec:
              command:
                - docker
                - info
            initialDelaySeconds: 0
            failureThreshold: 24
            periodSeconds: 5
            # The 1s default fails while dockerd starts on a loaded node, and the restarts
            # add to the load.
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
            - name: dind-externals
              mountPath: /home/runner/externals
            # dockerd trusts only its image's bundle, not the node's. certs.d scopes the
            # CA to Nixery.
            - name: thecluster-lan-ca
              mountPath: /etc/docker/certs.d/nixery.thecluster.lan
              readOnly: true
        containers:
        - name: runner
          image: ghcr.io/unmango/actions-runner:2.338.2@sha256:405ea8d424026dc4f4ead3c0e1f3fc425ec7789e99dcf9dd23e4fbcdca827eaa
          command: [/home/runner/run.sh]
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
              value: "120"
            # actions/setup-dotnet defaults to /usr/share/dotnet, which the runner cannot write.
            - name: DOTNET_INSTALL_DIR
              value: /home/runner/.dotnet
            - name: NIX_CONFIG
              value: |
                extra-substituters = http://ncps.nix-system.svc.cluster.local:8501
                extra-trusted-public-keys = ncps.thecluster.lan:pAJGNVSRmG7gCDSOAaiHDxLFUSdys5Pk0XvcJ5803Dw=
          # An idle runner uses ~1m CPU and ~60Mi. Requests do not cap runners per node.
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 8Gi
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
            # On the overlayfs layer nix fails to remove build directories:
            #   error: cannot unlink ".../project/.git": Directory not empty
            - name: nix
              mountPath: /nix
        volumes:
        - name: work
          emptyDir: {}
        - name: dind-sock
          emptyDir: {}
        - name: dind-externals
          emptyDir: {}
        - name: thecluster-lan-ca
          configMap:
            name: thecluster-lan-ca
        # Not an emptyDir: kubelet makes those 0777, and nix refuses a world-writable
        # ancestor of a build directory.
        - name: nix
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: standard-rwo
                resources:
                  requests:
                    storage: 20Gi
