apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unmango-runners
  namespace: unmango-runners
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
    namespace: arc-system
  interval: 10m
  # https://github.com/actions/actions-runner-controller/blob/master/charts/gha-runner-scale-set/values.yaml
  values:
    githubConfigUrl: https://github.com/unmango
    githubConfigSecret: thecluster-bot
    # Same `runs-on` label the UnstoppableMango repo-level scale sets use. unmango
    # is an organization, so one org-level scale set covers every repo under it.
    runnerScaleSetName: thecluster
    minRunners: 3
    maxRunners: 30
    # 99% the dind template
    # https://github.com/actions/actions-runner-controller/blob/8c84ab2f4267ce61df1f6b2e26a3ca12b2d1e4ca/charts/gha-runner-scale-set/values.yaml#L310
    template:
      spec:
        # Makes gid 1001 a supplementary group of the runner process. Nothing in
        # this pod needs it: the emptyDirs never did, and /nix is a hostPath,
        # which kubelet leaves alone because ownership is only applied to
        # volumes whose mounter reports itself managed. It is kept so this pod
        # matches the shape charts/arc-runner-scale-set renders, where the work
        # volume is a CSI volume that does need it. init-nix is what makes the
        # store writable here.
        securityContext:
          fsGroup: 1001
        # The nix store is per node, so runners spread over five nodes mean five
        # copies of it and a cold one wherever traffic is thin. Prefer the two
        # large nodes to keep it warm; preferred rather than required so a burst
        # spills instead of queueing. The runner's cpu limit of 8 already rules
        # out castor and pollux.
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: [gaea, zeus]
        initContainers:
        - name: init-dind-externals
          image: ghcr.io/unmango/actions-runner:2.337.0@sha256:7871210f6be2fd471a21b199922b9067c0f5da15e31987dd84f29d97690a2a90
          command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: dind-externals
              mountPath: /home/runner/tmpDir
        # The image ships /nix as an empty directory owned by the runner, but a
        # volume mounted over it brings its own ownership. Kubelet creates the
        # hostPath below root:root 0755 and applies no fsGroup to it, so the
        # runner cannot write there until this container hands it over. Every
        # later pod finds it runner:runner 0755 and both commands are no-ops.
        #
        # Not recursive, and it has to stay that way: the store persists on the
        # node and holds millions of files, so a recursive chown is the mistake
        # apps/hercules-ci documents under fsGroupChangePolicy, and this
        # container starts while jobs in other pods build in the same directory.
        # One chown of the mount root is enough because every pod writing there
        # runs as uid 1000 from the same image; an image that changes the runner
        # uid needs the node directory reset rather than a recursive chown. See
        # docs/arc-nix-store.md.
        #
        # The mode is five digits because a numeric chmod of four digits or
        # fewer preserves a directory's setuid and setgid bits; 00755 is what
        # actually clears a setgid the node directory may carry.
        #
        # Ordered ahead of dind, whose restartPolicy: Always makes it a native
        # sidecar that kubelet waits on before running any later init container.
        # This one has no reason to wait for dockerd.
        - name: init-nix
          image: ghcr.io/unmango/actions-runner:2.337.0@sha256:7871210f6be2fd471a21b199922b9067c0f5da15e31987dd84f29d97690a2a90
          command: [sh, -c, 'chown runner:runner /nix && chmod 00755 /nix']
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: nix
              mountPath: /nix
        - name: dind
          image: docker:29.8.1-dind@sha256:76cd6bbc3ab600fced21a7e1bea77ac00cb7c545eb95d5767e4ec4ffbcb242dc
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --group=$(DOCKER_GROUP_GID)
          env:
            - name: DOCKER_GROUP_GID
              value: "123"
          securityContext:
            privileged: true
          restartPolicy: Always
          startupProbe:
            exec:
              command:
                - docker
                - info
            initialDelaySeconds: 0
            failureThreshold: 24
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
            - name: dind-externals
              mountPath: /home/runner/externals
        containers:
        - name: runner
          image: ghcr.io/unmango/actions-runner:2.337.0@sha256:7871210f6be2fd471a21b199922b9067c0f5da15e31987dd84f29d97690a2a90
          command: [/home/runner/run.sh]
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
              value: "120"
            # actions/setup-dotnet installs to /usr/share/dotnet unless this is
            # set, and the runner user cannot write there. The image has no
            # sudo, so point the install at a path the runner owns.
            - name: DOTNET_INSTALL_DIR
              value: /home/runner/.dotnet
            # ncps binary cache, reachable in-cluster only. The image's nix is
            # daemonless, so there is no daemon to gate these against a
            # trusted-users list and every setting here applies as written.
            - name: NIX_CONFIG
              value: |
                extra-substituters = http://ncps.nix-system.svc.cluster.local:8501
                extra-trusted-public-keys = ncps.thecluster.lan:pAJGNVSRmG7gCDSOAaiHDxLFUSdys5Pk0XvcJ5803Dw=
                # The store is the node's, on the node root filesystem, and
                # nothing else bounds it: a hostPath is invisible to the
                # scheduler's ephemeral-storage accounting. Nix statvfs's that
                # filesystem and collects when free space falls below min-free,
                # stopping at max-free. Both live in libstore rather than the
                # daemon protocol, so they apply in this daemonless client.
                #
                # 64 GiB, because kubelet evicts at nodefs.available < 10% and
                # gaea's 500GB root puts that at 46.6 GiB: anything smaller
                # lets kubelet evict pods before nix ever collects. max-free
                # bounds the damage. Left unset it is effectively unbounded,
                # and by nix's reckoning the warm store is all garbage the
                # moment a job's nix develop exits, so one trigger would delete
                # the cache this volume exists to keep.
                min-free = 68719476736
                max-free = 103079215104
          # An idle runner measures ~1m CPU and ~60Mi. Requests cover the idle
          # floor and a build bursts to the limit; the tradeoff is that requests
          # no longer cap how many runners land on one node.
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 8Gi
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
            # The image ships /nix empty and its nix.conf sets `store = local`,
            # so the store, its database, and nix's build directory all land
            # here. Left unmounted that is the container's overlayfs layer,
            # where nix fails to tear down a build directory it just emptied:
            #
            #   error: cannot unlink ".../project/.git": Directory not empty
            #
            # It bites the derivations that write many small files, treefmt's
            # `git init && git add .` check being the reliable one. The image's
            # nix, gnumake and xz are static copies in /usr/local/bin with their
            # store references nuked, so they keep working with a volume over
            # /nix.
            - name: nix
              mountPath: /nix
        volumes:
        - name: work
          emptyDir: {}
        - name: dind-sock
          emptyDir: {}
        - name: dind-externals
          emptyDir: {}
        # A node-local store, shared by every runner pod on the node and warm
        # after the first one. An ephemeral PVC here handed every job an empty
        # store: 1516 MB of closure realised from ncps in 112.3s against 8.2s
        # for the second nix develop in the same job, and fast-rwo lands on the
        # SSD pool in zeus, so a runner on gaea wrote its whole store over the
        # network, replicated twice.
        #
        # Still not an emptyDir: kubelet creates one mode 0777 and nix refuses a
        # build directory with a world-writable ancestor. Kubelet creates this
        # path 0755 and init-nix takes ownership of it.
        #
        # docs/arc-nix-store.md covers what concurrent pods sharing one store
        # can and cannot do to each other, what auto-GC takes with it, and how
        # to reset the node directory.
        - name: nix
          hostPath:
            path: /var/lib/arc/nix
            type: DirectoryOrCreate
