apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
spec:
  interval: 10m
  releaseName: keycloak
  targetNamespace: keycloak
  chart:
    spec:
      chart: keycloakx
      version: 7.3.0
      sourceRef:
        kind: HelmRepository
        name: codecentric
  values:
    # https://github.com/codecentric/helm-charts/tree/master/charts/keycloakx#configuration
    fullnameOverride: keycloak
    image:
      repository: quay.io/keycloak/keycloak
      tag: "26.7.2"
    replicas: 2
    priorityClassName: system-cluster-critical
    command:
      - /opt/keycloak/bin/kc.sh
      - start
    http:
      relativePath: /
    proxy:
      enabled: true
      mode: xforwarded
    resources:
      limits:
        # Initial startup needs a bit of heft
        cpu: "4"
        memory: 4Gi
      requests:
        cpu: 20m
        memory: 512Mi
    podDisruptionBudget:
      maxUnavailable: 1
    database:
      vendor: postgres
      hostname: postgres-rw.keycloak.svc.cluster.local
      port: 5432
      database: keycloak
      username: keycloak
      # No password: the role authenticates with a client certificate
    dbchecker:
      enabled: true
    extraEnv: |
      - name: KC_HOSTNAME
        value: https://auth.thecluster.io
      # Appended verbatim to the JDBC URL, so it has to start with '?'
      - name: KC_DB_URL_PROPERTIES
        value: >-
          ?ssl=true&sslmode=verify-full&sslrootcert=/opt/unmango/postgres/certs/ca.crt&sslcert=/opt/unmango/postgres/certs/tls.crt&sslkey=/opt/unmango/postgres/certs/tls.key
      - name: JAVA_OPTS_APPEND
        value: -Djgroups.dns.query={{ include "keycloak.fullname" . }}-headless
    extraEnvFrom: |
      - secretRef:
          name: keycloak
    extraVolumes: |
      - name: postgres-cert
        secret:
          secretName: keycloak-postgres-cert
          defaultMode: 0440
    extraVolumeMounts: |
      - name: postgres-cert
        mountPath: /opt/unmango/postgres/certs
        readOnly: true
    ingress:
      enabled: false
    httpRoute:
      enabled: false
