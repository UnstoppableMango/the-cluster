apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: keycloak
spec:
  instances: 2
  # CNPG applies nothing by default, so without this the postgres pods run
  # BestEffort. No CPU limit: throttling the primary stalls both Keycloak
  # replicas behind it.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  storage:
    storageClass: ssd-rbd
    size: 10Gi
  certificates:
    serverCASecret: postgres-ca
    serverTLSSecret: postgres-server
    clientCASecret: postgres-ca
    replicationTLSSecret: postgres-replication
  postgresql:
    pg_hba:
      # Keycloak authenticates with a client certificate whose CN is its role name
      - hostssl keycloak keycloak all cert
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
