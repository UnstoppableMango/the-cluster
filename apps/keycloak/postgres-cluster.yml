apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: keycloak
spec:
  instances: 2
  # No CPU limit: throttling the primary stalls both Keycloak replicas.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  storage:
    storageClass: ssd-rbd
    size: 10Gi
  certificates:
    serverCASecret: postgres-ca
    serverTLSSecret: postgres-server
    clientCASecret: postgres-ca
    replicationTLSSecret: postgres-replication
  postgresql:
    pg_hba:
      - hostssl keycloak keycloak all cert
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
