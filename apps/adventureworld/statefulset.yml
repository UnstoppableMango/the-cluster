apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adventureworld
  namespace: adventureworld
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adventureworld
  serviceName: adventureworld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adventureworld
    spec:
      containers:
        - name: palworld
          image: thijsvanloef/palworld-server-docker:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: PORT
              value: "8211"
            - name: PLAYERS
              value: "16"
            - name: ENABLE_PERF_THREADING_ARGS
              value: "true"
            - name: WORKER_THREADS_SERVER
              value: "8"
            - name: REST_API_ENABLED
              value: "true"
            - name: RCON_ENABLED
              value: "true"
            - name: RCON_PORT
              value: "25575"
            - name: TZ
              value: UTC
            - name: COMMUNITY
              value: "false"
            - name: SERVER_NAME
              value: ADVENTUREWORLD
            - name: SERVER_DESCRIPTION
              value: THECLUSTER ADVENTUREWORLD PalWorld server
            - name: CROSSPLAY_PLATFORMS
              value: (Steam,Xbox,PS5,Mac)
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adventureworld
                  key: serverPassword
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adventureworld
                  key: adminPassword
            - name: BASE_CAMP_WORKER_MAX_NUM
              value: "20"
          ports:
            - name: server
              containerPort: 8211
              protocol: UDP
            - name: query
              containerPort: 27015
              protocol: UDP
            - name: rest
              containerPort: 8212
              protocol: TCP
          # No CPU limit: throttling drops server ticks, and
          # WORKER_THREADS_SERVER already bounds the thread count.
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              memory: 16Gi
          volumeMounts:
            - name: data
              mountPath: /palworld
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: standard-rwo
        accessModes:
          - ReadWriteOncePod
        resources:
          requests:
            storage: 24Gi
