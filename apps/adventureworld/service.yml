apiVersion: v1
kind: Service
metadata:
  name: adventureworld
  namespace: adventureworld
  labels:
    app.kubernetes.io/name: adventureworld
  annotations:
    metallb.io/loadBalancerIPs: 10.0.69.203
    metallb.io/allow-shared-ip: palworld
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: adventureworld
  ports:
    - name: server
      port: 8231
      targetPort: 8211
      protocol: UDP
    - name: query
      port: 27035
      targetPort: 27015
      protocol: UDP
    - name: rest
      port: 8232
      targetPort: 8212
      protocol: TCP
