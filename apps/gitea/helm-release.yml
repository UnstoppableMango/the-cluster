apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: gitea
spec:
  interval: 10m
  releaseName: redis
  targetNamespace: gitea
  chart:
    spec:
      chart: charts/redis
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 10m
  releaseName: gitea
  dependsOn:
    - name: redis
      namespace: gitea
  targetNamespace: gitea
  chart:
    spec:
      chart: gitea
      version: 12.7.0
      sourceRef:
        kind: HelmRepository
        name: gitea
  values:
    image:
      registry: docker.gitea.com
      repository: gitea
      tag: "1.27.3"
    replicaCount: 1
    strategy:
      type: Recreate
    deployment:
      # Gitea's [database] section has no SSLCERT/SSLKEY keys, but it reaches
      # Postgres through lib/pq, whose connector reads these three off the
      # environment. This list lands on the init containers as well as the
      # gitea container, which it has to: configure-gitea connects to the
      # database too.
      env:
        - name: PGSSLROOTCERT
          value: /etc/gitea/postgres/ca.crt
        - name: PGSSLCERT
          value: /etc/gitea/postgres/tls.crt
        - name: PGSSLKEY
          value: /etc/gitea/postgres/tls.key
    extraVolumes:
      # 0440 is load-bearing. lib/pq rejects an sslkey more permissive than
      # 0640 when it is root-owned, which is what a secret volume under
      # fsGroup 1000 gives; the chart's 0644 default trips
      # ErrSSLKeyHasWorldPermissions.
      - name: postgres-cert
        secret:
          secretName: gitea-postgres-cert
          defaultMode: 0440
    # Split rather than the deprecated extraVolumeMounts.
    extraContainerVolumeMounts:
      - name: postgres-cert
        mountPath: /etc/gitea/postgres
        readOnly: true
    extraInitVolumeMounts:
      - name: postgres-cert
        mountPath: /etc/gitea/postgres
        readOnly: true
    # The chart sizes its init containers and leaves the gitea container empty.
    # No CPU limit: a clone or a `git gc` is bursty and throttling it stalls the
    # push that triggered it.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    service:
      http:
        type: ClusterIP
        port: 3000
        clusterIP: ""
      ssh:
        type: ClusterIP
        port: 22
    ingress:
      enabled: false
    persistence:
      enabled: true
      storageClass: unsafe-rbd
      size: 20Gi
      accessModes:
        - ReadWriteOnce
    gitea:
      admin:
        existingSecret: gitea
      config:
        APP_NAME: The Cluster Gitea
        server:
          DOMAIN: gitea.thecluster.io
          ROOT_URL: https://gitea.thecluster.io
          SSH_DOMAIN: gitea.thecluster.lan
          SSH_PORT: 22
          SSH_LISTEN_PORT: 22
          START_SSH_SERVER: true
        database:
          DB_TYPE: postgres
          # A SAN on postgres-server-cert; verify-full matches the certificate
          # against this host.
          HOST: postgres-rw.gitea.svc.cluster.local:5432
          NAME: gitea
          # No PASSWD: the role authenticates with the client certificate
          # mounted at /etc/gitea/postgres, whose CN is this user.
          USER: gitea
          SSL_MODE: verify-full
        cache:
          ADAPTER: redis
          HOST: redis://redis.gitea.svc.cluster.local:6379/0
        session:
          PROVIDER: redis
          PROVIDER_CONFIG: redis://redis.gitea.svc.cluster.local:6379/1
        queue:
          TYPE: redis
          CONN_STR: redis://redis.gitea.svc.cluster.local:6379/2
      oauth:
        - name: GitHub
          provider: github
          existingSecret: gitea
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false
    redis-cluster:
      enabled: false
    redis:
      enabled: false
