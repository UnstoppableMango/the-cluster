apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: gitea
spec:
  interval: 10m
  maxHistory: 2
  releaseName: redis
  targetNamespace: gitea
  chart:
    spec:
      chart: charts/redis
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 10m
  maxHistory: 2
  releaseName: gitea
  dependsOn:
    - name: redis
      namespace: gitea
  targetNamespace: gitea
  chart:
    spec:
      chart: gitea
      version: 12.7.0
      sourceRef:
        kind: HelmRepository
        name: gitea
  values:
    image:
      registry: docker.gitea.com
      repository: gitea
      tag: "28.4.0"
    replicaCount: 1
    strategy:
      type: Recreate
    deployment:
      # Gitea has no SSLCERT/SSLKEY settings, but lib/pq reads these from the
      # environment. The init containers get them too.
      env:
        - name: PGSSLROOTCERT
          value: /etc/gitea/postgres/ca.crt
        - name: PGSSLCERT
          value: /etc/gitea/postgres/tls.crt
        - name: PGSSLKEY
          value: /etc/gitea/postgres/tls.key
    extraVolumes:
      # lib/pq rejects a root-owned sslkey looser than 0640.
      - name: postgres-cert
        secret:
          secretName: gitea-postgres-cert
          defaultMode: 0440
    extraContainerVolumeMounts:
      - name: postgres-cert
        mountPath: /etc/gitea/postgres
        readOnly: true
    extraInitVolumeMounts:
      - name: postgres-cert
        mountPath: /etc/gitea/postgres
        readOnly: true
    # No CPU limit: throttling a clone or `git gc` stalls the push behind it.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    service:
      http:
        type: ClusterIP
        port: 3000
        clusterIP: ""
      ssh:
        type: ClusterIP
        port: 22
    ingress:
      enabled: false
    persistence:
      enabled: true
      storageClass: standard-rwo
      size: 20Gi
      accessModes:
        - ReadWriteOnce
    gitea:
      admin:
        existingSecret: gitea-credentials
      config:
        APP_NAME: The Cluster Gitea
        # gitea.thecluster.io is public, so sign-up stays closed. With auto-registration
        # off, an unknown GitHub identity can link to an existing local account.
        service:
          DISABLE_REGISTRATION: false
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
        server:
          DOMAIN: gitea.thecluster.io
          ROOT_URL: https://gitea.thecluster.io
          SSH_DOMAIN: gitea.thecluster.lan
          SSH_PORT: 22
          SSH_LISTEN_PORT: 22
          START_SSH_SERVER: true
        database:
          DB_TYPE: postgres
          # Must be a SAN on postgres-server-cert for verify-full.
          HOST: postgres-rw.gitea.svc.cluster.local:5432
          NAME: gitea
          USER: gitea
          SSL_MODE: verify-full
        cache:
          ADAPTER: redis
          HOST: redis://redis.gitea.svc.cluster.local:6379/0
        session:
          PROVIDER: redis
          PROVIDER_CONFIG: redis://redis.gitea.svc.cluster.local:6379/1
        queue:
          TYPE: redis
          CONN_STR: redis://redis.gitea.svc.cluster.local:6379/2
      oauth:
        - name: GitHub
          provider: github
          existingSecret: gitea-credentials
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false
    valkey-cluster:
      enabled: false
    valkey:
      enabled: false
