apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  namespace: gitea
spec:
  parentRefs:
    - name: nginx
      namespace: nginx-gateway
  hostnames:
    - gitea.thecluster.lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gitea-http
          port: 3000
---
# gitea.thecluster.io from anywhere, through the Cloudflare Gateway's gitea
# listener, which writes the tunnel rule and the CNAME for it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea-public
  namespace: gitea
spec:
  parentRefs:
    - name: cloudflare
      namespace: cloudflare-system
      sectionName: gitea
  hostnames:
    - gitea.thecluster.io
  rules:
    - backendRefs:
        - name: gitea-http
          port: 3000
