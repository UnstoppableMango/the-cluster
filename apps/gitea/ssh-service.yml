apiVersion: v1
kind: Service
metadata:
  name: ssh-lb
  namespace: gitea
  annotations:
    external-dns.alpha.kubernetes.io/hostname: gitea.thecluster.lan
    # The nginx Gateway's address, shared through lan-gateway, so
    # gitea.thecluster.lan answers both HTTPS and SSH.
    metallb.io/loadBalancerIPs: 10.0.69.200
    metallb.io/allow-shared-ip: lan-gateway
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster # https://metallb.io/usage/#ip-address-sharing
  selector:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: gitea
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
