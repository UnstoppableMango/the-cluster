apiVersion: v1
kind: Service
metadata:
  name: ssh-lb
  namespace: gitea
  annotations:
    external-dns.alpha.kubernetes.io/hostname: gitea.thecluster.lan
    # Shares the nginx Gateway's address, so gitea.thecluster.lan answers SSH too.
    metallb.io/loadBalancerIPs: 10.0.69.200
    metallb.io/allow-shared-ip: lan-gateway
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster # MetalLB shares an address only under Cluster
  selector:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: gitea
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
