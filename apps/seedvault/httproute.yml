# One hostname, two ways in: the Cloudflare Gateway's tunnel from anywhere,
# and the nginx Gateway directly on the LAN, where pihole resolves the name
# to it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: copyparty
  namespace: seedvault
spec:
  parentRefs:
    - name: cloudflare
      namespace: cloudflare-system
      sectionName: g10agosdav
    - name: nginx
      namespace: nginx-gateway
      sectionName: g10agosdav
  hostnames:
    - g10agosdav.thecluster.io
  rules:
    - backendRefs:
        - name: copyparty
          port: 3923
