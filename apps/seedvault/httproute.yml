# One hostname: the Cloudflare tunnel from anywhere, the nginx Gateway on the LAN.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: copyparty
  namespace: seedvault
spec:
  parentRefs:
    - name: cloudflare
      namespace: cloudflare-system
      sectionName: g10agosdav
    - name: nginx
      namespace: nginx-gateway
      sectionName: g10agosdav
  hostnames:
    - g10agosdav.thecluster.io
  rules:
    - backendRefs:
        - name: copyparty
          port: 3923
