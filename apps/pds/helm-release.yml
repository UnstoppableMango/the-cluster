apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pds
  namespace: pds
spec:
  interval: 10m
  maxHistory: 2
  releaseName: pds
  targetNamespace: pds
  chartRef:
    kind: OCIRepository
    name: pds
  values:
    fullnameOverride: pds
    image:
      # Upstream's only immutable tags are sha-<commit>. This is v0.4.5037.
      tag: sha-ed2dcb8616cd56ceab8e4f34973d2b2c67ea1bd9
    config:
      # The server's did:web identity: changing it means migrating every account.
      # Handles under a subdomain are a second level down, which Cloudflare's
      # Universal SSL does not cover, so accounts use custom-domain handles.
      hostname: pds.thecluster.io
      inviteRequired: true
    blobstore:
      bucket: pds-blobs
      endpoint: http://rook-ceph-rgw-s3.rook-ceph.svc:80
      region: us-east-1
      forcePathStyle: true
    # Back plc-rotation-key up outside the cluster: losing it freezes every DID on
    # this PDS.
    credentials:
      existingSecret: pds
    persistence:
      storageClass: standard-rwo
      size: 10Gi
    httpRoute:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 512Mi
  postRenderers:
    - kustomize:
        patches:
          # Rook writes the bucket keys as AWS_*, not the chart's blobstore-* keys.
          - target:
              kind: Deployment
              name: pds
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: pds
              spec:
                template:
                  spec:
                    containers:
                      - name: pds
                        env:
                          - name: PDS_BLOBSTORE_S3_ACCESS_KEY_ID
                            valueFrom:
                              secretKeyRef:
                                name: pds-blobs
                                key: AWS_ACCESS_KEY_ID
                          - name: PDS_BLOBSTORE_S3_SECRET_ACCESS_KEY
                            valueFrom:
                              secretKeyRef:
                                name: pds-blobs
                                key: AWS_SECRET_ACCESS_KEY
