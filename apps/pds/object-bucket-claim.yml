# The bucket is the only copy of the blobs, on an erasure-coded pool with an
# OSD failure domain, so losing zeus or gaea for good can lose them.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: pds-blobs
  namespace: pds
spec:
  bucketName: pds-blobs
  storageClassName: bucket
