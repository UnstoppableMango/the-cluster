# nginx's 1m default body size fails a docker push of any larger layer.
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: harbor
  namespace: harbor-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: goharbor-route
  body:
    maxSize: "0"
