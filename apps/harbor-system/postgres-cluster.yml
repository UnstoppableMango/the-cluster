# Two instances: once nodes pull through Harbor, waiting on an RBD reattach
# stalls them.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: harbor-system
spec:
  instances: 2
  # No CPU limit: throttling the primary stalls every pull.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  storage:
    storageClass: fast-rwo
    size: 10Gi
  bootstrap:
    initdb:
      database: registry
      owner: harbor
