# Rook writes a harbor-registry Secret and ConfigMap, hence the chart's
# fullnameOverride.
#
# The data pool is erasure coded per OSD, which suits re-fetchable proxy-cache
# blobs. Pushed images need replication elsewhere before anything depends on them.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: harbor-registry
  namespace: harbor-system
spec:
  bucketName: harbor-registry
  storageClassName: bucket
