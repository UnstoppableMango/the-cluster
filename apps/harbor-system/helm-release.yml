apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor-system
spec:
  interval: 10m
  maxHistory: 2
  releaseName: harbor
  targetNamespace: harbor-system
  # core crash-loops until Postgres bootstraps, which can outlast Helm's 5m wait.
  timeout: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: harbor
      version: 1.19.4
      sourceRef:
        kind: HelmRepository
        name: harbor
  # https://github.com/goharbor/harbor-helm/blob/v1.19.2/values.yaml
  values:
    # At the default fullname the chart's harbor-registry ConfigMap and Secret
    # collide with the ones Rook writes for the bucket claim.
    fullnameOverride: goharbor
    # One label deep so the *.thecluster.lan wildcard matches.
    expose:
      type: route
      tls:
        enabled: false
      route:
        parentRefs:
          - name: nginx
            namespace: nginx-gateway
        hosts:
          - harbor.thecluster.lan
    externalURL: https://harbor.thecluster.lan
    # The admin password only seeds the database on first start.
    # secretKey encrypts registry credentials in the database and must survive upgrades.
    existingSecretAdminPassword: harbor
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    existingSecretSecretKey: harbor
    persistence:
      enabled: true
      resourcePolicy: keep
      persistentVolumeClaim:
        redis:
          storageClass: fast-rwo
          size: 1Gi
        trivy:
          storageClass: fast-rwo
          size: 5Gi
      # Rook writes AWS_* key names, not the REGISTRY_STORAGE_S3_* ones existingSecret
      # expects, so extraEnvVars maps them.
      imageChartStorage:
        # Otherwise blob GETs redirect to presigned RGW Service URLs that nothing
        # outside the cluster can resolve.
        disableredirect: true
        type: s3
        s3:
          bucket: harbor-registry
          region: us-east-1
          # Plain HTTP: SigV4 keeps the secret off the wire, and the chart takes a CA only
          # from a Secret, while thecluster.lan's is a ConfigMap.
          regionendpoint: http://rook-ceph-rgw-s3.rook-ceph.svc:80
    # goharbor publishes amd64-only images.
    portal:
      image:
        repository: goharbor/harbor-portal
        tag: v2.16.0
      nodeSelector:
        kubernetes.io/arch: amd64
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - gaea
    core:
      image:
        repository: goharbor/harbor-core
        tag: v2.16.0
      nodeSelector:
        kubernetes.io/arch: amd64
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 768Mi
    jobservice:
      image:
        repository: goharbor/harbor-jobservice
        tag: v2.16.0
      nodeSelector:
        kubernetes.io/arch: amd64
      replicas: 1
      # The "file" logger would need the jobservice PVC.
      jobLoggers:
        - database
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    registry:
      nodeSelector:
        kubernetes.io/arch: amd64
      registry:
        image:
          repository: goharbor/registry-photon
          tag: v2.16.0
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        extraEnvVars:
          - name: REGISTRY_STORAGE_S3_ACCESSKEY
            valueFrom:
              secretKeyRef:
                name: harbor-registry
                key: AWS_ACCESS_KEY_ID
          - name: REGISTRY_STORAGE_S3_SECRETKEY
            valueFrom:
              secretKeyRef:
                name: harbor-registry
                key: AWS_SECRET_ACCESS_KEY
          # The chart has no value for this. Distribution 3 defaults to virtual-host
          # addressing, which RGW's Service name cannot answer.
          - name: REGISTRY_STORAGE_S3_FORCEPATHSTYLE
            value: "true"
      controller:
        image:
          repository: goharbor/harbor-registryctl
          tag: v2.16.0
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        # registryctl garbage-collects the same bucket.
        extraEnvVars:
          - name: REGISTRY_STORAGE_S3_ACCESSKEY
            valueFrom:
              secretKeyRef:
                name: harbor-registry
                key: AWS_ACCESS_KEY_ID
          - name: REGISTRY_STORAGE_S3_SECRETKEY
            valueFrom:
              secretKeyRef:
                name: harbor-registry
                key: AWS_SECRET_ACCESS_KEY
          - name: REGISTRY_STORAGE_S3_FORCEPATHSTYLE
            value: "true"
      replicas: 1
    trivy:
      enabled: true
      image:
        repository: goharbor/trivy-adapter-photon
        tag: v2.16.0
      nodeSelector:
        kubernetes.io/arch: amd64
      replicas: 1
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 1Gi
    # Harbor has no client certificate support, so it uses CNPG's postgres-app password.
    database:
      type: external
      external:
        host: postgres-rw.harbor-system.svc
        port: "5432"
        username: harbor
        coreDatabase: registry
        existingSecret: postgres-app
        # Trusting CNPG's CA would mean mounting its key too.
        sslmode: require
      # CNPG's max_connections is 100, so the chart's 900 lets one pod starve the rest.
      maxOpenConns: 40
      maxIdleConns: 10
    redis:
      type: internal
      internal:
        image:
          repository: goharbor/redis-photon
          tag: v2.15.1
        nodeSelector:
          kubernetes.io/arch: amd64
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
    exporter:
      image:
        repository: goharbor/harbor-exporter
        tag: v2.16.0
      nodeSelector:
        kubernetes.io/arch: amd64
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
