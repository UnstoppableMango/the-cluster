# Claims reserving imported ceph volumes whose original PVC name is unknown.
# Rename once the volume contents identify the workload it belonged to.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: legacy-0dcc73da
  namespace: harbor-system
spec:
  storageClassName: ec-cephfs
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  volumeName: pvc-61ab31d5-bc3f-404a-97a5-366d8a07c3ec
  resources:
    requests:
      storage: 1Gi
