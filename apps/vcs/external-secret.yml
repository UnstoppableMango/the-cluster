# The vcs-pulumi Secret the Stack's envRefs read, fetched from the Key Vault the
# vcs GitHub Actions workflow already uses, under the same secret names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vcs-pulumi
  namespace: vcs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-unstoppablemango-pulumi
  target:
    name: vcs-pulumi
  data:
    - secretKey: PULUMI_CONFIG_PASSPHRASE
      remoteRef:
        key: vcs-pulumi-passphrase
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: vcs-state-bucket-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: vcs-state-bucket-key
