# Provider tokens are encrypted in the program's Pulumi.prod.yaml, so the only
# credentials here are the state bucket key and the passphrase.
apiVersion: pulumi.com/v1
kind: Stack
metadata:
  name: vcs
  namespace: vcs
spec:
  serviceAccountName: vcs
  projectRepo: https://github.com/UnstoppableMango/vcs
  branch: main
  shallow: true
  stack: prod
  # The only thing that applies prod; vcs CI only previews.
  refresh: true
  envRefs:
    # Without this, refresh uses the token saved in state, which fails after a rotation.
    PULUMI_RUN_PROGRAM:
      type: Literal
      literal:
        value: "true"
    PULUMI_CONFIG_PASSPHRASE:
      type: Secret
      secret:
        name: vcs-pulumi
        key: PULUMI_CONFIG_PASSPHRASE
    AWS_ACCESS_KEY_ID:
      type: Secret
      secret:
        name: vcs-pulumi
        key: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY:
      type: Secret
      secret:
        name: vcs-pulumi
        key: AWS_SECRET_ACCESS_KEY
  workspaceTemplate:
    spec:
      # pulumi/pulumi images ship no bun.
      image: ghcr.io/unmango/pulumi:3.255.0-bun
      # TODO: size from measured runs.
      resources:
        limits:
          memory: 1536Mi
        requests:
          cpu: 500m
          memory: 512Mi
      podTemplate:
        spec:
          initContainers:
            - name: bootstrap
              resources:
                limits:
                  memory: 64Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
            - name: fetch
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
          # The CRD requires this list; naming the operator's container changes nothing.
          containers:
            - name: pulumi
