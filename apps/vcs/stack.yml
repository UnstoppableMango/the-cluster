# Runs the UnstoppableMango/vcs Pulumi program (GitHub and GitLab repos as code).
# State lives in the B2 bucket named by the program's Pulumi.yaml, and the
# provider tokens are passphrase-encrypted in its Pulumi.prod.yaml, so the only
# credentials here are the bucket key and the passphrase.
apiVersion: pulumi.com/v1
kind: Stack
metadata:
  name: vcs
  namespace: vcs
spec:
  serviceAccountName: vcs
  projectRepo: https://github.com/UnstoppableMango/vcs
  branch: main
  shallow: true
  stack: prod
  refresh: true
  # vcs's own GitHub Actions workflow still runs `pulumi up` on every push to
  # main. Preview only until that job is retired, so the two never race for
  # the stack lock or apply the same change twice.
  preview: true
  envRefs:
    PULUMI_CONFIG_PASSPHRASE:
      type: Secret
      secret:
        name: vcs-pulumi
        key: PULUMI_CONFIG_PASSPHRASE
    AWS_ACCESS_KEY_ID:
      type: Secret
      secret:
        name: vcs-pulumi
        key: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY:
      type: Secret
      secret:
        name: vcs-pulumi
        key: AWS_SECRET_ACCESS_KEY
  workspaceTemplate:
    spec:
      image: pulumi/pulumi:3.268.0-nonroot
      # Unmeasured starting point: bun install plus the github and gitlab
      # provider plugins. Revisit once a few runs have been observed.
      resources:
        limits:
          memory: 1536Mi
        requests:
          cpu: 500m
          memory: 512Mi
      podTemplate:
        spec:
          initContainers:
            # The program's runtime is bun, which the pulumi image doesn't
            # ship. Copy the binary onto the shared volume ahead of the agent.
            - name: bun
              image: oven/bun:1.4.3
              command: ["sh", "-c", "mkdir -p /share/bun && cp /usr/local/bin/bun /share/bun/bun"]
              securityContext:
                runAsUser: 1000
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                limits:
                  memory: 64Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
              volumeMounts:
                - name: share
                  mountPath: /share
            # The operator leaves its own init containers unsized.
            - name: bootstrap
              resources:
                limits:
                  memory: 64Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
            - name: fetch
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
          containers:
            # The image's own PATH with the bun directory in front. Keep in step
            # with the image tag above.
            - name: pulumi
              env:
                - name: PATH
                  value: /share/bun:/pulumi/bin:/usr/local/share/fnm/aliases/default/bin:/usr/local/share/pyenv/shims:/usr/local/share/pyenv/bin:/usr/local/share/dotnet:/go/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
