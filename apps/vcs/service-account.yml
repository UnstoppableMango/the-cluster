apiVersion: v1
kind: ServiceAccount
metadata:
  name: vcs
  namespace: vcs
---
# The operator authenticates to the workspace pod's agent with this account's
# token, and the agent checks it with a TokenReview.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vcs:system:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vcs
    namespace: vcs
