apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: palworld
  namespace: palworld
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: palworld
  serviceName: palworld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: palworld
    spec:
      containers:
        - name: palworld
          image: thijsvanloef/palworld-server-docker:latest
          ports:
            - name: http
              containerPort: 8211
              protocol: UDP
            - name: query
              containerPort: 27015
              protocol: UDP
            - name: rest
              containerPort: 8212
              protocol: UDP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: PORT
              value: "8211"
            - name: PLAYERS
              value: "16"
            - name: MULTITHREADING
              value: "true"
            - name: REST_API_ENABLED
              value: "true" # Is this different than RCON?
            - name: RCON_ENABLED
              value: "true"
            - name: RCON_PORT
              value: "25575"
            - name: TZ
              value: UTC
            - name: COMMUNITY
              value: "false"
            - name: SERVER_NAME
              value: THECLUSTER
            - name: SERVER_DESCRIPTION
              value: THECLUSTER PalWorld server
            - name: CROSSPLAY_PLATFORMS
              value: "(Steam,Xbox,PS5,Mac)"
            # - name: SERVER_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: palworld
            #       key: serverPassword
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: palworld
                  key: adminPassword
            - name: BASE_CAMP_WORKER_MAX_NUM
              value: "20"
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: data
              mountPath: /palworld
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: unsafe-rbd
        accessModes:
          - ReadWriteOncePod
        resources:
          requests:
            storage: 24Gi
