apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: knot
  namespace: knot
spec:
  interval: 10m
  maxHistory: 2
  releaseName: knot
  targetNamespace: knot
  chart:
    spec:
      chart: knot
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: unmango-charts
  values:
    # The identity is did:web:<hostname>, fixed once registered on the appview.
    hostname: knot.thecluster.io
    admins:
      - did:plc:npefy3bubltqewdfhah5i5ef
    # Back the key up outside the cluster, or the sealed key store is unreadable.
    masterKey:
      existingSecret: knot-master-key
    # Only in-cluster peers can forge it: the HTTP Service is ClusterIP.
    trustedProxyHeader: cf-connecting-ip
    persistence:
      repos:
        storageClassName: standard-rwo
        accessModes: [ReadWriteOncePod]
      state:
        storageClassName: standard-rwo
        accessModes: [ReadWriteOncePod]
    # LAN-only until port 22 is forwarded.
    ssh:
      service:
        type: LoadBalancer
        annotations:
          metallb.io/loadBalancerIPs: 10.0.69.210
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
