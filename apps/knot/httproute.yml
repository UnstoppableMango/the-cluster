apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: knot
  namespace: knot
spec:
  parentRefs:
    - name: cloudflare
      namespace: cloudflare-system
      sectionName: knot
  hostnames:
    - knot.thecluster.io
  rules:
    - backendRefs:
        - name: knot
          port: 5555
