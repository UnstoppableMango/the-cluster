apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dashboard
  namespace: thecluster-lan
spec:
  interval: 10m
  maxHistory: 2
  releaseName: dashboard
  targetNamespace: thecluster-lan
  chartRef:
    kind: OCIRepository
    name: dashboard
  # https://github.com/UnstoppableMango/thecluster.lan/blob/main/charts/thecluster/values.yaml
  values:
    fullnameOverride: dashboard
    image:
      repository: ghcr.io/unstoppablemango/thecluster.lan/dashboard
      tag: latest@sha256:1cb36c5ac30855612aa5405e592bde7984984ceb0ef919c03efabe68fb2c68b4
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      parentRefs:
        - name: nginx
          namespace: nginx-gateway
      hostnames:
        - thecluster.lan
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
