# Covers the 100MB web UI chunks, the most Cloudflare's edge passes anyway.
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: nextcloud
  body:
    maxSize: "0"
