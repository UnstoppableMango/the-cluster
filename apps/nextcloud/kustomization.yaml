apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Everything the chart would bundle besides the workload is a plain manifest,
# so a Nextcloud operator can replace the chart alone (unmango/thecluster-operator#156).
resources:
  - namespace.yml
  - admin-sealed.yml
  - oidc-sealed.yml
  - certificate.yml
  - postgres-cluster.yml
  - pvcs.yml
  - redis.yml
  - helm-repository.yml
  - helm-release.yml
  - httproute.yml
  - client-settings-policy.yml
