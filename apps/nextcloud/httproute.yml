# One hostname: the Cloudflare tunnel from anywhere, the nginx Gateway on the
# LAN. See docs/adr/0002-nextcloud-one-hostname-split-dns.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  parentRefs:
    - name: cloudflare
      namespace: cloudflare-system
      sectionName: cloud
    - name: nginx
      namespace: nginx-gateway
      sectionName: cloud
  hostnames:
    - cloud.thecluster.io
  rules:
    - backendRefs:
        - name: nextcloud
          port: 8080
