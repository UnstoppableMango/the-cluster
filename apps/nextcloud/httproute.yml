# One hostname, two ways in: the Cloudflare Gateway's tunnel from anywhere, and
# the nginx Gateway directly on the LAN, where pihole resolves the name to it.
# See docs/adr/0002-nextcloud-one-hostname-split-dns.md. Tailscale becomes a
# third parentRef here, not a third hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  parentRefs:
    - name: cloudflare
      namespace: cloudflare-system
      sectionName: cloud
    - name: nginx
      namespace: nginx-gateway
      sectionName: cloud
  hostnames:
    - cloud.thecluster.io
  rules:
    - backendRefs:
        - name: nextcloud
          port: 8080
