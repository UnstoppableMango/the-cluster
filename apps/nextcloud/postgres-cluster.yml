apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: nextcloud
spec:
  instances: 2
  # CNPG copies these onto the instance volumes for Velero.
  # TODO: back up through the Barman Cloud plugin instead of crash-consistent snapshots.
  inheritedMetadata:
    labels:
      backup.thecluster.io/schedule: daily
      backup.thecluster.io/backblaze: 'true'
      backup.thecluster.io/thecluster: 'true'
  # No CPU limit: throttling the primary stalls every request.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  storage:
    storageClass: fast-rwo
    size: 10Gi
  certificates:
    serverCASecret: postgres-ca
    serverTLSSecret: postgres-server
    clientCASecret: postgres-ca
    replicationTLSSecret: postgres-replication
  postgresql:
    # Nextcloud cannot present a client certificate, so this forces its password over TLS.
    pg_hba:
      - hostnossl nextcloud nextcloud all reject
  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
