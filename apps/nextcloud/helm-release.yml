apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 10m
  maxHistory: 2
  releaseName: nextcloud
  targetNamespace: nextcloud
  dependsOn:
    - name: redis
      namespace: nextcloud
  chart:
    spec:
      chart: nextcloud
      version: 9.4.6
      sourceRef:
        kind: HelmRepository
        name: nextcloud
  # No rollback: `occ upgrade` may already have migrated the database. Restore
  # from backup instead; see README.md.
  upgrade:
    remediation:
      retries: 0
  # https://github.com/nextcloud/helm/blob/main/charts/nextcloud/values.yaml
  values:
    image:
      repository: library/nextcloud
      flavor: fpm-alpine
      tag: 35.0.3-fpm-alpine
    replicaCount: 1
    nextcloud:
      host: cloud.thecluster.io
      # Break-glass admin; everyone else logs in through Keycloak.
      existingSecret:
        enabled: true
        secretName: nextcloud-admin
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
        tokenKey: nextcloud-token
      # The web updater would replace the code under Flux.
      update: 0
      datadir: /var/www/html/data
      strategy:
        type: Recreate
      # Removing an app from the before-starting list does not disable it.
      hooks:
        # Nextcloud refuses every request until data/ is 0770.
        pre-installation: |
          #!/bin/sh
          set -eu
          chmod 0770 /var/www/html/data
        before-starting: |
          #!/bin/sh
          set -eu
          occ() { php /var/www/html/occ "$@"; }

          # The entrypoint installs only on first start, so a failed install lands here.
          if ! status=$(occ status --output=json); then
            echo "occ status failed: $status" >&2
            exit 1
          fi
          case "$status" in
            *'"installed":true'*) ;;
            *)
              echo "Nextcloud is not installed, and the entrypoint will not retry. See apps/nextcloud/README.md." >&2
              exit 1
              ;;
          esac

          for app in user_oidc calendar contacts memories previewgenerator richdocuments serverinfo; do
            occ app:install "$app" >/dev/null 2>&1 || true
            occ app:enable "$app"
          done

          occ config:app:set serverinfo token --value="$NEXTCLOUD_TOKEN"

          occ config:app:set richdocuments wopi_url --value=https://office.thecluster.io
          occ richdocuments:activate-config || true

          # nextcloud-oidc is absent until UnstoppableMango/iam declares the client.
          if [ -n "${OIDC_CLIENT_ID:-}" ]; then
            occ user_oidc:provider keycloak \
              --clientid="$OIDC_CLIENT_ID" \
              --clientsecret="$OIDC_CLIENT_SECRET" \
              --discoveryuri=https://auth.thecluster.io/realms/thecluster/.well-known/openid-configuration \
              --unique-uid=0 \
              --mapping-uid=preferred_username \
              --group-provisioning=1 \
              --mapping-groups=groups
          fi
      configs:
        thecluster.config.php: |-
          <?php
          $CONFIG = array(
            'trusted_domains' => array(
              'cloud.thecluster.io',
              // The metrics exporter, through the Service.
              'nextcloud.nextcloud.svc.cluster.local',
            ),
            'overwriteprotocol' => 'https',
            'overwrite.cli.url' => 'https://cloud.thecluster.io',
            // The pod network: requests arrive from the cloudflared pods the
            // Cloudflare Gateway runs and from the nginx Gateway, both of which
            // set X-Forwarded-For. rosequartz's pod CIDR (nixos NETWORK.md),
            // not k3s's 10.42.0.0/16.
            'trusted_proxies' => array('10.1.0.0/16'),
            'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
            // Wherever cluster DNS sends office.thecluster.io, a resolver that
            // splits the horizon answers with the LAN Gateway, and Nextcloud
            // refuses private addresses without this.
            'allow_local_remote_servers' => true,
            // postgres-app holds a password, and pg_hba in
            // postgres-cluster.yml refuses it without TLS.
            'pgsql_ssl' => array(
              'mode' => 'verify-full',
              'rootcert' => '/etc/nextcloud/postgres/ca.crt',
            ),
          );
      extraEnv:
        - name: NEXTCLOUD_TOKEN
          valueFrom:
            secretKeyRef:
              name: nextcloud-admin
              key: nextcloud-token
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: nextcloud-oidc
              key: client-id
              optional: true
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-oidc
              key: client-secret
              optional: true
      # The chart waits only for databases it bundles, and the entrypoint never
      # retries a failed install.
      extraInitContainers:
        - name: wait-for-backends
          image: docker.io/library/busybox:1.38.0
          command:
            - /bin/sh
            - -c
            - |
              until nc -z -w 2 postgres-rw.nextcloud.svc.cluster.local 5432 &&
                nc -z -w 2 redis.nextcloud.svc.cluster.local 6379; do
                echo "waiting for postgres-rw and redis"
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 32Mi
      # postgres-server also holds the server's key.
      extraVolumes:
        - name: postgres-ca
          projected:
            sources:
              - secret:
                  name: postgres-server
                  items:
                    - key: ca.crt
                      path: ca.crt
      extraVolumeMounts:
        - name: postgres-ca
          mountPath: /etc/nextcloud/postgres
          readOnly: true
    # TODO: size from measured usage. No CPU limit: throttling php-fpm is latency.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    # The Gateway speaks HTTP, not FastCGI.
    nginx:
      enabled: true
      image:
        repository: library/nginx
        tag: 1.31.10-alpine
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      host: postgres-rw.nextcloud.svc.cluster.local
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: postgres-app
        usernameKey: username
        passwordKey: password
    externalRedis:
      enabled: true
      host: redis.nextcloud.svc.cluster.local
      port: "6379"
    persistence:
      enabled: true
      existingClaim: nextcloud-app
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-data
    cronjob:
      enabled: true
      type: cronjob
      cronjob:
        schedule: "*/5 * * * *"
        activeDeadlineSeconds: 3600
        command:
          - /bin/sh
          - -c
          - php -f /var/www/html/cron.php && php /var/www/html/occ preview:pre-generate
        # cron.php runs only as the owner of config.php.
        securityContext:
          runAsUser: 82
          runAsGroup: 82
        # nextcloud-app is ReadWriteOnce.
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nextcloud
                    app.kubernetes.io/component: app
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 2Gi
    startupProbe:
      enabled: true
    # musl fails the whole lookup on a SERVFAIL from any search domain, so
    # ndots:1 sends dotted names straight to the absolute name. Keep in-cluster
    # names fully qualified: a short `svc.ns` stops resolving.
    dnsConfig:
      options:
        - name: ndots
          value: "1"
    metrics:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    prometheus:
      serviceMonitor:
        enabled: true
