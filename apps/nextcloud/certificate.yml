# Scoped to this database: chaining off thecluster.io would make Postgres
# accept any cluster-issued client cert.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: postgres-selfsigned
  namespace: nextcloud
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-ca
  namespace: nextcloud
spec:
  isCA: true
  commonName: nextcloud-postgres-ca
  secretName: postgres-ca
  # CNPG reloads on renewal only for Secrets it owns or that carry this label.
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  duration: 43800h0m0s # 5y
  renewBefore: 8760h0m0s # 1y
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: postgres-selfsigned
  subject:
    organizations:
      - unmango
  privateKey:
    algorithm: ECDSA
    size: 256
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: postgres
  namespace: nextcloud
spec:
  ca:
    secretName: postgres-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-server
  namespace: nextcloud
spec:
  secretName: postgres-server
  # Renews every 75 days, and an unreloaded expiry breaks verify-full clients.
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: postgres
  duration: 2160h0m0s # 90d
  renewBefore: 360h0m0s # 15d
  commonName: postgres-rw
  usages:
    - server auth
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
    rotationPolicy: Always
  dnsNames:
    - postgres-rw
    - postgres-rw.nextcloud
    - postgres-rw.nextcloud.svc
    - postgres-rw.nextcloud.svc.cluster.local
    - postgres-ro
    - postgres-ro.nextcloud
    - postgres-ro.nextcloud.svc
    - postgres-ro.nextcloud.svc.cluster.local
    - postgres-r
    - postgres-r.nextcloud
    - postgres-r.nextcloud.svc
    - postgres-r.nextcloud.svc.cluster.local
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-replication
  namespace: nextcloud
spec:
  secretName: postgres-replication
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: postgres
  duration: 2160h0m0s # 90d
  renewBefore: 360h0m0s # 15d
  # CNPG requires the replication client certificate to be issued to this exact user
  commonName: streaming_replica
  usages:
    - client auth
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
    rotationPolicy: Always
---
# The cloud listener's certificate lives here so a failed issuance holds up
# only this app.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cloud
  namespace: nextcloud
spec:
  secretName: cloud-tls
  dnsNames:
    - cloud.thecluster.io
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: nginx-gateway-tls
  namespace: nextcloud
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: nginx-gateway
  to:
    - group: ""
      kind: Secret
      name: cloud-tls
