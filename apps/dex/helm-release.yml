apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
  namespace: dex
spec:
  interval: 10m
  releaseName: dex
  targetNamespace: dex
  chart:
    spec:
      chart: dex
      version: 0.24.1
      sourceRef:
        kind: HelmRepository
        name: dex
  values:
    # https://github.com/dexidp/helm-charts/tree/master/charts/dex#values
    image:
      repository: ghcr.io/dexidp/dex
      tag: v2.45.1
    replicaCount: 2
    priorityClassName: system-cluster-critical
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 64Mi
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    # Without this both replicas can share a node, and the PDB guards nothing.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: dex
            app.kubernetes.io/instance: dex
    podSecurityContext:
      runAsNonRoot: true
      # The image sets USER dex by name, and the kubelet can only verify
      # runAsNonRoot against a numeric uid. 1001 is dex in the image's passwd.
      runAsUser: 1001
      runAsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    # The entrypoint renders the config template into /tmp before starting
    # dex, and the root filesystem is read-only.
    volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    envFrom:
      - secretRef:
          name: dex-credentials
    # Dex's own $VAR expansion only reaches the config blocks of storage,
    # signer, and connectors (cmd/dex/config.go), so staticClients[].secret
    # would keep the literal placeholder and every token exchange would fail
    # with invalid_client. The entrypoint runs the whole file through gomplate
    # before dex reads it, and {{ .Env.VAR }} is expanded everywhere.
    config:
      issuer: https://dex.thecluster.io
      storage:
        type: kubernetes
        config:
          inCluster: true
      logger:
        level: info
        format: json
      expiry:
        signingKeys: 6h
        idTokens: 24h
      oauth2:
        skipApprovalScreen: true
        responseTypes:
          - code
      enablePasswordDB: false
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: '{{ .Env.GITHUB_CLIENT_ID }}'
            clientSecret: '{{ .Env.GITHUB_CLIENT_SECRET }}'
            redirectURI: https://dex.thecluster.io/callback
            # Logins from accounts outside the org are refused. The credentials
            # belong to a GitHub App, which ignores the scopes Dex requests: the
            # App needs "Members: read" and "Email addresses: read", and has to be
            # installed on the org.
            orgs:
              - name: unmango
      staticClients:
        - id: kubernetes
          name: Kubernetes
          secret: '{{ .Env.KUBERNETES_CLIENT_SECRET }}'
          redirectURIs:
            - http://localhost:8000
            - http://localhost:18000
        - id: grafana
          name: Grafana
          secret: '{{ .Env.GRAFANA_CLIENT_SECRET }}'
          redirectURIs:
            - https://prom.thecluster.io/login/generic_oauth
