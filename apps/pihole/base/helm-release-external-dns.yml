apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole-a-external-dns
  namespace: pihole
spec:
  interval: 10m
  maxHistory: 2
  chart:
    spec:
      chart: external-dns
      version: 1.24.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    image:
      repository: registry.k8s.io/external-dns/external-dns
      tag: v0.24.0
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - gaea
    domainFilters:
      - thecluster.lan
    # Without gateway-httproute, Gateway API hostnames never publish.
    sources:
      - service
      - ingress
      - gateway-httproute
    interval: 30m
    env:
      - name: EXTERNAL_DNS_PIHOLE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: pihole
            key: password
      - name: EXTERNAL_DNS_PIHOLE_SERVER
        value: http://pihole-a-web.pihole.svc.cluster.local
      - name: EXTERNAL_DNS_PIHOLE_TLS_SKIP_VERIFY
        value: "true"
      - name: EXTERNAL_DNS_PIHOLE_API_VERSION
        value: "6"
    # The noop registry marks no ownership, so `sync` would delete every other record.
    policy: upsert-only
    registry: noop
    provider:
      name: pihole
---
