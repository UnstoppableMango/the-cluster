kind: HelmRelease
metadata:
  name: pihole-b
  namespace: pihole
spec:
  interval: 10m
  maxHistory: 2
  # One resolver at a time, so pihole-b keeps serving if pihole-a fails (#4458).
  dependsOn:
    - name: pihole-a
  chart:
    spec:
