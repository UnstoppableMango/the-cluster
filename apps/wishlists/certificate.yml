# A CA scoped to this database. Chaining it off thecluster.io would put the root
# in ca.crt, and Postgres would then accept any cluster-issued cert as a client.
#
# The secret names follow apps/nix-system rather than apps/keycloak: postgres-ca,
# postgres-server, and postgres-replication are the names CNPG generates for a
# Cluster named postgres, so keeping clear of them means CNPG and cert-manager
# can never both claim one.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: postgres-selfsigned
  namespace: wishlists
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-pki-ca
  namespace: wishlists
spec:
  isCA: true
  commonName: wishlists-postgres-ca
  secretName: postgres-pki-ca
  # CNPG watches a Secret it owns, but cert-manager owns this one, so the
  # operator only reloads the instances on renewal if this label is present.
  # Without it a renewed certificate sits in the Secret unread until someone
  # runs `kubectl cnpg reload`, and the instances keep serving the old one.
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  duration: 43800h0m0s # 5y
  renewBefore: 8760h0m0s # 1y
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: postgres-selfsigned
  subject:
    organizations:
      - unmango
  privateKey:
    algorithm: ECDSA
    size: 256
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: postgres
  namespace: wishlists
spec:
  ca:
    secretName: postgres-pki-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-server-cert
  namespace: wishlists
spec:
  secretName: postgres-server-cert
  # See postgres-pki-ca. This is the one that matters most: it renews every
  # 75 days, and an unreloaded expiry breaks every verify-full client.
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: postgres
  duration: 2160h0m0s # 90d
  renewBefore: 360h0m0s # 15d
  commonName: postgres-rw
  usages:
    - server auth
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
    rotationPolicy: Always
  dnsNames:
    - postgres-rw
    - postgres-rw.wishlists
    - postgres-rw.wishlists.svc
    - postgres-rw.wishlists.svc.cluster.local
    - postgres-ro
    - postgres-ro.wishlists
    - postgres-ro.wishlists.svc
    - postgres-ro.wishlists.svc.cluster.local
    - postgres-r
    - postgres-r.wishlists
    - postgres-r.wishlists.svc
    - postgres-r.wishlists.svc.cluster.local
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-replication-cert
  namespace: wishlists
spec:
  secretName: postgres-replication-cert
  # See postgres-pki-ca.
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: postgres
  duration: 2160h0m0s # 90d
  renewBefore: 360h0m0s # 15d
  # CNPG requires the replication client certificate to be issued to this exact user
  commonName: streaming_replica
  usages:
    - client auth
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
    rotationPolicy: Always
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wishlists-postgres
  namespace: wishlists
spec:
  secretName: wishlists-postgres-cert
  # No cnpg.io/reload here, unlike the three above: the HelmRelease mounts this
  # one into the wishlists pod and CNPG never reads it, so there is nothing for
  # the operator to reload.
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: postgres
  duration: 2160h0m0s # 90d
  renewBefore: 360h0m0s # 15d
  # The CN is the Postgres role the app authenticates as
  commonName: wishlists
  usages:
    - client auth
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
    rotationPolicy: Always
