apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-backups
  namespace: wishlists
spec:
  # The household's lists are tiny, so keep plenty: long enough to cover the
  # time between something going wrong and anyone noticing.
  retentionPolicy: 60d
  configuration:
    destinationPath: s3://wishlists-postgres-backups/
    endpointURL: http://rook-ceph-rgw-s3.rook-ceph.svc:80
    s3Credentials:
      accessKeyId:
        name: postgres-backups
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-backups
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  # The sidecar runs in the postgres pod beside the instance.
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
