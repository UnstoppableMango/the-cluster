# Holds everything the app stores, including the data protection keys that sign
# the session cookie.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: wishlists
spec:
  instances: 1
  # A restore must keep the name postgres (certificate.yml depends on it) and
  # bump serverName, or CNPG refuses the non-empty archive.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backups
        serverName: postgres-r1
  inheritedMetadata:
    labels:
      backup.thecluster.io/schedule: daily
      backup.thecluster.io/backblaze: 'true'
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  certificates:
    serverCASecret: postgres-pki-ca
    serverTLSSecret: postgres-server-cert
    clientCASecret: postgres-pki-ca
    replicationTLSSecret: postgres-replication-cert
  postgresql:
    # CNPG appends `host all all all scram-sha-256` after this, which keeps the
    # password as a break-glass login over non-SSL only.
    pg_hba:
      - hostssl wishlists wishlists all cert
  storage:
    storageClass: fast-rwo
    size: 5Gi
  bootstrap:
    recovery:
      source: origin
      database: wishlists
      owner: wishlists
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: postgres-backups
          serverName: postgres
