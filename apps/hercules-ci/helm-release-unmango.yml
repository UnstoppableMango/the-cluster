# One agent per Hercules CI account; keep in sync with its sibling
# helm-release-*.yml, in particular the chart version.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unmango-hercules-ci-agent
  namespace: hercules-ci
spec:
  interval: 10m
  # The agent pulls a large image and attaches a 200Gi RBD volume on a single
  # pinned node, which takes over eight minutes whenever the pod moves. The 5m
  # default fails the upgrade while the rollout is still healthy, and a failure
  # with no retries stalls the release until someone resets it by hand.
  timeout: 15m
  # Waiting on the StatefulSet makes a config fix unlandable. The agent exits on
  # a bad nix.conf, so the pod is already crashlooping when the fix arrives;
  # Helm reads that as a stalled resource, fails within seconds, and remediates
  # back to the values that caused the crash, before the pod can restart onto
  # the new ones. The rollout is the thing that would repair the pod, so its
  # health is not a signal about whether the release applied.
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    remediation:
      retries: 3
  releaseName: unmango-hercules-ci-agent
  targetNamespace: hercules-ci
  chart:
    spec:
      chart: hercules-ci-agent
      version: 0.2.1
      sourceRef:
        kind: HelmRepository
        name: unmango-charts
  values:
    existingSecret: unmango-hercules-ci-agent
    agent:
      concurrentTasks: 8
      labels:
        cluster: rosequartz
        account: unmango
    # Nix auto-GC (min-free/max-free) must stay off. The agent holds no GC root
    # while a task is in flight, so a collection between evaluation and build
    # can delete derivations the task still needs. See
    # hercules-ci/hercules-ci-agent#105. The store is bounded by the gc CronJob
    # instead, which runs with the agent scaled to zero.
    persistence:
      storageClassName: ssd-rbd
      size: 200Gi
    # Mounted at /nix, where cachix expects the store. This is the chroot store's
    # path, so the store already on the volume carries over. See
    # docs/hercules-ci-store.md.
    nixStore:
      subPath: .local/share/nix/root/nix
    # The state volume holds a Nix store, which reaches millions of files. The
    # default fsGroup policy of Always recursively chowns every one of them on
    # each pod start, which takes over an hour and blows the upgrade timeout,
    # so the release is remediated back to its previous values before the agent
    # ever starts. OnRootMismatch checks only the volume root and skips the walk.
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    # ncps proxies cache.nixos.org, so it is the only substituter. Listing both
    # costs two narinfo round trips per path. The tradeoff is that ncps being
    # down stalls builds rather than slowing them.
    extraNixConf: |
      substituters = http://ncps.nix-system.svc.cluster.local:8501
      extra-trusted-public-keys = ncps.thecluster.lan:pAJGNVSRmG7gCDSOAaiHDxLFUSdys5Pk0XvcJ5803Dw=
      # anything else: a cached miss would hide a path another agent just built.
      # Narinfo lookups are latency-bound, not bandwidth-bound. Default is 25.
      # MUST be 0 for hercules-ci
      narinfo-cache-negative-ttl = 0
      http-connections = 128
      # Nix sees the node's core count, not the pod's CPU quota. Pin builders to
      # the per-task share of the CPU limit: limits.cpu / agent.concurrentTasks.
      cores = 4
    resources:
      limits:
        cpu: "32"
        memory: 64Gi
      requests:
        cpu: "8"
        memory: 16Gi
    # gaea is the only node that can serve this budget; the pi nodes cannot.
    nodeSelector:
      kubernetes.io/hostname: gaea
