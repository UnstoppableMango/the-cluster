# One reclaim job per Hercules CI account; keep in sync with its sibling
# store-gc-*.yml, in particular the script and the threshold. The two are
# staggered because both agents sit on gaea and a cold store is expensive.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: unmango-hercules-ci-store-gc
  namespace: hercules-ci
spec:
  schedule: 0 6 * * 0
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 5400
      template:
        metadata:
          # The concurrency guard in the script selects on this.
          labels:
            app: unmango-hercules-ci-agent-store-gc
        spec:
          restartPolicy: Never
          serviceAccountName: hercules-ci-store-gc
          # RWO is per node, so this pod can hold the same volume as the agent.
          # It has to: the scale-down runs from inside the pod, which means the
          # volume must already be mounted when the agent lets go of it.
          nodeSelector:
            kubernetes.io/hostname: gaea
          # Everything under the state volume is owned by 1000:1000. The volume
          # root is root:1000, which matches the fsGroup, so OnRootMismatch
          # skips the recursive chown of a store holding millions of files.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: store-gc
              image: alpine/kubectl:1.34.1
              command:
                - sh
                - -c
                - |
                  set -eu

                  sts=unmango-hercules-ci-agent
                  nix_state=/state/.local/share/nix
                  threshold_kb=$((150 * 1024 * 1024))

                  # concurrencyPolicy: Forbid only serializes the Jobs this
                  # CronJob creates. The runbook's `kubectl create job --from`
                  # makes an independent one, which could otherwise scale the
                  # agent back up while this run is still renaming its store.
                  # This pod is Running too, so it counts itself.
                  running=$(kubectl get pods -l "app=$sts-store-gc" \
                    --field-selector=status.phase=Running -o name | wc -l)
                  if [ "$running" -gt 1 ]; then
                    echo "another reclaim is already running; leaving it alone"
                    exit 0
                  fi

                  # Installed before the threshold check, not after, so that
                  # every exit path puts the agent back. A run killed between
                  # the scale-down and the scale-up leaves the StatefulSet at
                  # zero; the next run then frees the trash below, measures
                  # under the threshold, and would otherwise exit while the
                  # agent stayed down for good. The replica count is 1 in Git,
                  # so restoring 1 is the reconciliation, and a scale to the
                  # value it already holds is a no-op.
                  trap 'kubectl scale statefulset "$sts" --replicas=1' EXIT

                  # Sweep what an interrupted run left behind before measuring,
                  # or its bytes count against this run's threshold. A failure
                  # here has to stop the run: carrying on would rename a second
                  # root aside and reclaim nothing.
                  rm -rf "$nix_state"/.trash-*

                  used_kb=$(df -P /state | awk 'NR == 2 { print $3 }')
                  if [ "$used_kb" -lt "$threshold_kb" ]; then
                    echo "store at ${used_kb}K, under ${threshold_kb}K; nothing to reclaim"
                    exit 0
                  fi

                  kubectl scale statefulset "$sts" --replicas=0
                  # Exits 0 when the pod is already gone, which is the case
                  # when this run is healing a StatefulSet left at zero.
                  kubectl wait --for=delete "pod/$sts-0" --timeout=15m

                  # Rename rather than delete, so the agent is down for a rename
                  # instead of the unlink of several million files. Nix rebuilds
                  # the store root on next start.
                  trash="$nix_state/.trash-$(date +%s)"
                  mv "$nix_state/root" "$trash"

                  kubectl scale statefulset "$sts" --replicas=1
                  trap - EXIT

                  rm -rf "$trash"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: state
                  mountPath: /state
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: state-unmango-hercules-ci-agent-0
