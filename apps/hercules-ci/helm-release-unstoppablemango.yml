# One agent per Hercules CI account; keep in sync with its sibling
# helm-release-*.yml, in particular the chart version.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unstoppablemango-hercules-ci-agent
  namespace: hercules-ci
spec:
  interval: 10m
  # The agent pulls a large image and attaches a 100Gi RBD volume on a single
  # pinned node, which takes over eight minutes whenever the pod moves. The 5m
  # default fails the upgrade while the rollout is still healthy, and a failure
  # with no retries stalls the release until someone resets it by hand.
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  releaseName: unstoppablemango-hercules-ci-agent
  targetNamespace: hercules-ci
  chart:
    spec:
      chart: hercules-ci-agent
      version: 0.2.1
      sourceRef:
        kind: HelmRepository
        name: unmango-charts
  values:
    existingSecret: unstoppablemango-hercules-ci-agent
    agent:
      concurrentTasks: 8
      labels:
        cluster: rosequartz
        account: unstoppablemango
    persistence:
      storageClassName: ssd-rbd
      size: 100Gi
    # ncps proxies cache.nixos.org, so it is the only substituter. Listing both
    # costs two narinfo round trips per path. The tradeoff is that ncps being
    # down stalls builds rather than slowing them.
    extraNixConf: |
      substituters = http://ncps.nix-system.svc.cluster.local:8501
      extra-trusted-public-keys = ncps.thecluster.lan:pAJGNVSRmG7gCDSOAaiHDxLFUSdys5Pk0XvcJ5803Dw=
      # anything else: a cached miss would hide a path another agent just built.
      # Narinfo lookups are latency-bound, not bandwidth-bound. Default is 25.
      # MUST be 0 for hercules-ci
      narinfo-cache-negative-ttl = 0
      http-connections = 128
      # Nix sees the node's core count, not the pod's CPU quota. Pin builders to
      # the per-task share of the CPU limit: limits.cpu / agent.concurrentTasks.
      cores = 4
      # The store lives on the state PVC and nothing else prunes it.
      min-free = 21474836480
      max-free = 53687091200
    resources:
      limits:
        cpu: "32"
        memory: 64Gi
      requests:
        cpu: "8"
        memory: 16Gi
    # gaea is the only node that can serve this budget; the pi nodes cannot.
    nodeSelector:
      kubernetes.io/hostname: gaea
