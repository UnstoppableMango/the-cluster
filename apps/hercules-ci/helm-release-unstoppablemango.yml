# One agent per Hercules CI account; keep in sync with its sibling
# helm-release-*.yml, in particular the chart version.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unstoppablemango-hercules-ci-agent
  namespace: hercules-ci
spec:
  interval: 10m
  releaseName: unstoppablemango-hercules-ci-agent
  targetNamespace: hercules-ci
  chart:
    spec:
      chart: hercules-ci-agent
      version: 0.2.0
      sourceRef:
        kind: HelmRepository
        name: unmango-charts
  values:
    existingSecret: unstoppablemango-hercules-ci-agent
    agent:
      concurrentTasks: 8
      labels:
        cluster: rosequartz
        account: unstoppablemango
    persistence:
      storageClassName: ssd-rbd
      size: 100Gi
    # Substitute from ncps before reaching for cache.nixos.org, the same way the
    # arc runners do. An unreachable substituter is a warning nix falls through.
    extraNixConf: |
      extra-substituters = http://ncps.nix-system.svc.cluster.local:8501
      extra-trusted-public-keys = ncps.thecluster.lan:pAJGNVSRmG7gCDSOAaiHDxLFUSdys5Pk0XvcJ5803Dw=
    resources:
      limits:
        cpu: "8"
        memory: 16Gi
      requests:
        cpu: "1"
        memory: 4Gi
