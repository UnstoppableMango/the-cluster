# Not the S3 backend: it answers with presigned bucket URLs, and the nodes
# cannot reach RGW. Layers rebuild on a miss.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage
  namespace: nixery
spec:
  storageClassName: standard-rwo
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
