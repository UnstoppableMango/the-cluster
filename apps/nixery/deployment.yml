apiVersion: apps/v1
kind: Deployment
metadata:
  name: nixery
  namespace: nixery
  labels:
    app: nixery
spec:
  replicas: 1
  # storage is ReadWriteOnce, so a surge pod would wait on the attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nixery
  template:
    metadata:
      labels:
        app: nixery
    spec:
      # Each new image evaluates nixpkgs, which is slow on a Pi and only fits
      # the larger workers' memory. arm64 images are still served from here:
      # their layers are substituted, not built.
      nodeSelector:
        kubernetes.io/arch: amd64
      # 1000 is the nixery user the image ships, which owns its Nix store and
      # database. fsGroup is what lets it write the volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: nixery
          image: ghcr.io/unmango/nixery:0-unstable-20260314
          env:
            # The image defaults to a filesystem backend under its own
            # writable layer; this points it at the volume.
            - name: NIXERY_STORAGE_BACKEND
              value: filesystem
            - name: STORAGE_PATH
              value: /var/lib/nixery/storage
            # A channel name is a moving target, so nixery caches nothing
            # keyed on it and every new tag re-evaluates nixpkgs. Pull by
            # commit hash as the tag for a reproducible, cached image.
            - name: NIXERY_CHANNEL
              value: nixos-unstable
            - name: PORT
              value: "8080"
            # nix-build substitutes every store path an image needs before
            # nixery tars it into a layer, so ncps carries most of the traffic
            # and cache.nixos.org stays the fallback.
            - name: NIX_CONFIG
              value: |
                extra-substituters = http://ncps.nix-system.svc.cluster.local:8501
                extra-trusted-public-keys = ncps.thecluster.lan:pAJGNVSRmG7gCDSOAaiHDxLFUSdys5Pk0XvcJ5803Dw=
            # Seconds a single nix-build may run. Upstream's 60 is too short
            # for a cold evaluation of nixpkgs plus substituting a closure.
            - name: NIX_TIMEOUT
              value: "300"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              # Paths nix-build substitutes land in the image's store on the
              # container's writable layer, and nothing collects them. The
              # limit makes kubelet evict and restart the pod, back to the
              # shipped store, before that fills the node's disk.
              ephemeral-storage: 5Gi
            limits:
              # Evaluating nixpkgs peaks around 2Gi.
              memory: 4Gi
              ephemeral-storage: 40Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: storage
              mountPath: /var/lib/nixery/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: storage
