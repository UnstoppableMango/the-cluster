apiVersion: apps/v1
kind: Deployment
metadata:
  name: nixery
  namespace: nixery
  labels:
    app: nixery
spec:
  replicas: 1
  # storage is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nixery
  template:
    metadata:
      labels:
        app: nixery
    spec:
      # Evaluating nixpkgs needs a large worker. arm64 layers are substituted, not built.
      nodeSelector:
        kubernetes.io/arch: amd64
      # 1000 is the image's nixery user, which owns its Nix store.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: nixery
          image: ghcr.io/unmango/nixery:0-unstable-20260314
          env:
            - name: NIXERY_STORAGE_BACKEND
              value: filesystem
            - name: STORAGE_PATH
              value: /var/lib/nixery/storage
            # Nixery caches builds only for a full commit hash, and ignores the image tag.
            # See docs/adr/0001-nixery.md.
            - name: NIXERY_CHANNEL
              value: 2786a2a72088ecf32aea5b3ec52099e6a7cff78f
            - name: PORT
              value: "8080"
            - name: NIX_CONFIG
              value: |
                extra-substituters = http://ncps.nix-system.svc.cluster.local:8501
                extra-trusted-public-keys = ncps.thecluster.lan:pAJGNVSRmG7gCDSOAaiHDxLFUSdys5Pk0XvcJ5803Dw=
            # Upstream's 60s is too short for a cold nixpkgs evaluation.
            - name: NIX_TIMEOUT
              value: "300"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              # Nothing collects substituted paths on the writable layer, so eviction resets
              # the store before the node's disk fills.
              ephemeral-storage: 5Gi
            limits:
              memory: 4Gi
              ephemeral-storage: 40Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: storage
              mountPath: /var/lib/nixery/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: storage
