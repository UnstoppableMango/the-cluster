# https://anubis.techaro.lol/docs/admin/installation#environment-variables
# Shared by every instance; an instance sets only TARGET.
apiVersion: v1
kind: ConfigMap
metadata:
  name: anubis
  namespace: anubis
data:
  BIND: ":8080"
  METRICS_BIND: ":9090"
  # cloudflared's X-Forwarded-For ends in a Cloudflare edge address.
  CUSTOM_REAL_IP_HEADER: CF-Connecting-IP
  # One pass covers every host: the cookie is on the apex, and every instance
  # shares the key.
  COOKIE_DOMAIN: thecluster.io
  # Unset, so an instance gets upstream's default botPolicies.yaml;
  # keycloak.yml sets its own.
