# One instance per protected host, since each proxies to a single TARGET.
# To add one, copy grafana.yml, list it here, and point its thecluster-io
# CloudflareTunnel rule at http://<name>.anubis.svc:80.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - anubis-key-sealed.yml
  - config.yml
  - grafana.yml
  - keycloak.yml
  - namespace.yml
configMapGenerator:
  - name: anubis-keycloak-policy
    namespace: anubis
    files:
      - policy.yaml=keycloak-policy.yaml
