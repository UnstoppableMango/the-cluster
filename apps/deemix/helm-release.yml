apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deemix
  namespace: deemix
spec:
  interval: 10m
  releaseName: deemix
  targetNamespace: deemix
  chart:
    spec:
      chart: deemix
      sourceRef:
        kind: HelmRepository
        name: unmango-charts
  values:
    global:
      uid: 1001
      gid: 1001
    existingConfigMap: deemix
    singleUser: true
    image:
      tag: 2022.12.14-r222.5d447b6035
    extraVolumes:
      - name: music
        persistentVolumeClaim:
          claimName: music
    extraVolumeMounts:
      - name: music
        mountPath: /downloads
        subPath: shared
    ingress:
      enabled: false
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 128Mi
    oauth2-proxy:
      enabled: true
      config:
        clientID: deemix
        existingSecret: deemix-oauth2-proxy
      extraEnv:
        - name: OAUTH2_PROXY_PROVIDER
          value: keycloak-oidc
        - name: OAUTH2_PROXY_UPSTREAMS
          value: http://deemix:6595
        - name: OAUTH2_PROXY_HTTP_ADDRESS
          value: http://0.0.0.0:4180
        # NOTE: deemix's external hostname could not be resolved from the stale
        # Pulumi stack config (no `hosts` config value was set) - verify against
        # the actual intended hostname before applying.
        - name: OAUTH2_PROXY_REDIRECT_URL
          value: https://deemix.thecluster.io/oauth2/callback
        - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
          value: S256
        - name: OAUTH2_PROXY_ERRORS_TO_INFO_LOG
          value: "true"
        - name: OAUTH2_PROXY_PASS_ACCESS_TOKEN
          value: "true"
        - name: OAUTH2_PROXY_COOKIE_SECURE
          value: "true"
        - name: OAUTH2_PROXY_REVERSE_PROXY
          value: "true"
        - name: OAUTH2_PROXY_PASS_USER_HEADERS
          value: "true" # Not passing them for some reasons...
        - name: OAUTH2_PROXY_EMAIL_DOMAINS
          value: "*"
        - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
          value: "true"
        - name: OAUTH2_PROXY_SET_XAUTHREQUEST
          value: "true"
        - name: OAUTH2_PROXY_ALLOWED_GROUPS
          value: /DeemixReaders,/WebAppReaders
      service:
        type: ClusterIP
      ingress:
        enabled: true
        pathType: Prefix
        path: /
        hosts:
          - deemix.thecluster.io
        annotations:
          cloudflare-tunnel-ingress-controller.strrl.dev/backend-protocol: http
      resources:
        limits:
          cpu: 10m
          memory: 64Mi
        requests:
          cpu: 10m
          memory: 64Mi
