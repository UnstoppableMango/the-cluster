apiVersion: apps/v1
kind: Deployment
metadata:
  name: ncps
  namespace: nix-system
  labels:
    app: ncps
    tier: proxy
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ncps
      tier: proxy
  template:
    metadata:
      labels:
        app: ncps
        tier: proxy
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: ncps
                    tier: proxy
      # 1000 is the ncps user in the image's /etc/passwd; ncps exits on a uid the image does not define.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # Every pod migrates, including the surge pod mid-rollout, so a schema
        # change must stay compatible with the previous image.
        - image: kalbasit/ncps:v0.10.1
          name: migrate-database
          command:
            - /bin/ncps
          args:
            - migrate
            - up
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: postgres-cert
              mountPath: /etc/ncps/postgres
              readOnly: true
          env:
            # The ncps role authenticates with the client cert. The host must be a SAN on
            # postgres-server-cert, since verify-full checks it.
            - name: CACHE_DATABASE_URL
              value: >-
                postgres://ncps@postgres-rw.nix-system.svc.cluster.local:5432/ncps?sslmode=verify-full&sslrootcert=/etc/ncps/postgres/ca.crt&sslcert=/etc/ncps/postgres/tls.crt&sslkey=/etc/ncps/postgres/tls.key
      containers:
        - image: kalbasit/ncps:v0.10.1
          name: ncps
          command:
            - /bin/ncps
          args:
            - serve
            - --cache-hostname=ncps.thecluster.lan
            # The region is a formality for request signing; RGW ignores it.
            - --cache-storage-s3-bucket=ncps-cache
            - --cache-storage-s3-endpoint=https://rook-ceph-rgw-s3-fast.rook-ceph.svc:443
            - --cache-storage-s3-region=us-east-1
            - --cache-storage-s3-force-path-style
            # Must hold the largest closure a runner pulls at once.
            - --cache-temp-path=/nar-temp-dir
            # In-flight staging lets waiting replicas serve a NAR still being fetched.
            # It needs the redis lock backend; without it a second replica hands nix truncated NARs.
            - --cache-lock-backend=redis
            - --cache-redis-addrs=redis.nix-system.svc.cluster.local:6379
            - --cache-inflight-staging-enabled
            # Also bounds in-flight staging. At the 30s default, slow upstream parts cut
            # the stream and nix refetched the whole NAR. Keep under nix's 300s
            # stalled-download-timeout.
            - --cache-cdc-chunk-wait-timeout=3m
            # RGW often exceeds the 5s default, which turns a cached NAR into a 500 or a refetch.
            - --cache-storage-stat-timeout=30s
            # Without a key path ncps keeps a generated key in the database. Git is the
            # source of truth instead, and every replica signs with the same key.
            - --cache-secret-key-path=/etc/ncps/cache.key
            # Already the default. Unsigned narinfos make nix skip the cache silently.
            - --cache-sign-narinfo
            # These two are a pair: the max size is inert without the schedule. The bucket
            # has no quota, so this is the only bound on SSD use.
            - --cache-max-size=180G
            - --cache-lru-schedule=@every 1h
            - --prometheus-enabled
            # Default is 25 per replica. The DSN cannot carry this: database/sql sends
            # pool_max_conns to the server, which rejects it.
            - --cache-database-pool-max-open-conns=10
            # A stalled upstream holds the per-hash lock every waiter blocks on for the
            # whole timeout (default 3s).
            - --cache-upstream-dialer-timeout=2s
            - --cache-upstream-response-header-timeout=2s
            - --cache-upstream-url=https://cache.nixos.org
            - --cache-upstream-url=https://nix-community.cachix.org
            - --cache-upstream-url=https://unstoppablemango.cachix.org
            - --cache-upstream-url=https://mangopkgs.cachix.org
            - --cache-upstream-url=https://unmango.cachix.org
            - --cache-upstream-public-key=cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            - --cache-upstream-public-key=nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            - --cache-upstream-public-key=unstoppablemango.cachix.org-1:m7uEI6X1Ov8DyFWJQX4WsRFRWFuzRW5c/Xms8ZaP74U=
            - --cache-upstream-public-key=mangopkgs.cachix.org-1:uJ5FgSbOg1uiXLcL0gBh1lO+y3KVuthy6UeOFYR1fLk=
            - --cache-upstream-public-key=unmango.cachix.org-1:Psb+0nALJfIcYiZLc9JYri4FJGNnzM6goZX7iLErXCI=
          env:
            # Credentials stay out of args so they do not show in `kubectl describe`.
            - name: CACHE_DATABASE_URL
              value: >-
                postgres://ncps@postgres-rw.nix-system.svc.cluster.local:5432/ncps?sslmode=verify-full&sslrootcert=/etc/ncps/postgres/ca.crt&sslcert=/etc/ncps/postgres/tls.crt&sslkey=/etc/ncps/postgres/tls.key
            - name: CACHE_STORAGE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ncps-cache-fast
                  key: AWS_ACCESS_KEY_ID
            - name: CACHE_STORAGE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ncps-cache-fast
                  key: AWS_SECRET_ACCESS_KEY
            # Replaces Go's directory list, so /etc/ssl/certs must stay for the upstream caches.
            - name: SSL_CERT_DIR
              value: /etc/ncps/ca:/etc/ssl/certs
            # About 80% of limits.memory; at the full limit GC thrashes near the ceiling.
            # Move it with the limit.
            - name: GOMEMLIMIT
              value: 1600MiB
          ports:
            - containerPort: 8501
              name: http-web
          # A busy replica can exceed the 1s default, and a liveness restart drops every
          # transfer it is serving.
          readinessProbe:
            httpGet:
              path: /nix-cache-info
              port: http-web
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /nix-cache-info
              port: http-web
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: nar-temp-dir
              mountPath: /nar-temp-dir
            - name: signing-key
              mountPath: /etc/ncps
              readOnly: true
            - name: ca
              mountPath: /etc/ncps/ca
              readOnly: true
            - name: postgres-cert
              mountPath: /etc/ncps/postgres
              readOnly: true
      volumes:
        - name: nar-temp-dir
          emptyDir:
            sizeLimit: 5Gi
        - name: signing-key
          secret:
            secretName: signing-key
            defaultMode: 0440
        - name: ca
          configMap:
            name: thecluster-lan-ca
        # pgx does not check key file permissions, so group-read is enough.
        - name: postgres-cert
          secret:
            secretName: ncps-postgres-cert
            defaultMode: 0440
