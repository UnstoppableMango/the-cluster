# ncps keeps narinfos and the NAR index in this database; only NAR bodies go
# to the bucket. CNPG generates the ncps role's password and publishes the
# connection string as Secret postgres-app, key uri, which deployment.yml
# reads, so there is no credential to seal.
#
# Two instances so a node loss fails over instead of waiting on the RBD
# image to reattach. The data is small: metadata for at most 180G of NARs.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: nix-system
spec:
  instances: 2
  # CNPG applies nothing by default, so without this the postgres pods run
  # BestEffort. Measured at 12m and 137Mi against a narinfo index this size.
  # No CPU limit: throttling the primary stalls every ncps replica behind it.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # certificate.yml issues all four. Serving and client verification share one
  # CA because the client certificates chain to it, and CNPG reads the chain
  # out of the ca.crt cert-manager writes beside the certificate.
  certificates:
    serverCASecret: postgres-pki-ca
    serverTLSSecret: postgres-server-cert
    clientCASecret: postgres-pki-ca
    replicationTLSSecret: postgres-replication-cert
  postgresql:
    # CNPG appends `host all all all scram-sha-256` after this, and the first
    # match wins, so an SSL connection as ncps can no longer fall back to the
    # password. The appended line still answers a non-SSL connection, which is
    # the break-glass path for psql.
    pg_hba:
      - hostssl ncps ncps all cert
  storage:
    storageClass: ssd-rbd
    size: 10Gi
  bootstrap:
    initdb:
      database: ncps
      owner: ncps
