# Two instances so a node loss fails over instead of waiting on an RBD reattach.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: nix-system
spec:
  instances: 2
  # Every backend adds memory, which is why deployment.yml caps the ncps pool.
  # No CPU limit: throttling the primary stalls every ncps replica.
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      memory: 1Gi
  certificates:
    serverCASecret: postgres-pki-ca
    serverTLSSecret: postgres-server-cert
    clientCASecret: postgres-pki-ca
    replicationTLSSecret: postgres-replication-cert
  postgresql:
    # CNPG appends `host all all all scram-sha-256` after this, which keeps the
    # password as a break-glass login over non-SSL only.
    pg_hba:
      - hostssl ncps ncps all cert
  storage:
    storageClass: ssd-rbd
    size: 10Gi
  bootstrap:
    initdb:
      database: ncps
      owner: ncps
