# Scoped to this database: chaining off thecluster.io would make Postgres
# accept any cluster-issued client cert.
#
# Suffixed names stay clear of the postgres-* Secrets CNPG generates, whose
# Opaque type cert-manager cannot overwrite.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: postgres-selfsigned
  namespace: nix-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-pki-ca
  namespace: nix-system
spec:
  isCA: true
  commonName: ncps-postgres-ca
  secretName: postgres-pki-ca
  # CNPG reloads on renewal only for Secrets it owns or that carry this label.
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  duration: 43800h0m0s # 5y
  renewBefore: 8760h0m0s # 1y
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: postgres-selfsigned
  subject:
    organizations:
      - unmango
  privateKey:
    algorithm: ECDSA
    size: 256
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: postgres
  namespace: nix-system
spec:
  ca:
    secretName: postgres-pki-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-server-cert
  namespace: nix-system
spec:
  secretName: postgres-server-cert
  # Renews every 75 days, and an unreloaded expiry breaks verify-full clients.
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: postgres
  duration: 2160h0m0s # 90d
  renewBefore: 360h0m0s # 15d
  commonName: postgres-rw
  usages:
    - server auth
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
    rotationPolicy: Always
  dnsNames:
    - postgres-rw
    - postgres-rw.nix-system
    - postgres-rw.nix-system.svc
    - postgres-rw.nix-system.svc.cluster.local
    - postgres-ro
    - postgres-ro.nix-system
    - postgres-ro.nix-system.svc
    - postgres-ro.nix-system.svc.cluster.local
    - postgres-r
    - postgres-r.nix-system
    - postgres-r.nix-system.svc
    - postgres-r.nix-system.svc.cluster.local
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-replication-cert
  namespace: nix-system
spec:
  secretName: postgres-replication-cert
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: postgres
  duration: 2160h0m0s # 90d
  renewBefore: 360h0m0s # 15d
  # CNPG requires the replication client certificate to be issued to this exact user
  commonName: streaming_replica
  usages:
    - client auth
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
    rotationPolicy: Always
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ncps-postgres
  namespace: nix-system
spec:
  secretName: ncps-postgres-cert
  # No cnpg.io/reload: CNPG never reads this one.
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: postgres
  duration: 2160h0m0s # 90d
  renewBefore: 360h0m0s # 15d
  # The CN is the Postgres role ncps authenticates as
  commonName: ncps
  usages:
    - client auth
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
    rotationPolicy: Always
