# ncps needs one endpoint URL with a scheme, so deployment.yml spells it out
# instead of reading the claim's ConfigMap.
#
# On SSD because slow HDD OSDs truncated NAR reads (UnstoppableMango/tdl#1365).
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: ncps-cache-fast
  namespace: nix-system
spec:
  bucketName: ncps-cache
  storageClassName: fast-bucket
