# A ClusterIP rather than a headless Service: nix resolves the substituter
# once and sticks to the first address it gets, so a headless Service would
# pin every runner to whichever replica DNS listed first. kube-proxy spreads
# connections across the ready replicas instead.
apiVersion: v1
kind: Service
metadata:
  name: ncps
  namespace: nix-system
  labels:
    app: ncps
    tier: proxy
spec:
  type: ClusterIP
  ports:
    - name: http-web
      port: 8501
  selector:
    app: ncps
    tier: proxy
