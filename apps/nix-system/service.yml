# Not headless: nix sticks to the first address it resolves, which would pin
# every runner to one replica.
apiVersion: v1
kind: Service
metadata:
  name: ncps
  namespace: nix-system
  labels:
    app: ncps
    tier: proxy
spec:
  type: ClusterIP
  ports:
    - name: http-web
      port: 8501
  selector:
    app: ncps
    tier: proxy
