apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ncps
  namespace: nix-system
  labels:
    app: ncps
    tier: proxy
spec:
  serviceName: ncps
  replicas: 1
  selector:
    matchLabels:
      app: ncps
      tier: proxy
  template:
    metadata:
      labels:
        app: ncps
        tier: proxy
    spec:
      initContainers:
        - image: alpine:3.23
          name: create-directories
          args:
            - /bin/sh
            - -c
            - "mkdir -m 0755 -p /storage/var && mkdir -m 0700 -p /storage/var/ncps && mkdir -m 0700 -p /storage/var/ncps/db"
          volumeMounts:
            - name: ncps-persistent-storage
              mountPath: /storage
        - image: kalbasit/ncps:v0.10.0-rc16
          name: migrate-database
          command:
            - /bin/ncps
          args:
            - migrate
            - up
            - --cache-database-url=sqlite:/storage/var/ncps/db/db.sqlite
          volumeMounts:
            - name: ncps-persistent-storage
              mountPath: /storage
      containers:
        - image: kalbasit/ncps:v0.10.0-rc16
          name: ncps
          command:
            - /bin/ncps
          args:
            - serve
            - --cache-hostname=ncps.thecluster.lan
            - --cache-storage-local=/storage
            - --cache-temp-path=/nar-temp-dir
            - --cache-database-url=sqlite:/storage/var/ncps/db/db.sqlite
            # Without a key path ncps generates a key on first start and keeps
            # it in the `config` table of the sqlite database, so the identity
            # every consumer trusts lives or dies with the PV. Mounting it from
            # signing-key-sealed.yml makes git the source of truth instead, and
            # a rebuilt volume keeps the same key.
            - --cache-secret-key-path=/etc/ncps/cache.key
            # Already the default, spelled out because the flag reads as a bare
            # bool in `ncps serve --help` and the alternative, passing upstream
            # narinfos through unsigned, is indistinguishable from the failure
            # this cache had. nix warns and moves on rather than failing, so the
            # cache goes quiet and the build still succeeds, just slowly.
            - --cache-sign-narinfo
            # These two are a pair. A max size on its own is inert, because the
            # schedule is what registers the cron that enforces it, and a
            # schedule on its own refuses to start. 180G against the ~237GiB the
            # 250GiB volume leaves after the ext4 reserve gives the hourly run
            # room to overshoot between passes. Under the ceiling a run costs a
            # lock and a sum over nar_files; only real evictions are slow, and
            # those hold the cache exclusively for as long as they take.
            - --cache-max-size=180G
            - --cache-lru-schedule=@every 1h
            - --cache-upstream-url=https://cache.nixos.org
            - --cache-upstream-url=https://nix-community.cachix.org
            - --cache-upstream-url=https://unstoppablemango.cachix.org
            - --cache-upstream-url=https://mangopkgs.cachix.org
            - --cache-upstream-url=https://unmango.cachix.org
            - --cache-upstream-public-key=cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            - --cache-upstream-public-key=nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            - --cache-upstream-public-key=unstoppablemango.cachix.org-1:m7uEI6X1Ov8DyFWJQX4WsRFRWFuzRW5c/Xms8ZaP74U=
            - --cache-upstream-public-key=mangopkgs.cachix.org-1:uJ5FgSbOg1uiXLcL0gBh1lO+y3KVuthy6UeOFYR1fLk=
            - --cache-upstream-public-key=unmango.cachix.org-1:Psb+0nALJfIcYiZLc9JYri4FJGNnzM6goZX7iLErXCI=
          ports:
            - containerPort: 8501
              name: http-web
          volumeMounts:
            - name: ncps-persistent-storage
              mountPath: /storage
            - name: nar-temp-dir
              mountPath: /nar-temp-dir
            - name: signing-key
              mountPath: /etc/ncps
              readOnly: true
      volumes:
        - name: ncps-persistent-storage
          persistentVolumeClaim:
            claimName: ncps
        - name: nar-temp-dir
          emptyDir:
            sizeLimit: 5Gi
        # ncps runs as root, which is what every file it writes to the PV is
        # owned by, so 0400 is readable.
        - name: signing-key
          secret:
            secretName: signing-key
            defaultMode: 0400
