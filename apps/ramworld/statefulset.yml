apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ramworld
  namespace: ramworld
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ramworld
  serviceName: ramworld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ramworld
    spec:
      # The tmpfs save directory loses unsynced data on a move, and no Pi has 18Gi.
      nodeSelector:
        kubernetes.io/hostname: gaea
      # Covers the rcon shutdown save plus the sidecar's final sync.
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: restore
          image: docker.io/instrumentisto/rsync-ssh:alpine3.23-r3
          command:
            - sh
            - -c
            # The claim is root-owned before the first sync.
            - |
              set -eu
              rsync -a --delete /mirror/ /save/
              chown -R 1000:1000 /save
          securityContext:
            runAsUser: 0
          # tmpfs pages are charged to the writer, so this must cover sizeLimit or
          # restore OOMs. Init container limits are max()'d, not summed.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 2304Mi
          volumeMounts:
            - name: save
              mountPath: /save
            - name: data
              mountPath: /mirror
              subPath: palworld/Pal/Saved
        # A native sidecar stops after the game, so its SIGTERM handler syncs the
        # shutdown save.
        - name: sync
          image: docker.io/instrumentisto/rsync-ssh:alpine3.23-r3
          restartPolicy: Always
          command:
            - sh
            - -c
            # Backgrounded so a SIGTERM mid-interval flushes at once.
            - |
              set -eu
              mirror() { rsync -a --delete /save/ /mirror/; }
              trap 'mirror; exit 0' INT TERM
              while true; do
                sleep 300 &
                wait $!
                mirror
              done
          securityContext:
            runAsUser: 0
          # Unlike restore, this need not cover sizeLimit: it only reads the ramdisk.
          # Sidecar limits are summed into the pod.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: save
              mountPath: /save
            - name: data
              mountPath: /mirror
              subPath: palworld/Pal/Saved
      containers:
        - name: palworld
          image: thijsvanloef/palworld-server-docker:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: PORT
              value: "8211"
            - name: PLAYERS
              value: "16"
            - name: ENABLE_PERF_THREADING_ARGS
              value: "true"
            - name: WORKER_THREADS_SERVER
              value: "8"
            - name: REST_API_ENABLED
              value: "true"
            - name: RCON_ENABLED
              value: "true"
            - name: RCON_PORT
              value: "25575"
            - name: TZ
              value: UTC
            - name: COMMUNITY
              value: "false"
            - name: SERVER_NAME
              value: RAMWORLD
            - name: SERVER_DESCRIPTION
              value: THECLUSTER RAMWORLD PalWorld server
            - name: CROSSPLAY_PLATFORMS
              value: (Steam,Xbox,PS5,Mac)
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ramworld
                  key: serverPassword
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ramworld
                  key: adminPassword
            - name: BASE_CAMP_WORKER_MAX_NUM
              value: "20"
          ports:
            - name: server
              containerPort: 8211
              protocol: UDP
            - name: query
              containerPort: 27015
              protocol: UDP
            - name: rest
              containerPort: 8212
              protocol: TCP
          # No CPU limit: throttling drops server ticks.
          # Requests follow adventureworld's two-player baseline. The limit is its 16Gi
          # plus the ramdisk, which is charged to the pod.
          resources:
            requests:
              cpu: "5"
              memory: 3Gi
            limits:
              memory: 18Gi
          volumeMounts:
            - name: data
              mountPath: /palworld
              subPath: palworld
            - name: save
              mountPath: /palworld/Pal/Saved
      volumes:
        # The game stalls its tick while it autosaves, and tmpfs does not wait on Ceph.
        - name: save
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: standard-rwo
        accessModes:
          - ReadWriteOncePod
        resources:
          requests:
            storage: 24Gi
