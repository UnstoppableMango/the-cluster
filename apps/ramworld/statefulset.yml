apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ramworld
  namespace: ramworld
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ramworld
  serviceName: ramworld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ramworld
    spec:
      # The save directory is a tmpfs, so the pod cannot move without losing
      # whatever has not reached the claim yet, and the 18Gi memory limit is
      # more than the pi nodes have in total.
      nodeSelector:
        kubernetes.io/hostname: gaea
      # The game saves on rcon shutdown and the sync sidecar mirrors that save
      # afterwards. The default 30s does not reliably cover both.
      terminationGracePeriodSeconds: 120
      initContainers:
        # Seeds the ramdisk from the durable copy of Pal/Saved. A first-ever
        # start finds it empty and the game generates a new world.
        - name: restore
          image: docker.io/instrumentisto/rsync-ssh:alpine3.23-r3
          command:
            - sh
            - -c
            # rsync restores ownership from the claim, which is root-owned
            # before the first sync, so chown afterwards or the game cannot
            # write as PUID 1000.
            - |
              set -eu
              rsync -a --delete /mirror/ /save/
              chown -R 1000:1000 /save
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: save
              mountPath: /save
            - name: data
              mountPath: /mirror
              subPath: palworld/Pal/Saved
        # A native sidecar, not an ordinary container: kubelet stops ordinary
        # containers first and sidecars after, so the SIGTERM handler below
        # runs once the game has already written its shutdown save.
        - name: sync
          image: docker.io/instrumentisto/rsync-ssh:alpine3.23-r3
          restartPolicy: Always
          command:
            - sh
            - -c
            # sleep runs in the background and is waited on so a SIGTERM
            # arriving mid-interval flushes immediately instead of sitting out
            # the remaining five minutes.
            - |
              set -eu
              mirror() { rsync -a --delete /save/ /mirror/; }
              trap 'mirror; exit 0' INT TERM
              while true; do
                sleep 300 &
                wait $!
                mirror
              done
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: save
              mountPath: /save
            - name: data
              mountPath: /mirror
              subPath: palworld/Pal/Saved
      containers:
        - name: palworld
          image: thijsvanloef/palworld-server-docker:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: PORT
              value: "8211"
            - name: PLAYERS
              value: "16"
            - name: ENABLE_PERF_THREADING_ARGS
              value: "true"
            - name: WORKER_THREADS_SERVER
              value: "8"
            - name: REST_API_ENABLED
              value: "true"
            - name: RCON_ENABLED
              value: "true"
            - name: RCON_PORT
              value: "25575"
            - name: TZ
              value: UTC
            - name: COMMUNITY
              value: "false"
            - name: SERVER_NAME
              value: RAMWORLD
            - name: SERVER_DESCRIPTION
              value: THECLUSTER RAMWORLD PalWorld server
            - name: CROSSPLAY_PLATFORMS
              value: (Steam,Xbox,PS5,Mac)
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ramworld
                  key: serverPassword
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ramworld
                  key: adminPassword
            - name: BASE_CAMP_WORKER_MAX_NUM
              value: "20"
          ports:
            - name: server
              containerPort: 8211
              protocol: UDP
            - name: query
              containerPort: 27015
              protocol: UDP
            - name: rest
              containerPort: 8212
              protocol: TCP
          # No CPU limit: throttling drops server ticks, and
          # WORKER_THREADS_SERVER already bounds the thread count.
          # Requests carry over from adventureworld, whose two-player baseline
          # measured ~3.2 CPU median peaking past 4 on a flat 1.9Gi resident.
          # The limit is adventureworld's 16Gi plus the ramdisk: a
          # medium: Memory emptyDir is charged to the pod, so a save directory
          # that grows toward its sizeLimit would otherwise OOM-kill the game.
          resources:
            requests:
              cpu: "5"
              memory: 3Gi
            limits:
              memory: 18Gi
          volumeMounts:
            # The 4.6Gi game install, which steamcmd writes on first boot and
            # updates in place. It is read-mostly and gains nothing from RAM.
            - name: data
              mountPath: /palworld
              subPath: palworld
            # Mounted inside the install and shadowing the copy on the claim.
            # Only this subtree is hot, so only this subtree is a ramdisk.
            - name: save
              mountPath: /palworld/Pal/Saved
      volumes:
        # The live save directory: the game stalls its tick while it autosaves,
        # and a tmpfs write does not wait on Ceph. The world is 6Mi today, so
        # 2Gi is headroom for a session's worth of growth and the rolling
        # backup subdirectory the game keeps beside it.
        - name: save
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
  volumeClaimTemplates:
    # Durable storage for both halves: the game install under palworld/, and
    # the mirror of the ramdisk under palworld/Pal/Saved, which the game
    # container never sees because the ramdisk is mounted over it.
    - metadata:
        name: data
      spec:
        storageClassName: standard-rwo
        accessModes:
          - ReadWriteOncePod
        resources:
          requests:
            storage: 24Gi
