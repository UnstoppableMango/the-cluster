apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unstoppablemango-runners
  namespace: arc-runners
spec:
  chart:
    spec:
      chart: charts/arc-runner-scale-set
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 10m
  values:
    chartRef:
      name: gha-runner-scale-set
      namespace: arc-system
    defaults:
      githubConfigSecret: thecluster-bot
      # The dind wiring below is spelled out rather than left to
      # `containerMode: dind`. That mode renders its own init-dind-externals and
      # dind containers and drops any the values supply, so it is the one shape
      # in which those two cannot be given resources. Rendering both ways
      # produces the same pod otherwise. The cost is that a chart upgrade no
      # longer updates this block; compare it against the chart's
      # _helpers.tpl when bumping gha-runner-scale-set.
      template:
        spec:
          # Makes gid 1001 the group owner of the work and nix volumes below and
          # adds it to the runner process's supplementary groups. The nix volume
          # is then handed to the runner outright by init-nix.
          securityContext:
            fsGroup: 1001
          initContainers:
            - name: init-dind-externals
              image: ghcr.io/unmango/actions-runner:2.337.0@sha256:7871210f6be2fd471a21b199922b9067c0f5da15e31987dd84f29d97690a2a90
              command: [cp, -r, /home/runner/externals/., /home/runner/tmpDir/]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: dind-externals
                  mountPath: /home/runner/tmpDir
            # The image ships /nix as an empty directory owned by the runner,
            # but a volume mounted over it brings its own ownership. Kubelet
            # leaves a CSI volume root:fsGroup 2775, and the setgid bit
            # propagates into every directory nix creates under it, store paths
            # and build directories alike. Hand the mount to the runner instead,
            # mode 0755, so it matches the empty /nix the image ships. Not
            # recursive: the volume is ephemeral and holds only lost+found here.
            #
            # The mode is five digits because a numeric chmod of four digits or
            # fewer preserves a directory's setuid and setgid bits; 00755 is
            # what actually clears the setgid.
            #
            # Ordered ahead of dind, whose restartPolicy: Always makes it a
            # native sidecar that kubelet waits on before running any later init
            # container. This one has no reason to wait for dockerd.
            - name: init-nix
              image: ghcr.io/unmango/actions-runner:2.337.0@sha256:7871210f6be2fd471a21b199922b9067c0f5da15e31987dd84f29d97690a2a90
              command: [sh, -c, 'chown runner:runner /nix && chmod 00755 /nix']
              securityContext:
                runAsUser: 0
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: nix
                  mountPath: /nix
            - name: dind
              image: docker:29.8.0-dind@sha256:5efed980cba3fc126cf54e21a5a6ff8849d05b6e0623d6e7612f48e9cd6cd17e
              args:
                - dockerd
                - --host=unix:///var/run/docker.sock
                - --group=$(DOCKER_GROUP_GID)
              env:
                - name: DOCKER_GROUP_GID
                  value: "123"
              securityContext:
                privileged: true
              restartPolicy: Always
              startupProbe:
                exec:
                  command: [docker, info]
                initialDelaySeconds: 0
                failureThreshold: 24
                periodSeconds: 5
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 4Gi
              volumeMounts:
                - name: work
                  mountPath: /home/runner/_work
                - name: dind-sock
                  mountPath: /var/run
                - name: dind-externals
                  mountPath: /home/runner/externals
          containers:
            - name: runner
              image: ghcr.io/unmango/actions-runner:2.337.0@sha256:7871210f6be2fd471a21b199922b9067c0f5da15e31987dd84f29d97690a2a90
              command: [/home/runner/run.sh]
              env:
                # ncps binary cache, reachable in-cluster only. The image's nix
                # is daemonless, so there is no daemon to gate these against a
                # trusted-users list and every setting here applies as written.
                - name: NIX_CONFIG
                  value: |
                    extra-substituters = http://ncps.nix-system.svc.cluster.local:8501
                    extra-trusted-public-keys = ncps.thecluster.lan:pAJGNVSRmG7gCDSOAaiHDxLFUSdys5Pk0XvcJ5803Dw=
                - name: DOCKER_HOST
                  value: unix:///var/run/docker.sock
                - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                  value: "120"
              # An idle runner measures ~1m CPU and ~60Mi, so requesting the
              # limit reserved 8 cores per replica and filled gaea with runners
              # doing nothing. Requests now cover the idle floor and a build
              # still bursts to the limit. The tradeoff is that requests no
              # longer cap how many runners land on one node, so a burst of
              # concurrent builds oversubscribes it rather than queueing.
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "8"
                  memory: 8Gi
              volumeMounts:
                - name: work
                  mountPath: /home/runner/_work
                - name: dind-sock
                  mountPath: /var/run
                # The image ships /nix empty and its nix.conf sets
                # `store = local`, so the store, its database, and nix's build
                # directory all land here. Left unmounted that is the
                # container's overlayfs layer, where nix fails to tear down a
                # build directory it just emptied:
                #
                #   error: cannot unlink ".../project/.git": Directory not empty
                #
                # It bites the derivations that write many small files,
                # treefmt's `git init && git add .` check being the reliable
                # one. The image's nix, gnumake and xz are static copies in
                # /usr/local/bin with their store references nuked, so they keep
                # working with a volume over /nix.
                - name: nix
                  mountPath: /nix
          volumes:
            - name: dind-sock
              emptyDir: {}
            - name: dind-externals
              emptyDir: {}
            - name: work
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    accessModes: [ReadWriteOnce]
                    storageClassName: fast-rwo
                    resources:
                      requests:
                        storage: 5Gi
            # An emptyDir does not work here. Kubelet creates one mode 0777, and
            # nix refuses a build directory with a world-writable ancestor. A CSI
            # volume comes up 2775 root:fsGroup, which init-nix then narrows to
            # 0755 runner:runner.
            - name: nix
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    accessModes: [ReadWriteOnce]
                    storageClassName: fast-rwo
                    resources:
                      requests:
                        storage: 75Gi
      listenerTemplate:
        spec:
          containers:
            - name: listener
              resources:
                limits:
                  cpu: 25m
                  memory: 64Mi
                requests:
                  cpu: 2m
                  memory: 16Mi

    scaleSets:
    - name: dotfiles
      githubConfigUrl: https://github.com/UnstoppableMango/dotfiles
      minRunners: 1

    - name: the-cluster
      githubConfigUrl: https://github.com/UnstoppableMango/the-cluster
      minRunners: 4

    - name: ux
      githubConfigUrl: https://github.com/UnstoppableMango/ux
      minRunners: 1

    - name: thecluster.lan
      githubConfigUrl: https://github.com/UnstoppableMango/thecluster.lan

    - name: thecluster.io
      githubConfigUrl: https://github.com/UnstoppableMango/thecluster.io

    - name: lang
      githubConfigUrl: https://github.com/UnstoppableMango/lang

    - name: xmage-docker
      githubConfigUrl: https://github.com/UnstoppableMango/xmage-docker

    - name: nixos
      githubConfigUrl: https://github.com/UnstoppableMango/nixos
      minRunners: 1

    - name: nix
      githubConfigUrl: https://github.com/UnstoppableMango/nix
      minRunners: 1

    - name: openapi2go
      githubConfigUrl: https://github.com/UnstoppableMango/openapi2go

    - name: a2b
      githubConfigUrl: https://github.com/UnstoppableMango/a2b

    - name: unstoppablemango.io
      githubConfigUrl: https://github.com/UnstoppableMango/unstoppablemango.io

    - name: github
      githubConfigUrl: https://github.com/UnstoppableMango/github

    - name: resume
      githubConfigUrl: https://github.com/UnstoppableMango/resume

    - name: renovate-config
      githubConfigUrl: https://github.com/UnstoppableMango/renovate-config

    - name: minecraft-manager
      githubConfigUrl: https://github.com/UnstoppableMango/minecraft-manager

    - name: wireguard-cni
      githubConfigUrl: https://github.com/UnstoppableMango/wireguard-cni

    - name: fenced
      githubConfigUrl: https://github.com/UnstoppableMango/fenced

    - name: pia-manual-connections
      githubConfigUrl: https://github.com/UnstoppableMango/pia-manual-connections

    - name: x12
      githubConfigUrl: https://github.com/UnstoppableMango/x12

    - name: audio
      githubConfigUrl: https://github.com/UnstoppableMango/audio

    - name: multi-downloader-nx-docker
      githubConfigUrl: https://github.com/UnstoppableMango/multi-downloader-nx-docker

    - name: slacker-bot
      githubConfigUrl: https://github.com/UnstoppableMango/slacker-bot

    - name: devcontainers
      githubConfigUrl: https://github.com/UnstoppableMango/devcontainers

    - name: johnston-dems-mailer
      githubConfigUrl: https://github.com/UnstoppableMango/johnston-dems-mailer

    - name: tdl
      githubConfigUrl: https://github.com/UnstoppableMango/tdl

    - name: plex-operator
      githubConfigUrl: https://github.com/UnstoppableMango/plex-operator

    - name: advent-of-code
      githubConfigUrl: https://github.com/UnstoppableMango/advent-of-code

    - name: fp-cs
      githubConfigUrl: https://github.com/UnstoppableMango/fp-cs

    - name: ocaml-go
      githubConfigUrl: https://github.com/UnstoppableMango/ocaml-go

    - name: erik
      githubConfigUrl: https://github.com/UnstoppableMango/erik

    - name: sql2csharp
      githubConfigUrl: https://github.com/UnstoppableMango/sql2csharp

    - name: terraform2crd
      githubConfigUrl: https://github.com/UnstoppableMango/terraform2crd

    - name: wireguard-operator
      githubConfigUrl: https://github.com/UnstoppableMango/wireguard-operator

    - name: pulumi-kubernetes-the-hard-way
      githubConfigUrl: https://github.com/UnstoppableMango/pulumi-kubernetes-the-hard-way

    - name: blocky-controller
      githubConfigUrl: https://github.com/UnstoppableMango/blocky-controller

    - name: ihfs
