apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bitwarden
  namespace: bitwarden
spec:
  interval: 10m
  maxHistory: 2
  releaseName: bitwarden
  targetNamespace: bitwarden
  chart:
    spec:
      chart: self-host
      version: 2.5.6
      sourceRef:
        kind: HelmRepository
        name: bitwarden
  values:
    fullnameOverride: bitwarden
    general:
      domain: bitwarden.thecluster.io
      databaseProvider: postgres
      ingress:
        enabled: false
      # The chart's HTTPRoute carries prefix rewrites a bare tunnel rule cannot do.
      gateway:
        enabled: true
        parentRefs:
          - name: cloudflare
            namespace: cloudflare-system
            sectionName: bitwarden
      volumeAccessMode: ReadWriteMany
      email:
        replyToEmail: bitwarden@thecluster.io
        smtpHost: email-smtp.us-east-2.amazonaws.com
        smtpPort: "587"
        smtpSsl: "false"
    sharedStorageClassName: standard-rwx
    secrets:
      secretName: bitwarden-secret
    database:
      enabled: false
    # Anchors for every component that talks to Postgres; the chart ignores the keys.
    #
    # The role authenticates with its client certificate. The host must be a SAN
    # on postgres-server-cert for VerifyFull.
    #
    # A container env entry overrides the stale connectionString in
    # bitwarden-secret, so that secret need not be resealed.
    _postgresConnection: &postgresConnection
      name: globalSettings__postgreSql__connectionString
      value: >-
        Host=postgres-rw.bitwarden.svc.cluster.local;Port=5432;Database=bitwarden;Username=bitwarden;SSL Mode=VerifyFull;Root Certificate=/etc/bitwarden/postgres/ca.crt;SSL Certificate=/etc/bitwarden/postgres/tls.crt;SSL Key=/etc/bitwarden/postgres/tls.key
    _postgresVolume: &postgresVolume
      name: postgres-cert
      secret:
        secretName: bitwarden-postgres-cert
        defaultMode: 0440
    _postgresMount: &postgresMount
      name: postgres-cert
      mountPath: /etc/bitwarden/postgres
      readOnly: true
    # The chart sets no pod security context, so without fsGroup a non-root
    # container cannot read the root-owned key.
    _postgresSecurityContext: &postgresSecurityContext
      fsGroup: 1000
    component:
      # For postgres the chart renders empty db-migrator Jobs, so this runs the migrations.
      admin:
        extraEnv: [*postgresConnection]
        extraVolumes: [*postgresVolume]
        extraVolumeMounts: [*postgresMount]
        podSecurityContext: *postgresSecurityContext
      api:
        extraEnv: [*postgresConnection]
        extraVolumes: [*postgresVolume]
        extraVolumeMounts: [*postgresMount]
        podSecurityContext: *postgresSecurityContext
      events:
        extraEnv: [*postgresConnection]
        extraVolumes: [*postgresVolume]
        extraVolumeMounts: [*postgresMount]
        podSecurityContext: *postgresSecurityContext
      identity:
        extraEnv: [*postgresConnection]
        extraVolumes: [*postgresVolume]
        extraVolumeMounts: [*postgresMount]
        podSecurityContext: *postgresSecurityContext
      notifications:
        extraEnv: [*postgresConnection]
        extraVolumes: [*postgresVolume]
        extraVolumeMounts: [*postgresMount]
        podSecurityContext: *postgresSecurityContext
      scim:
        extraEnv: [*postgresConnection]
        extraVolumes: [*postgresVolume]
        extraVolumeMounts: [*postgresMount]
        podSecurityContext: *postgresSecurityContext
      sso:
        extraEnv: [*postgresConnection]
        extraVolumes: [*postgresVolume]
        extraVolumeMounts: [*postgresMount]
        podSecurityContext: *postgresSecurityContext
    jobs:
      setup:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
  # jobs.setup.resources misses the generate-identity-cert init container.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Job
              name: bitwarden-setup
            patch: |-
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: bitwarden-setup
              spec:
                template:
                  spec:
                    initContainers:
                      - name: generate-identity-cert
                        resources:
                          requests:
                            cpu: 50m
                            memory: 64Mi
                          limits:
                            memory: 128Mi
