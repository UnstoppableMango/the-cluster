apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collabora
  namespace: collabora
spec:
  interval: 10m
  maxHistory: 2
  releaseName: collabora
  targetNamespace: collabora
  chart:
    spec:
      chart: collabora-online
      version: 1.3.7
      sourceRef:
        kind: HelmRepository
        name: collabora
  # The chart has no dnsConfig value. ndots:1 for the same reason as in
  # apps/nextcloud: the names this resolves (cloud.thecluster.io for WOPI
  # callbacks) are public, and the default ndots:5 walks every cluster search
  # domain before trying them.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: collabora
            patch: |-
              - op: add
                path: /spec/template/spec/dnsConfig
                value:
                  options:
                    - name: ndots
                      value: "1"
  # https://github.com/CollaboraOnline/online/blob/master/kubernetes/helm/collabora-online/values.yaml
  values:
    fullnameOverride: collabora
    image:
      repository: docker.io/collabora/code
      tag: 26.04.5.2.1
    # One replica. A document's editors must all reach the same instance, which
    # more replicas would need WOPISrc-aware routing for.
    replicaCount: 1
    autoscaling:
      enabled: false
    collabora:
      # Only Nextcloud may open documents here.
      aliasgroups:
        - host: https://cloud.thecluster.io:443
      server_name: office.thecluster.io
      # TLS terminates at the Gateway or the Cloudflare edge.
      extra_params: --o:ssl.enable=false --o:ssl.termination=true
      # The admin console at /browser/dist/admin/admin.html.
      existingSecret:
        enabled: true
        secretName: collabora-admin
        usernameKey: username
        passwordKey: password
    # No measured usage yet. Revisit once there is some, per AGENTS.md. Each
    # open document is a forked LibreOffice process, so memory scales with
    # documents, not users. No CPU limit: rendering is the latency users see.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
