apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collabora
  namespace: collabora
spec:
  interval: 10m
  maxHistory: 2
  releaseName: collabora
  targetNamespace: collabora
  chart:
    spec:
      chart: collabora-online
      version: 1.3.9
      sourceRef:
        kind: HelmRepository
        name: collabora
  # The chart has no dnsConfig value. ndots:1 as in apps/nextcloud.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: collabora
            patch: |-
              - op: add
                path: /spec/template/spec/dnsConfig
                value:
                  options:
                    - name: ndots
                      value: "1"
  # https://github.com/CollaboraOnline/online/blob/master/kubernetes/helm/collabora-online/values.yaml
  values:
    fullnameOverride: collabora
    image:
      repository: docker.io/collabora/code
      tag: 26.04.6.2.1
    # More replicas need WOPISrc-aware routing.
    replicaCount: 1
    autoscaling:
      enabled: false
    collabora:
      aliasgroups:
        - host: https://cloud.thecluster.io:443
      server_name: office.thecluster.io
      extra_params: --o:ssl.enable=false --o:ssl.termination=true
      existingSecret:
        enabled: true
        secretName: collabora-admin
        usernameKey: username
        passwordKey: password
    # TODO: size from measured usage. Memory scales with open documents.
    # No CPU limit: rendering is the latency users see.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
