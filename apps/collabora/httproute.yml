# Split horizon, as in apps/nextcloud.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: collabora
  namespace: collabora
spec:
  parentRefs:
    - name: cloudflare
      namespace: cloudflare-system
      sectionName: office
    - name: nginx
      namespace: nginx-gateway
      sectionName: office
  hostnames:
    - office.thecluster.io
  rules:
    - backendRefs:
        - name: collabora
          port: 9980
