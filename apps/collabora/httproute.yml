# The same split horizon as cloud.thecluster.io in apps/nextcloud: browsers
# load the editor from this name directly, on whichever network they are on.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: collabora
  namespace: collabora
spec:
  parentRefs:
    - name: cloudflare
      namespace: cloudflare-system
      sectionName: office
    - name: nginx
      namespace: nginx-gateway
      sectionName: office
  hostnames:
    - office.thecluster.io
  rules:
    - backendRefs:
        - name: collabora
          port: 9980
