# The office listener's certificate lives here so a failed issuance holds up
# only this app.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: office
  namespace: collabora
spec:
  secretName: office-tls
  dnsNames:
    - office.thecluster.io
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: nginx-gateway-tls
  namespace: collabora
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: nginx-gateway
  to:
    - group: ""
      kind: Secret
      name: office-tls
