apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-nginx-gateway
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/nginx-gateway-system/rosequartz
  interval: 10m
  prune: true
  wait: true
  dependsOn:
    - name: infra-gateway-api
    - name: infra-configs-nginx-gateway
    # The gateway asks for a specific address, so the pool has to exist first.
    - name: infra-configs-metallb
