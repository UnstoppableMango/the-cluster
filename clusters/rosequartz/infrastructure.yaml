    name: flux-system
  path: ./infrastructure/controllers/cloudflare-operator-system
  interval: 10m
  prune: true
  wait: true
  dependsOn:
    # The controller directory ships the operator's credentials SealedSecret, so
    # the CRD has to exist or nothing on this path applies.
    - name: infra-sealed-secrets
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
