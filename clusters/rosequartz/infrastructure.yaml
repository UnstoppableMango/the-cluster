apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs-trust-bundle
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs/cert-manager-system/bundle
  interval: 10m
  prune: true
  wait: true
  # Fans the thecluster.lan CA out to every namespace as ConfigMap
  # thecluster-lan-ca. ncps mounts it to trust the RGW certificate.
  dependsOn:
    # The Bundle CRD comes from the trust-manager release in this directory.
    - name: infra-cert-manager
    # The source Secret is the CA the issuers Kustomization creates.
    - name: infra-configs-cert-manager
