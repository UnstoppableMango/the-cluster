  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs/cloudflare-operator-system
  interval: 10m
  prune: true
  # No wait: the ClusterTunnel takes a while to come up and nothing here gates
  # on it.
  dependsOn:
    - name: infra-cloudflare-operator
---
