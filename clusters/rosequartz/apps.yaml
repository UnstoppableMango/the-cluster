apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-nix-system
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/nix-system
  interval: 10m
  prune: true
  wait: true
  dependsOn:
    - name: infra-configs-rook-ceph-storage
    - name: infra-cnpg-system
    - name: infra-cert-manager
    - name: infra-configs-trust-bundle
    - name: infra-sealed-secrets
    - name: infra-nginx-gateway
    - name: infra-monitoring-crds
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-arc-runners
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/arc-runners
  interval: 10m
  prune: true
  wait: true
  # No dependsOn on apps-nix-system: nix falls through an unreachable ncps,
  # and an ncps failure must not take every runner down.
  dependsOn:
    - name: infra-arc-system
    - name: infra-sealed-secrets
    - name: infra-configs-trust-bundle
---
